      - slug: cron-validator-exercise
        title: Cron Expression Validator
        type: exercise
        duration_minutes: 20
        content_file: lessons/cron-validator-exercise.md
        exercises:
          - slug: linux-cron-validator
            title: Cron Expression Validator
            difficulty: medium
            points: 20
            prompt_file: lessons/linux-cron-validator.prompt.md
            supported_languages: [python]
            tags: [cron, scheduling, linux]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                def validate_field(field, low, high):
                    # TODO: return True if field is valid for range [low, high]
                    pass

                n = int(input())
                for _ in range(n):
                    parts = input().split()
                    # TODO: validate and print VALID or INVALID
                    pass
            solution_code:
              python: |
                def validate_field(field, low, high):
                    if field == '*':
                        return True
                    if field.startswith('*/'):
                        return False
                    if '-' in field:
                        parts = field.split('-')
                        if len(parts) != 2:
                            return False
                        try:
                            a, b = int(parts[0]), int(parts[1])
                            return low <= a <= high and low <= b <= high and a <= b
                        except ValueError:
                            return False
                    try:
                        val = int(field)
                        return low <= val <= high
                    except ValueError:
                        return False

                n = int(input())
                for _ in range(n):
                    parts = input().split()
                    if len(parts) != 5:
                        print('INVALID')
                        continue
                    minute, hour, dom, month, dow = parts
                    if (validate_field(minute, 0, 59) and
                            validate_field(hour, 0, 23) and
                            validate_field(dom, 1, 31) and
                            validate_field(month, 1, 12) and
                            validate_field(dow, 0, 7)):
                        print('VALID')
                    else:
                        print('INVALID')
            test_cases:
              - name: basic-mix
                stdin: "4\n0 2 * * 0\n60 25 1 1 1\n*/5 * * * *\n30 8 15 13 3\n"
                expected_stdout: "VALID\nINVALID\nINVALID\nINVALID"
                is_hidden: false
                weight: 1
              - name: boundary-valid
                stdin: "2\n0 0 1 1 0\n59 23 31 12 7\n"
                expected_stdout: "VALID\nVALID"
                is_hidden: false
                weight: 1
              - name: range-valid
                stdin: "1\n1-5 * * * *\n"
                expected_stdout: "VALID"
                is_hidden: false
                weight: 1
              - name: dom-and-dow-bounds
                stdin: "2\n0 0 0 1 1\n5 12 * * 8\n"
                expected_stdout: "INVALID\nINVALID"
                is_hidden: true
                weight: 1
              - name: wildcard-all-fields
                stdin: "1\n* * * * *\n"
                expected_stdout: "VALID"
                is_hidden: true
                weight: 1
              - name: wrong-field-count
                stdin: "2\n0 2 *\n0 2 * * * *\n"
                expected_stdout: "INVALID\nINVALID"
                is_hidden: true
                weight: 1
