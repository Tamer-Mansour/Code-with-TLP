            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    severity = ['EMERG', 'ALERT', 'CRIT', 'ERR', 'WARNING', 'NOTICE', 'INFO', 'DEBUG']
                    n = int(input())
                    lines = [input() for _ in range(n)]
                    threshold = input().strip()
                    # TODO: filter and print matching lines, then summary
                    pass

                solve()
            solution_code:
              python: |
                severity = ['EMERG', 'ALERT', 'CRIT', 'ERR', 'WARNING', 'NOTICE', 'INFO', 'DEBUG']
                n = int(input())
                lines = [input() for _ in range(n)]
                threshold = input().strip()
                threshold_level = severity.index(threshold)
                matched = []
                for line in lines:
                    level = line.split(':')[0].strip()
                    if level in severity and severity.index(level) <= threshold_level:
                        matched.append(line)
                for line in matched:
                    print(line)
                print(f'Matched: {len(matched)} of {n}')
            test_cases:
              - name: warning-threshold
                stdin: "5\nERR: disk full\nINFO: service started\nCRIT: kernel panic\nDEBUG: connection trace\nWARNING: high load\nWARNING\n"
                expected_stdout: "ERR: disk full\nCRIT: kernel panic\nWARNING: high load\nMatched: 3 of 5"
                is_hidden: false
                weight: 1
              - name: crit-threshold
                stdin: "3\nDEBUG: verbose trace\nEMERG: power failure\nALERT: memory exhausted\nCRIT\n"
                expected_stdout: "EMERG: power failure\nALERT: memory exhausted\nMatched: 2 of 3"
                is_hidden: false
                weight: 1
              - name: debug-threshold-all-match
