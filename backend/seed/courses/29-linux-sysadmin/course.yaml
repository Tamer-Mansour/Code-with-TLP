      - slug: permissions-octal-exercise
        title: Permissions to Octal
        type: exercise
        duration_minutes: 15
        content_file: lessons/permissions-octal-exercise.md
        exercises:
          - slug: linux-perm-octal
            title: rwx to Octal Permissions
            difficulty: easy
            points: 15
            prompt_file: lessons/linux-perm-octal.prompt.md
            supported_languages: [python]
            tags: [unix, permissions]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys

                def to_octal(rwx):
                    # rwx is 9 chars like "rwxr-xr-x"
                    out = ""
                    for i in range(0, 9, 3):
                        triple = rwx[i:i+3]
                        v = (4 if triple[0] == 'r' else 0) + \
                            (2 if triple[1] == 'w' else 0) + \
                            (1 if triple[2] == 'x' else 0)
                        out += str(v)
                    return out

                def solve():
                    lines = [ln.strip() for ln in sys.stdin.read().splitlines() if ln.strip()]
                    for ln in lines:
                        print(to_octal(ln))

                solve()
            test_cases:
              - name: standard
                stdin: "rwxr-xr-x\nrw-r--r--\nrwxrwxrwx\n"
                expected_stdout: "755\n644\n777"
                is_hidden: false
                weight: 1
              - name: minimal
                stdin: "---------\n"
                expected_stdout: "000"
                is_hidden: false
                weight: 1
              - name: mixed
                stdin: "rwx------\nr--r--r--\n-w-r-x-w-\n"
                expected_stdout: "700\n444\n252"
                is_hidden: true
                weight: 1
              - name: empty
                stdin: "\n"
                expected_stdout: ""
                is_hidden: true
                weight: 1
      - slug: bash-word-count-exercise
        title: Word Frequency Counter
        type: exercise
        duration_minutes: 20
        content_file: lessons/bash-word-count-exercise.md
        exercises:
          - slug: linux-word-count
            title: Word Frequency Counter
            difficulty: medium
            points: 20
            prompt_file: lessons/linux-word-count.prompt.md
            supported_languages: [python]
            tags: [text-processing, scripting]
            time_limit_ms: 3000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read()
                    # TODO: count words and print sorted results
                    pass

                solve()
            solution_code:
              python: |
                import sys
                from collections import Counter

                def solve():
                    data = sys.stdin.read()
                    words = data.lower().split()
                    counts = Counter(words)
                    # Sort by count descending, then word ascending
                    for word, count in sorted(counts.items(), key=lambda x: (-x[1], x[0])):
                        print(f"{word} {count}")

                solve()
            test_cases:
              - name: basic
                stdin: "hello world hello\nworld hello\n"
                expected_stdout: "hello 3\nworld 2"
                is_hidden: false
                weight: 1
              - name: single-word
                stdin: "linux\n"
                expected_stdout: "linux 1"
                is_hidden: false
                weight: 1
              - name: case-insensitive
                stdin: "The the THE\n"
                expected_stdout: "the 3"
                is_hidden: false
                weight: 1
              - name: tie-alphabetical
                stdin: "a b c\n"
                expected_stdout: "a 1\nb 1\nc 1"
                is_hidden: true
                weight: 1
              - name: multi-frequency
                stdin: "foo foo foo bar bar baz\n"
                expected_stdout: "foo 3\nbar 2\nbaz 1"
                is_hidden: true
                weight: 1

