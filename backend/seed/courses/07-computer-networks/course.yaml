            solution_code:
              python: |
                import sys

                def solve():
                    window_size = int(sys.stdin.readline().strip())
                    outcomes = list(map(int, sys.stdin.readline().split()))
                    total_frames = len(outcomes)
                    frame_outcomes = list(outcomes)
                    delivered = 0
                    transmissions = 0

                    while delivered < total_frames:
                        window_end = min(delivered + window_size, total_frames)
                        error_at = None
                        for i in range(delivered, window_end):
                            transmissions += 1
                            if frame_outcomes[i] == 0:
                                error_at = i
                                break
                        if error_at is None:
                            delivered = window_end
                        else:
                            delivered += error_at - delivered
                            frame_outcomes[error_at] = 1

                    print("Total transmissions: " + str(transmissions))

                solve()
            test_cases:
