        exercises:
          - slug: computer-hamming
            title: "Hamming(7,4) Error Detection and Correction"
            difficulty: medium
            points: 20
            prompt_file: lessons/computer-hamming.prompt.md
            supported_languages: [python]
            tags: [networking, data-link, error-correction, hamming, fec]
            time_limit_ms: 3000
            memory_limit_mb: 256
            starter_code:
              python: |
                import sys

                def encode_hamming(data4):
                    # data4: 4-char string "d1d2d3d4"
                    # Return 7-char encoded codeword
                    pass

                def detect_correct(received7):
                    # received7: 7-char string
                    # Return (error_pos, corrected_codeword, data4)
                    pass

                data_input = sys.stdin.readline().strip()
                received_input = sys.stdin.readline().strip()

                encoded = encode_hamming(data_input)
                print("Encoded: " + encoded)

                error_pos, corrected, data_out = detect_correct(received_input)
                if error_pos == 0:
                    print("Error at bit: No error")
                else:
                    print("Error at bit: " + str(error_pos))
                print("Data: " + data_out)
            solution_code:
              python: |
                import sys

                def encode_hamming(data4):
                    d = [int(b) for b in data4]
                    bits = [0] * 8
                    bits[3] = d[0]
                    bits[5] = d[1]
                    bits[6] = d[2]
                    bits[7] = d[3]
                    bits[1] = bits[3] ^ bits[5] ^ bits[7]
                    bits[2] = bits[3] ^ bits[6] ^ bits[7]
                    bits[4] = bits[5] ^ bits[6] ^ bits[7]
                    return ''.join(str(bits[i]) for i in range(1, 8))

                def detect_correct(received7):
                    r = [0] + [int(b) for b in received7]
                    s1 = r[1] ^ r[3] ^ r[5] ^ r[7]
                    s2 = r[2] ^ r[3] ^ r[6] ^ r[7]
                    s3 = r[4] ^ r[5] ^ r[6] ^ r[7]
                    error_pos = s1 + s2 * 2 + s3 * 4
                    if error_pos != 0:
                        r[error_pos] ^= 1
                    corrected = ''.join(str(r[i]) for i in range(1, 8))
                    data = str(r[3]) + str(r[5]) + str(r[6]) + str(r[7])
                    return error_pos, corrected, data

                data_input = sys.stdin.readline().strip()
                received_input = sys.stdin.readline().strip()

                encoded = encode_hamming(data_input)
                print("Encoded: " + encoded)

                error_pos, corrected, data_out = detect_correct(received_input)
                if error_pos == 0:
                    print("Error at bit: No error")
                else:
                    print("Error at bit: " + str(error_pos))
                print("Data: " + data_out)
            test_cases:
              - name: no-error-1010
                stdin: "1010\n1011010\n"
                expected_stdout: "Encoded: 1011010\nError at bit: No error\nData: 1010"
                is_hidden: false
                weight: 1
              - name: error-at-bit-3-1011
                stdin: "1011\n0100011\n"
                expected_stdout: "Encoded: 0110011\nError at bit: 3\nData: 1011"
                is_hidden: false
                weight: 1
              - name: no-error-all-zeros
                stdin: "0000\n0000000\n"
                expected_stdout: "Encoded: 0000000\nError at bit: No error\nData: 0000"
                is_hidden: false
                weight: 1
              - name: no-error-all-ones
