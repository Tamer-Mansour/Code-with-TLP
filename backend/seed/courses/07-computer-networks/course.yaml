            solution_code:
              python: |
                import sys

                def solve():
                    first_line = sys.stdin.readline().split()
                    ssthresh = int(first_line[0])
                    max_rounds = int(first_line[1])
                    events = [sys.stdin.readline().strip() for _ in range(max_rounds)]

                    cwnd = 1
                    for r, event in enumerate(events, 1):
                        if cwnd < ssthresh:
                            phase = "SlowStart"
                        else:
                            phase = "CongAvoid"
                        print("Round " + str(r) + ": cwnd=" + str(cwnd) +
                              " ssthresh=" + str(ssthresh) + " phase=" + phase)
                        if event == "LOSS":
                            ssthresh = max(cwnd // 2, 1)
                            cwnd = 1
                        else:
                            if cwnd < ssthresh:
                                cwnd *= 2
                            else:
                                cwnd += 1

                solve()
            test_cases:
              - name: sample-ssthresh16-with-loss
                stdin: "16 8\nOK\nOK\nOK\nOK\nLOSS\nOK\nOK\nOK\n"
                expected_stdout: "Round 1: cwnd=1 ssthresh=16 phase=SlowStart\nRound 2: cwnd=2 ssthresh=16 phase=SlowStart\nRound 3: cwnd=4 ssthresh=16 phase=SlowStart\nRound 4: cwnd=8 ssthresh=16 phase=SlowStart\nRound 5: cwnd=16 ssthresh=16 phase=CongAvoid\nRound 6: cwnd=1 ssthresh=8 phase=SlowStart\nRound 7: cwnd=2 ssthresh=8 phase=SlowStart\nRound 8: cwnd=4 ssthresh=8 phase=SlowStart"
