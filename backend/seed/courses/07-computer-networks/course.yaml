                import sys

                def solve():
                    data = sys.stdin.read().splitlines()
                    parts = data[0].split()
                    n, e = int(parts[0]), int(parts[1])
                    graph = [[] for _ in range(n + 1)]
                    for i in range(1, e + 1):
                        u, v, w = map(int, data[i].split())
                        graph[u].append((v, w))
                        graph[v].append((u, w))
                    src = int(data[e + 1].strip())
                    # TODO: run Dijkstra and print shortest distances
                    pass

                solve()
            solution_code:
              python: |
                import heapq
                import sys

                def dijkstra(graph, n, src):
                    dist = [float("inf")] * (n + 1)
                    dist[src] = 0
                    heap = [(0, src)]
                    while heap:
                        d, u = heapq.heappop(heap)
                        if d > dist[u]:
                            continue
                        for v, w in graph[u]:
                            if dist[u] + w < dist[v]:
                                dist[v] = dist[u] + w
                                heapq.heappush(heap, (dist[v], v))
                    return dist

                def solve():
                    data = sys.stdin.read().splitlines()
                    parts = data[0].split()
                    n, e = int(parts[0]), int(parts[1])
                    graph = [[] for _ in range(n + 1)]
                    for i in range(1, e + 1):
                        u, v, w = map(int, data[i].split())
                        graph[u].append((v, w))
                        graph[v].append((u, w))
                    src = int(data[e + 1].strip())

                    dist = dijkstra(graph, n, src)
                    for node in range(1, n + 1):
                        if node == src:
                            continue
                        d = dist[node]
                        if d == float("inf"):
                            print("Node " + str(node) + ": INF")
                        else:
                            print("Node " + str(node) + ": " + str(int(d)))

                solve()
            test_cases:
