            title: Interface Dispatch Table (Shape Areas)
            difficulty: medium
            points: 20
            prompt_file: lessons/go-interface-dispatch.prompt.md
            supported_languages: [python]
            tags: [interfaces, polymorphism, structs, math]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                import math
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys
                import math

                def area(shape_type, params):
                    if shape_type == 'CIRCLE':
                        r = float(params[0])
                        return math.pi * r * r
                    elif shape_type == 'RECTANGLE':
                        w, h = float(params[0]), float(params[1])
                        return w * h
                    elif shape_type == 'TRIANGLE':
                        b, h = float(params[0]), float(params[1])
                        return 0.5 * b * h
                    return 0.0

                def main():
                    lines = sys.stdin.read().splitlines()
                    n = int(lines[0].strip())
                    for i in range(1, n + 1):
                        parts = lines[i].strip().split()
                        shape_type = parts[0]
                        params = parts[1:]
                        result = area(shape_type, params)
                        print(f"{result:.2f}")

                main()
            test_cases:
              - name: mixed-shapes
                stdin: "4\nCIRCLE 7\nRECTANGLE 4 5\nTRIANGLE 6 8\nCIRCLE 3\n"
                expected_stdout: "153.94\n20.00\n24.00\n28.27"
                is_hidden: false
                weight: 1
              - name: single-circle
                stdin: "1\nCIRCLE 1\n"
                expected_stdout: "3.14"
                is_hidden: false
                weight: 1
              - name: rectangles-only
                stdin: "3\nRECTANGLE 10 2\nRECTANGLE 3 3\nRECTANGLE 1 100\n"
                expected_stdout: "20.00\n9.00\n100.00"
                is_hidden: false
                weight: 1
              - name: triangle-decimal
                stdin: "2\nTRIANGLE 3 4\nTRIANGLE 5 2\n"
                expected_stdout: "6.00\n5.00"
                is_hidden: true
                weight: 1
              - name: large-circle
                stdin: "1\nCIRCLE 100\n"
                expected_stdout: "31415.93"
                is_hidden: true
                weight: 1
              - name: all-types
                stdin: "3\nCIRCLE 5\nRECTANGLE 6 4\nTRIANGLE 3 8\n"
                expected_stdout: "78.54\n24.00\n12.00"
                is_hidden: true
                weight: 1

