        exercises:
          - slug: go-rle-codec
            title: Run-Length Encoding / Decoding
            difficulty: hard
            points: 30
            prompt_file: lessons/go-rle.prompt.md
            supported_languages: [python]
            tags: [strings, encoding, parsing]
            time_limit_ms: 3000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys

                def encode(s):
                    if not s:
                        return ""
                    result = []
                    count = 1
                    for i in range(1, len(s)):
                        if s[i] == s[i-1]:
                            count += 1
                        else:
                            result.append(str(count) + s[i-1])
                            count = 1
                    result.append(str(count) + s[-1])
                    return "".join(result)

                def decode(s):
                    result = []
                    i = 0
                    while i < len(s):
                        num_str = []
                        while i < len(s) and s[i].isdigit():
                            num_str.append(s[i])
                            i += 1
                        if i < len(s) and num_str:
                            result.append(s[i] * int("".join(num_str)))
                            i += 1
                    return "".join(result)

                def solve():
                    line = sys.stdin.read().strip()
                    if line and line[0].isdigit():
                        print(decode(line))
                    else:
                        print(encode(line))

                solve()
            test_cases:
              - name: encode-basic
                stdin: "aaabccddddee\n"
                expected_stdout: "3a1b2c4d2e"
                is_hidden: false
                weight: 1
              - name: decode-basic
                stdin: "3a1b2c4d2e\n"
                expected_stdout: "aaabccddddee"
                is_hidden: false
                weight: 1
              - name: encode-single-chars
                stdin: "abcde\n"
                expected_stdout: "1a1b1c1d1e"
                is_hidden: false
                weight: 1
              - name: decode-large-count
                stdin: "5x3y\n"
                expected_stdout: "xxxxxyyy"
                is_hidden: true
                weight: 1
              - name: encode-all-same
                stdin: "aaaaaaa\n"
                expected_stdout: "7a"
                is_hidden: true
                weight: 1
