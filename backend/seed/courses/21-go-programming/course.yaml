course:
  slug: go-programming
  title: Go Programming
  summary: Go fundamentals, goroutines, channels, and idiomatic Go.
  description: |
    Go is a small, opinionated language designed for clear concurrent code and
    fast compile times. This course covers the syntax, slices and maps,
    interfaces, error handling, and the goroutine + channel concurrency model
    that makes Go shine for backend services and CLIs.
  difficulty: intermediate
  estimated_hours: 12
  is_published: true
  order_index: 21

