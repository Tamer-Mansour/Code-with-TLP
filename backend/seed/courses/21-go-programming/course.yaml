            solution_code:
              python: |
                import sys

                def main():
                    lines = sys.stdin.read().splitlines()
                    chain_str = lines[0].strip()
                    chain = [part.strip() for part in chain_str.split('->')]
                    q = int(lines[1].strip())
                    for i in range(2, 2 + q):
                        query = lines[i].strip()
                        if query in chain:
                            print('YES')
                        else:
                            print('NO')

                main()
