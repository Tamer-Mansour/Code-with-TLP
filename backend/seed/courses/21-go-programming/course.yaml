          - slug: go-word-freq
            title: Word Frequency Counter
            difficulty: medium
            points: 25
            prompt_file: lessons/go-word-freq.prompt.md
            supported_languages: [python]
            tags: [strings, sorting, frequency]
            time_limit_ms: 3000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().split('\n', 1)
                    n = int(data[0].strip())
                    text = data[1] if len(data) > 1 else ""
                    punct = set('.,!?;:')
                    freq = {}
                    for token in text.split():
                        word = token.lower().strip('.,!?;:')
                        if word:
                            freq[word] = freq.get(word, 0) + 1
                    ranked = sorted(freq.items(), key=lambda x: (-x[1], x[0]))
                    for word, count in ranked[:n]:
                        print(word, count)

                solve()
            test_cases:
              - name: basic
                stdin: "3\nGo is great. Go is fast. Go goroutines!\n"
                expected_stdout: "go 3\nis 2\nfast 1"
                is_hidden: false
                weight: 1
              - name: single-word
                stdin: "1\nhello hello hello\n"
                expected_stdout: "hello 3"
                is_hidden: false
                weight: 1
              - name: alpha-tiebreak
                stdin: "2\ncat bat cat bat\n"
                expected_stdout: "bat 2\ncat 2"
                is_hidden: false
                weight: 1
              - name: case-insensitive
                stdin: "2\nGo GO go rust RUST\n"
                expected_stdout: "go 3\nrust 2"
                is_hidden: true
                weight: 1
              - name: fewer-words-than-n
                stdin: "10\none two\n"
                expected_stdout: "one 1\ntwo 1"
                is_hidden: true
                weight: 1

