              python: |
                import sys
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().split()
                    if not data:
                        print(0)
                        return
                    n = int(data[0])
                    nums = [int(x) for x in data[1:1+n]]
                    print(sum(nums))

                solve()
            test_cases:
