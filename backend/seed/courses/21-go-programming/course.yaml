            prompt_file: lessons/go-slice-array-semantics.prompt.md
            supported_languages: [python]
            tags: [slices, arrays, memory, append]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys

                def main():
                    lines = sys.stdin.read().splitlines()
                    cap_ = int(lines[0].strip())
                    n = int(lines[1].strip())
                    values = list(map(int, lines[2].strip().split()))
                    length = 0
                    for v in values:
                        if length < cap_:
                            length += 1
                            print(f"APPEND {v} cap={cap_}")
                        else:
                            cap_ *= 2
                            length += 1
                            print(f"REALLOC {v} cap={cap_}")

                main()
            test_cases:
              - name: basic-cap4
                stdin: "4\n8\n1 2 3 4 5 6 7 8\n"
                expected_stdout: "APPEND 1 cap=4\nAPPEND 2 cap=4\nAPPEND 3 cap=4\nAPPEND 4 cap=4\nREALLOC 5 cap=8\nAPPEND 6 cap=8\nAPPEND 7 cap=8\nAPPEND 8 cap=8"
                is_hidden: false
                weight: 1
              - name: cap1-triple-realloc
                stdin: "1\n5\n10 20 30 40 50\n"
                expected_stdout: "APPEND 10 cap=1\nREALLOC 20 cap=2\nREALLOC 30 cap=4\nAPPEND 40 cap=4\nREALLOC 50 cap=8"
                is_hidden: false
                weight: 1
              - name: no-realloc
                stdin: "10\n3\n5 6 7\n"
                expected_stdout: "APPEND 5 cap=10\nAPPEND 6 cap=10\nAPPEND 7 cap=10"
                is_hidden: false
                weight: 1
              - name: cap2-realloc-chain
                stdin: "2\n6\n1 2 3 4 5 6\n"
                expected_stdout: "APPEND 1 cap=2\nAPPEND 2 cap=2\nREALLOC 3 cap=4\nAPPEND 4 cap=4\nREALLOC 5 cap=8\nAPPEND 6 cap=8"
                is_hidden: true
