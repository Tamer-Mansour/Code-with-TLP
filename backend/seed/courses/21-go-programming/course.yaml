            prompt_file: lessons/go-goroutine-fanout.prompt.md
            supported_languages: [python]
            tags: [concurrency, goroutines, channels, sorting]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys

                def main():
                    data = sys.stdin.read().split()
                    idx = 0
                    n = int(data[idx]); idx += 1
                    tasks = []
                    for _ in range(n):
                        task_id = int(data[idx]); idx += 1
                        work = int(data[idx]); idx += 1
                        tasks.append((work, task_id))
                    tasks.sort()
                    for work, task_id in tasks:
                        print(f"Task {task_id} done in {work}ms")

                main()
            test_cases:
              - name: mixed-work
                stdin: "5\n3 10\n1 40\n4 20\n2 10\n5 30\n"
                expected_stdout: "Task 2 done in 10ms\nTask 3 done in 10ms\nTask 4 done in 20ms\nTask 5 done in 30ms\nTask 1 done in 40ms"
