        content_file: lessons/goroutines-and-channels.md
      - slug: worker-pool-exercise
        title: Worker Pool Sum
        type: exercise
        duration_minutes: 20
        content_file: lessons/worker-pool-exercise.md
        exercises:
          - slug: go-worker-pool-sum
            title: Worker Pool Sum (Concurrency Simulation)
            difficulty: medium
            points: 20
            prompt_file: lessons/go-worker-pool-sum.prompt.md
            supported_languages: [python]
            tags: [concurrency, sum]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().split()
                    if not data:
                        print(0)
                        return
                    n = int(data[0])
                    nums = [int(x) for x in data[1:1+n]]
                    print(sum(nums))

                solve()
            test_cases:
              - name: basic
                stdin: "5\n1 2 3 4 5\n"
                expected_stdout: "15"
                is_hidden: false
                weight: 1
              - name: with-negatives
                stdin: "4\n-10 5 -3 8\n"
                expected_stdout: "0"
                is_hidden: false
                weight: 1
              - name: single
                stdin: "1\n42\n"
                expected_stdout: "42"
                is_hidden: true
                weight: 1
              - name: zero
                stdin: "0\n"
                expected_stdout: "0"
                is_hidden: true
                weight: 1
