            starter_code:
              python: |
                import sys
                from collections import OrderedDict

                def solve():
                    data = sys.stdin.read().split('\n')
                    idx = 0
                    capacity = int(data[idx].strip()); idx += 1
                    cache = OrderedDict()
                    # TODO: process SET and GET commands

                solve()
            solution_code:
              python: |
                import sys
                from collections import OrderedDict

                def main():
                    data = sys.stdin.read().split('\n')
                    idx = 0
                    capacity = int(data[idx].strip())
                    idx += 1
                    cache = OrderedDict()
                    results = []
                    while idx < len(data):
                        line = data[idx].strip()
                        idx += 1
                        if not line:
                            continue
                        parts = line.split()
                        if parts[0] == 'GET':
                            key = parts[1]
                            if key in cache:
                                cache.move_to_end(key)
                                results.append(str(cache[key]))
                            else:
                                results.append('MISS')
                        elif parts[0] == 'SET':
                            key, value = parts[1], parts[2]
                            if key in cache:
                                cache.move_to_end(key)
                            else:
                                if len(cache) >= capacity:
                                    cache.popitem(last=False)
                            cache[key] = value
                    print('\n'.join(results))

                main()
            test_cases:
