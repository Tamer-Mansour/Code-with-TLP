            starter_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().split('\n')
                    database = {}
                    wt_cache = {}
                    ca_cache = {}
                    for line in data:
                        line = line.strip()
                        if not line:
                            continue
                        parts = line.split()
                        cmd = parts[0].upper()
                        # TODO: handle WRITE, READ_WT, READ_CA

                solve()
            solution_code:
              python: |
                import sys

                def main():
                    data = sys.stdin.read().split('\n')
                    database = {}
                    wt_cache = {}
                    ca_cache = {}
                    results = []
                    for line in data:
                        line = line.strip()
                        if not line:
                            continue
                        parts = line.split()
                        cmd = parts[0].upper()
                        if cmd == 'WRITE':
                            key, value = parts[1], parts[2]
                            database[key] = value
                            wt_cache[key] = value
                            if key in ca_cache:
                                del ca_cache[key]
                        elif cmd == 'READ_WT':
                            key = parts[1]
                            if key in wt_cache:
                                results.append('WT: HIT ' + str(wt_cache[key]))
                            else:
                                val = database.get(key, None)
                                if val is not None:
                                    wt_cache[key] = val
                                results.append('WT: MISS ' + str(val))
                        elif cmd == 'READ_CA':
                            key = parts[1]
                            if key in ca_cache:
                                results.append('CA: HIT ' + str(ca_cache[key]))
                            else:
                                val = database.get(key, None)
                                if val is not None:
                                    ca_cache[key] = val
                                results.append('CA: MISS ' + str(val))
                    print('\n'.join(results))

                main()
            test_cases:
