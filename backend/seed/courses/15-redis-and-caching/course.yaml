                is_hidden: false
                weight: 1
              - name: ca-warms-then-invalidates-on-write
                stdin: "WRITE item:1 book\nREAD_CA item:1\nREAD_CA item:1\nWRITE item:1 ebook\nREAD_CA item:1\nREAD_WT item:1\n"
                expected_stdout: "CA: MISS book\nCA: HIT book\nCA: MISS ebook\nWT: HIT ebook"
                is_hidden: false
                weight: 1
              - name: nonexistent-key-returns-none
