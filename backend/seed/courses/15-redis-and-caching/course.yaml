        exercises:
          - slug: redis-cache-hit-rate
            title: "Cache-Aside Hit Rate Analyzer"
            difficulty: easy
            points: 20
            prompt_file: lessons/redis-cache-hit-rate.prompt.md
            supported_languages: [python]
            tags: [redis, cache-aside, hit-rate]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().split('\n')
                    idx = 0
                    capacity = int(data[idx].strip()); idx += 1
                    ttl = int(data[idx].strip()); idx += 1
                    # TODO: implement cache-aside simulation
                    hits = 0
                    misses = 0

                solve()
            solution_code:
              python: |
                import sys

                def main():
                    data = sys.stdin.read().split('\n')
                    idx = 0
                    capacity = int(data[idx].strip()); idx += 1
                    ttl = int(data[idx].strip()); idx += 1
                    cache = {}
                    insert_order = []
                    hits = 0
                    misses = 0
                    op = 0
                    results = []
                    while idx < len(data):
                        line = data[idx].strip(); idx += 1
                        if not line:
                            continue
                        parts = line.split()
                        if parts[0] == 'READ':
                            key = parts[1]
                            op += 1
                            if key in cache:
                                val, insert_op = cache[key]
                                if (op - insert_op) >= ttl:
                                    del cache[key]
                                    insert_order = [k for k in insert_order if k != key]
                            if key in cache:
                                hits += 1
                                results.append('HIT: ' + cache[key][0])
                            else:
                                misses += 1
                                value = key + '_val'
                                while len(cache) >= capacity and insert_order:
                                    oldest = insert_order.pop(0)
                                    if oldest in cache:
                                        del cache[oldest]
                                cache[key] = (value, op)
                                insert_order.append(key)
                                results.append('MISS: ' + value)
                    total = hits + misses
                    rate = (hits / total * 100) if total > 0 else 0.0
                    results.append('Total: {}, Hits: {}, Misses: {}, Hit Rate: {:.1f}%'.format(
                        total, hits, misses, rate))
                    print('\n'.join(results))

                main()
            test_cases:
              - name: sample-eviction-and-ttl
                stdin: "2\n3\nREAD user:1\nREAD user:2\nREAD user:1\nREAD user:3\nREAD user:1\nREAD user:2\n"
                expected_stdout: "MISS: user:1_val\nMISS: user:2_val\nHIT: user:1_val\nMISS: user:3_val\nMISS: user:1_val\nMISS: user:2_val\nTotal: 6, Hits: 1, Misses: 5, Hit Rate: 16.7%"
                is_hidden: false
                weight: 1
              - name: high-hit-rate
                stdin: "5\n100\nREAD a\nREAD b\nREAD a\nREAD b\nREAD a\n"
                expected_stdout: "MISS: a_val\nMISS: b_val\nHIT: a_val\nHIT: b_val\nHIT: a_val\nTotal: 5, Hits: 3, Misses: 2, Hit Rate: 60.0%"
                is_hidden: false
                weight: 1
              - name: capacity-one
                stdin: "1\n100\nREAD x\nREAD x\nREAD y\nREAD x\n"
                expected_stdout: "MISS: x_val\nHIT: x_val\nMISS: y_val\nMISS: x_val\nTotal: 4, Hits: 1, Misses: 3, Hit Rate: 25.0%"
                is_hidden: false
                weight: 1
              - name: ttl-one-always-expires
                stdin: "3\n1\nREAD a\nREAD a\nREAD b\n"
                expected_stdout: "MISS: a_val\nMISS: a_val\nMISS: b_val\nTotal: 3, Hits: 0, Misses: 3, Hit Rate: 0.0%"
                is_hidden: true
                weight: 1
              - name: perfect-warm-cache
                stdin: "3\n10\nREAD apple\nREAD banana\nREAD apple\nREAD banana\nREAD apple\n"
                expected_stdout: "MISS: apple_val\nMISS: banana_val\nHIT: apple_val\nHIT: banana_val\nHIT: apple_val\nTotal: 5, Hits: 3, Misses: 2, Hit Rate: 60.0%"
                is_hidden: true
                weight: 1
