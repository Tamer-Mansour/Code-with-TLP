            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().split('\n')
                    # TODO
                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    lines = [l for l in sys.stdin.read().splitlines() if l.strip()]
                    w, l = map(int, lines[0].split())
                    n = int(lines[1])
                    counts = {}
                    for i in range(2, 2 + n):
                        parts = lines[i].split()
                        t = int(parts[0])
                        user = parts[1]
                        bucket = (user, t // w)
                        counts[bucket] = counts.get(bucket, 0) + 1
                        if counts[bucket] <= l:
                            print("ALLOW")
                        else:
                            print("DENY")

                solve()
            test_cases:
              - name: basic-deny
                stdin: "10 2\n4\n0 alice\n3 alice\n7 alice\n9 alice\n"
                expected_stdout: "ALLOW\nALLOW\nDENY\nDENY"
                is_hidden: false
                weight: 1
              - name: window-reset
                stdin: "60 3\n5\n0 alice\n10 alice\n20 alice\n30 alice\n60 alice\n"
                expected_stdout: "ALLOW\nALLOW\nALLOW\nDENY\nALLOW"
                is_hidden: false
                weight: 1
              - name: multi-user
                stdin: "10 1\n4\n0 alice\n0 bob\n5 alice\n5 bob\n"
                expected_stdout: "ALLOW\nALLOW\nDENY\nDENY"
                is_hidden: false
                weight: 1
              - name: limit-one-per-second
                stdin: "1 1\n4\n0 a\n0 a\n1 a\n1 a\n"
                expected_stdout: "ALLOW\nDENY\nALLOW\nDENY"
                is_hidden: true
                weight: 1
              - name: large-limit-no-deny
                stdin: "100 1000\n3\n0 x\n50 x\n99 x\n"
                expected_stdout: "ALLOW\nALLOW\nALLOW"
                is_hidden: true
                weight: 1
