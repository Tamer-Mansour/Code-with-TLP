course:
  slug: redis-and-caching
  title: Redis and Caching
  summary: In-memory data structures, caching patterns, pub/sub, streams, and clustering.
  description: |
    Redis is the in-memory data store you reach for when SQL is too slow.
    It's a Swiss-army knife — caches, queues, rate limiters, leaderboards,
    pub/sub, and primary store for the right workloads. This course covers the
    data structures, the canonical caching patterns, persistence trade-offs,
    and how Redis Cluster scales out.
  difficulty: intermediate
  estimated_hours: 18
  is_published: true
  order_index: 15

