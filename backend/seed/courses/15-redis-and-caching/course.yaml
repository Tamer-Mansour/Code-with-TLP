        exercises:
          - slug: redis-zset-leaderboard
            title: "Sorted-Set Leaderboard (ZADD/ZRANGE Simulation)"
            difficulty: medium
            points: 25
            prompt_file: lessons/redis-zset-leaderboard.prompt.md
            supported_languages: [python]
            tags: [redis, sorted-set]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    lines = [ln for ln in sys.stdin.read().splitlines() if ln != ""]
                    n = int(lines[0])
                    scores = {}
                    for ln in lines[1:1+n]:
                        parts = ln.split()
                        if parts[0] == "ZADD":
                            _, member, score = parts
                            scores[member] = int(score)
                        elif parts[0] == "ZINCRBY":
                            _, member, delta = parts
                            scores[member] = scores.get(member, 0) + int(delta)
                        elif parts[0] == "ZTOP":
                            k = int(parts[1])
                            top = sorted(scores.items(), key=lambda kv: (-kv[1], kv[0]))[:k]
                            for m, s in top:
                                print(f"{m} {s}")

                solve()
            test_cases:
              - name: simple-add-and-top
                stdin: "4\nZADD alice 10\nZADD bob 20\nZADD carol 15\nZTOP 3\n"
                expected_stdout: "bob 20\ncarol 15\nalice 10"
                is_hidden: false
                weight: 1
              - name: incr-and-top2
                stdin: "5\nZADD a 5\nZADD b 5\nZINCRBY a 10\nZADD c 7\nZTOP 2\n"
                expected_stdout: "a 15\nc 7"
                is_hidden: false
                weight: 1
              - name: alpha-tiebreak
                stdin: "4\nZADD x 1\nZADD y 1\nZADD z 1\nZTOP 2\n"
                expected_stdout: "x 1\ny 1"
                is_hidden: true
                weight: 1
              - name: top-larger-than-members
                stdin: "3\nZADD a 1\nZADD b 2\nZTOP 5\n"
                expected_stdout: "b 2\na 1"
                is_hidden: true
                weight: 1

