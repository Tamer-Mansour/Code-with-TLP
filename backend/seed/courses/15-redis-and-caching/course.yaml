        exercises:
          - slug: redis-zset-leaderboard
            title: "Sorted-Set Leaderboard (ZADD/ZRANGE Simulation)"
            difficulty: medium
            points: 25
            prompt_file: lessons/redis-zset-leaderboard.prompt.md
            supported_languages: [python]
            tags: [redis, sorted-set]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    lines = [ln for ln in sys.stdin.read().splitlines() if ln != ""]
                    n = int(lines[0])
                    scores = {}
                    for ln in lines[1:1+n]:
                        parts = ln.split()
                        if parts[0] == "ZADD":
                            _, member, score = parts
                            scores[member] = int(score)
                        elif parts[0] == "ZINCRBY":
                            _, member, delta = parts
                            scores[member] = scores.get(member, 0) + int(delta)
                        elif parts[0] == "ZTOP":
                            k = int(parts[1])
                            top = sorted(scores.items(), key=lambda kv: (-kv[1], kv[0]))[:k]
                            for m, s in top:
                                print(f"{m} {s}")

                solve()
            test_cases:
              - name: simple-add-and-top
                stdin: "4\nZADD alice 10\nZADD bob 20\nZADD carol 15\nZTOP 3\n"
                expected_stdout: "bob 20\ncarol 15\nalice 10"
                is_hidden: false
                weight: 1
              - name: incr-and-top2
                stdin: "5\nZADD a 5\nZADD b 5\nZINCRBY a 10\nZADD c 7\nZTOP 2\n"
                expected_stdout: "a 15\nc 7"
                is_hidden: false
                weight: 1
              - name: alpha-tiebreak
                stdin: "4\nZADD x 1\nZADD y 1\nZADD z 1\nZTOP 2\n"
                expected_stdout: "x 1\ny 1"
                is_hidden: true
                weight: 1
              - name: top-larger-than-members
                stdin: "3\nZADD a 1\nZADD b 2\nZTOP 5\n"
                expected_stdout: "b 2\na 1"
                is_hidden: true
                weight: 1
      - slug: redis-leaderboard-exercise
        title: "Sorted Set Leaderboard (Full Redis Commands)"
        type: exercise
        duration_minutes: 30
        content_file: lessons/redis-leaderboard-exercise.md
        exercises:
          - slug: redis-leaderboard-full
            title: "Sorted Set Leaderboard: ZADD / ZRANK / ZREVRANK / ZRANGE / ZSCORE"
            difficulty: easy
            points: 20
            prompt_file: lessons/redis-leaderboard-full.prompt.md
            supported_languages: [python]
            tags: [redis, sorted-set, leaderboard]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().split('\n')
                    scores = {}
                    # TODO: implement ZADD, ZRANK, ZREVRANK, ZRANGE, ZSCORE
                    for line in data:
                        line = line.strip()
                        if not line:
                            continue
                        parts = line.split()
                        cmd = parts[0].upper()

                solve()
            solution_code:
              python: |
                import sys

                def main():
                    data = sys.stdin.read().split('\n')
                    scores = {}
                    results = []

                    def sorted_members():
                        return sorted(scores.keys(), key=lambda m: (scores[m], m))

                    for line in data:
                        line = line.strip()
                        if not line:
                            continue
                        parts = line.split()
                        cmd = parts[0].upper()
                        if cmd == 'ZADD':
                            score = float(parts[1])
                            member = parts[2]
                            scores[member] = score
                        elif cmd == 'ZRANK':
                            member = parts[1]
                            if member not in scores:
                                results.append('-1')
                            else:
                                sl = sorted_members()
                                results.append(str(sl.index(member)))
                        elif cmd == 'ZREVRANK':
                            member = parts[1]
                            if member not in scores:
                                results.append('-1')
                            else:
                                sl = sorted_members()
                                results.append(str(len(sl) - 1 - sl.index(member)))
                        elif cmd == 'ZRANGE':
                            start, stop = int(parts[1]), int(parts[2])
                            sl = sorted_members()
                            n = len(sl)
                            if start < 0:
                                start = max(0, n + start)
                            if stop < 0:
                                stop = n + stop
                            stop = min(stop, n - 1)
                            for m in sl[start:stop+1]:
                                results.append(m)
                        elif cmd == 'ZSCORE':
                            member = parts[1]
                            if member in scores:
                                v = scores[member]
                                results.append(str(int(v)) if v == int(v) else str(v))
                            else:
                                results.append('NIL')
                    print('\n'.join(results))

                main()
            test_cases:
              - name: basic-rank-range-score
                stdin: "ZADD 100 alice\nZADD 200 bob\nZADD 150 carol\nZRANK alice\nZRANK bob\nZREVRANK alice\nZRANGE 0 2\nZSCORE carol\nZSCORE eve\n"
                expected_stdout: "0\n2\n2\nalice\ncarol\nbob\n150\nNIL"
                is_hidden: false
                weight: 1
              - name: tiebreak-alphabetical
                stdin: "ZADD 100 zara\nZADD 100 alice\nZADD 200 mike\nZRANK alice\nZRANK zara\nZRANGE 0 2\nZSCORE mike\n"
                expected_stdout: "0\n1\nalice\nzara\nmike\n200"
                is_hidden: false
                weight: 1
              - name: update-score
                stdin: "ZADD 50 player1\nZADD 80 player2\nZADD 90 player1\nZRANK player1\nZSCORE player1\nZRANGE 0 1\n"
                expected_stdout: "1\n90\nplayer2\nplayer1"
                is_hidden: false
                weight: 1
              - name: not-found-returns-minus-one-and-nil
                stdin: "ZADD 50 alpha\nZADD 75 beta\nZRANK gamma\nZSCORE ghost\nZREVRANK alpha\n"
                expected_stdout: "-1\nNIL\n1"
                is_hidden: true
                weight: 1
