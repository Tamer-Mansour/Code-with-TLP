      - slug: window-rank-exercise
        title: Top-N Per Group
        type: exercise
        duration_minutes: 25
        content_file: lessons/window-rank-exercise.md
        exercises:
          - slug: mssql-top-n-per-group
            title: Top-N Per Group (Window Function Simulation)
            difficulty: medium
            points: 25
            prompt_file: lessons/mssql-top-n-per-group.prompt.md
            supported_languages: [python]
            tags: [t-sql, window-functions]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    lines = [ln for ln in sys.stdin.read().splitlines() if ln != ""]
                    n, k = map(int, lines[0].split())
                    rows = []
                    for ln in lines[1:1+n]:
                        cat, score = ln.split(",")
                        rows.append((cat, int(score)))
                    # group, sort each group desc by score, then by category-stable order
                    groups = {}
                    order = []
                    for cat, sc in rows:
                        if cat not in groups:
                            groups[cat] = []
                            order.append(cat)
                        groups[cat].append(sc)
                    out = []
                    for cat in order:
                        topk = sorted(groups[cat], reverse=True)[:k]
                        for s in topk:
                            out.append(f"{cat},{s}")
                    print("\n".join(out))

                solve()
            test_cases:
              - name: basic
                stdin: "5 2\nA,10\nA,20\nA,30\nB,5\nB,15\n"
                expected_stdout: "A,30\nA,20\nB,15\nB,5"
                is_hidden: false
                weight: 1
              - name: single-group
                stdin: "3 1\nX,1\nX,2\nX,3\n"
                expected_stdout: "X,3"
                is_hidden: false
                weight: 1
              - name: k-larger-than-group
                stdin: "2 5\nQ,7\nQ,3\n"
                expected_stdout: "Q,7\nQ,3"
                is_hidden: true
                weight: 1
              - name: stable-input-order
                stdin: "4 2\nB,1\nA,5\nB,2\nA,9\n"
                expected_stdout: "B,2\nB,1\nA,9\nA,5"
                is_hidden: true
                weight: 1
      - slug: tsql-string-exercise
        title: String Aggregation Simulation
        type: exercise
        duration_minutes: 20
        content_file: lessons/tsql-string-exercise.md
        exercises:
          - slug: tsql-string-agg-sim
            title: "STRING_AGG Simulation"
            difficulty: easy
            points: 15
            prompt_file: lessons/tsql-string-agg-sim.prompt.md
            supported_languages: [python]
            tags: [t-sql, strings, aggregation]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().splitlines()
                    # TODO
                    pass

                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    lines = [ln for ln in sys.stdin.read().splitlines() if ln.strip()]
                    n = int(lines[0])
                    groups = {}
                    order = []
                    for ln in lines[1:1 + n]:
                        group, value = ln.split(",", 1)
                        if group not in groups:
                            groups[group] = []
                            order.append(group)
                        groups[group].append(value)
                    out = []
                    for g in order:
                        out.append(f"{g}: {', '.join(sorted(groups[g]))}")
                    print("\n".join(out))

                solve()
            test_cases:
              - name: basic
                stdin: "5\nfruits,banana\nvegs,carrot\nfruits,apple\nvegs,broccoli\nfruits,cherry\n"
                expected_stdout: "fruits: apple, banana, cherry\nvegs: broccoli, carrot"
                is_hidden: false
                weight: 1
              - name: single-group-sorted
                stdin: "3\na,z\na,a\na,m\n"
                expected_stdout: "a: a, m, z"
                is_hidden: false
                weight: 1
              - name: single-item
                stdin: "1\nonly,one\n"
                expected_stdout: "only: one"
                is_hidden: true
                weight: 1
              - name: two-groups-order-preserved
                stdin: "4\nb,2\na,1\nb,1\na,2\n"
                expected_stdout: "b: 1, 2\na: 1, 2"
                is_hidden: true
                weight: 1

