      - slug: sql-inner-join-exercise
        title: "Exercise: Simulate an INNER JOIN"
        type: exercise
        duration_minutes: 25
        content_file: lessons/sql-inner-join-exercise.md
        exercises:
          - slug: sql-inner-join-sim
            title: Simulate an INNER JOIN
            difficulty: medium
            points: 20
            prompt_file: lessons/sql-inner-join-sim.prompt.md
            supported_languages: [python]
            tags: [t-sql, joins, inner-join]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().splitlines()
                    # TODO: perform INNER JOIN and print results sorted by order_id
                    pass

                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().splitlines()
                    idx = 0
                    m = int(data[idx]); idx += 1
                    orders = []
                    for _ in range(m):
                        parts = data[idx].split(','); idx += 1
                        orders.append((int(parts[0]), int(parts[1])))
                    k = int(data[idx]); idx += 1
                    customers = {}
                    for _ in range(k):
                        parts = data[idx].split(',', 1); idx += 1
                        customers[int(parts[0])] = parts[1]
                    result = []
                    for order_id, cust_id in orders:
                        if cust_id in customers:
                            result.append((order_id, customers[cust_id]))
                    result.sort(key=lambda x: x[0])
                    for order_id, name in result:
                        print(f'{order_id},{name}')

                solve()
            test_cases:
              - name: sample
                stdin: "4\n101,1\n102,3\n103,2\n104,5\n3\n1,Alice\n2,Bob\n3,Carol"
                expected_stdout: "101,Alice\n102,Carol\n103,Bob"
                is_hidden: false
                weight: 1
              - name: no-matches
                stdin: "2\n201,99\n202,98\n2\n1,Dave\n2,Eve"
                expected_stdout: ""
                is_hidden: false
                weight: 1
              - name: all-match
                stdin: "3\n10,1\n20,2\n30,3\n3\n1,Ana\n2,Ben\n3,Cara"
                expected_stdout: "10,Ana\n20,Ben\n30,Cara"
                is_hidden: true
                weight: 1
              - name: out-of-order-ids
                stdin: "3\n300,2\n100,3\n200,1\n3\n1,X\n2,Y\n3,Z"
                expected_stdout: "100,Z\n200,X\n300,Y"
                is_hidden: true
                weight: 1
              - name: partial-match
                stdin: "4\n1,10\n2,20\n3,30\n4,40\n2\n10,Alpha\n30,Gamma"
                expected_stdout: "1,Alpha\n3,Gamma"
                is_hidden: true
                weight: 1
      - slug: tsql-quiz
        title: "Quiz: T-SQL Essentials"
        type: quiz
        duration_minutes: 10
        content_file: lessons/tsql-quiz.md

