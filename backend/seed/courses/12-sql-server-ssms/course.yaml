        exercises:
          - slug: sql-row-number-window
            title: "Simulate ROW_NUMBER Window Function"
            difficulty: medium
            points: 20
            prompt_file: lessons/sql-row-number-window.prompt.md
            supported_languages: [python]
            tags: [t-sql, window-functions, row-number, partition-by]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                from collections import defaultdict

                def solve():
                    n = int(input())
                    # TODO: assign ROW_NUMBER per department ordered by salary DESC
                    pass

                solve()
            solution_code:
              python: |
                from collections import defaultdict

                def solve():
                    n = int(input())
                    records = []
                    for _ in range(n):
                        parts = input().split(',')
                        dept, name, salary = parts[0], parts[1], int(parts[2])
                        records.append((dept, name, salary))
                    groups = defaultdict(list)
                    for dept, name, salary in records:
                        groups[dept].append((name, salary))
                    for dept in sorted(groups):
                        employees = groups[dept]
                        employees.sort(key=lambda x: -x[1])
                        for row_num, (name, salary) in enumerate(employees, start=1):
                            print(f'{dept},{name},{salary},{row_num}')

                solve()
            test_cases:
              - name: sample
                stdin: "6\nEng,Alice,90000\nEng,Bob,75000\nEng,Carol,85000\nHR,Dave,60000\nHR,Eve,65000\nHR,Frank,60000"
                expected_stdout: "Eng,Alice,90000,1\nEng,Carol,85000,2\nEng,Bob,75000,3\nHR,Eve,65000,1\nHR,Dave,60000,2\nHR,Frank,60000,3"
                is_hidden: false
                weight: 1
