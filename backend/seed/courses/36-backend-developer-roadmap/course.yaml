            points: 10
            prompt_file: lessons/roadmap-fizzbuzz.prompt.md
            supported_languages: [java, python]
            tags: [java, basics, control-flow]
            time_limit_ms: 4000
            memory_limit_mb: 256
            starter_code:
              java: |
                import java.util.Scanner;

                public class Main {
                    public static void main(String[] args) {
                        int n = Integer.parseInt(new Scanner(System.in).nextLine().trim());
                        // TODO: print 1..n, with Fizz/Buzz/FizzBuzz rules, one per line
                    }
                }
              python: |
                import sys

                def solve():
                    n = int(sys.stdin.readline().strip())
                    # TODO
                solve()
            solution_code:
              java: |
                import java.util.Scanner;

                public class Main {
                    public static void main(String[] args) {
                        int n = Integer.parseInt(new Scanner(System.in).nextLine().trim());
                        StringBuilder sb = new StringBuilder();
                        for (int i = 1; i <= n; i++) {
                            if (i % 15 == 0) sb.append("FizzBuzz");
                            else if (i % 3 == 0) sb.append("Fizz");
                            else if (i % 5 == 0) sb.append("Buzz");
                            else sb.append(i);
                            if (i < n) sb.append("\n");
                        }
                        System.out.println(sb.toString());
                    }
                }
              python: |
                import sys

                def solve():
                    n = int(sys.stdin.readline().strip())
                    out = []
                    for i in range(1, n + 1):
                        if i % 15 == 0:
                            out.append("FizzBuzz")
                        elif i % 3 == 0:
                            out.append("Fizz")
                        elif i % 5 == 0:
                            out.append("Buzz")
                        else:
                            out.append(str(i))
                    print("\n".join(out))
                solve()
            test_cases:
              - name: "first-five"
                stdin: "5\n"
                expected_stdout: "1\n2\nFizz\n4\nBuzz"
                is_hidden: false
                weight: 1
              - name: "through-fifteen"
                stdin: "15\n"
                expected_stdout: "1\n2\nFizz\n4\nBuzz\nFizz\n7\n8\nFizz\nBuzz\n11\nFizz\n13\n14\nFizzBuzz"
                is_hidden: false
                weight: 2
              - name: "one"
                stdin: "1\n"
                expected_stdout: "1"
                is_hidden: true
                weight: 1
              - name: "three"
                stdin: "3\n"
                expected_stdout: "1\n2\nFizz"
                is_hidden: true
                weight: 1
