course:
  slug: backend-developer-roadmap
  title: "Backend Developer Roadmap (Java + Spring)"
  summary: "A 16-week guided path: learn Java, MySQL, HTML, CSS, and JavaScript with installation guides, projects, quizzes, and challenges — then move on to Spring Boot."
  description: |
    A step-by-step roadmap that takes you from zero to a job-ready full-stack-capable backend
    developer. You will install your toolchain, learn Java and MySQL, pick up HTML, CSS, and
    JavaScript for the web, and build real projects (Finance Tracker, Employee Database, Portfolio
    Site, Weather Dashboard, Full-Stack Contact Manager) along the way. Each module has projects,
    quizzes, coding challenges, and clear sub-tasks. Finish this, then take Spring Boot Mastery.
  difficulty: beginner
  estimated_hours: 60
  is_published: true
  order_index: 36

