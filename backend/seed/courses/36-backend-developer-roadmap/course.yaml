        content_file: lessons/challenge-cli-calculator.md
        exercises:
          - slug: roadmap-cli-calculator
            title: "Command-Line Calculator"
            difficulty: easy
            points: 15
            prompt_file: lessons/roadmap-cli-calculator.prompt.md
            supported_languages: [java, python]
            tags: [java, basics, arithmetic]
            time_limit_ms: 4000
            memory_limit_mb: 256
            starter_code:
              java: |
                import java.util.Scanner;

                public class Main {
                    public static void main(String[] args) {
                        Scanner sc = new Scanner(System.in);
                        String line = sc.nextLine().trim();
                        // line looks like: "3 + 4"
                        // TODO: parse a, op, b and print the integer result
                    }
                }
              python: |
                import sys

                def solve():
                    a, op, b = sys.stdin.readline().split()
                    a, b = int(a), int(b)
                    # TODO: compute and print result
                solve()
            solution_code:
              java: |
                import java.util.Scanner;

                public class Main {
                    public static void main(String[] args) {
                        Scanner sc = new Scanner(System.in);
                        String line = sc.nextLine().trim();
                        String[] parts = line.split("\\s+");
                        long a = Long.parseLong(parts[0]);
                        String op = parts[1];
                        long b = Long.parseLong(parts[2]);
                        long result = 0;
                        switch (op) {
                            case "+": result = a + b; break;
                            case "-": result = a - b; break;
                            case "*": result = a * b; break;
                            case "/": result = a / b; break;
                        }
                        System.out.println(result);
                    }
                }
              python: |
                import sys

                def solve():
                    a, op, b = sys.stdin.readline().split()
                    a, b = int(a), int(b)
                    if op == '+':
                        print(a + b)
                    elif op == '-':
                        print(a - b)
                    elif op == '*':
                        print(a * b)
                    elif op == '/':
                        print(a // b)
                solve()
            test_cases:
              - name: "addition"
                stdin: "3 + 4\n"
                expected_stdout: "7"
                is_hidden: false
                weight: 1
              - name: "subtraction"
                stdin: "10 - 6\n"
                expected_stdout: "4"
                is_hidden: false
                weight: 1
              - name: "multiplication"
                stdin: "5 * 6\n"
                expected_stdout: "30"
                is_hidden: false
                weight: 1
              - name: "division"
                stdin: "20 / 4\n"
                expected_stdout: "5"
                is_hidden: true
                weight: 1
              - name: "negative-result"
                stdin: "2 - 9\n"
                expected_stdout: "-7"
                is_hidden: true
                weight: 1
