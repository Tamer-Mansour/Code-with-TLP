subject:
  slug: systems
  name: Systems
  description: How computers run software, from the CPU up to the network.
  icon: server
  color: '#ef4444'
  order_index: 4
course:
  slug: virtual-prototyping-systemc
  title: Virtual Prototyping with SystemC & TLM-2.0
  summary: Build SystemC/TLM-2.0 virtual platforms — modules, processes, the simulation kernel, buses,
    peripherals, CPU models, and boot.
  description: Learn to build virtual prototypes of embedded SoCs with SystemC and TLM-2.0. Starts with
    embedded foundations and the modelling C++ you need, then covers the simulation kernel, modules and
    processes, TLM-2.0 sockets and coding styles, buses, peripherals, interrupts, a virtual UART, CPU
    models, boot flow, co-simulation, and debugging.
  difficulty: advanced
  estimated_hours: 50
  order_index: 34
  is_published: true
