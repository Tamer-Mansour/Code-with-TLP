            solution_code:
              python: |
                import sys
                from collections import deque

                def solve():
                    lines = sys.stdin.read().strip().split('\n')
                    line1 = lines[0].split()
                    n, q = int(line1[0]), int(line1[1])
                    processes = []
                    for i in range(n):
                        a, b = map(int, lines[i + 1].split())
                        processes.append((a, b, i + 1))

                    processes.sort(key=lambda x: (x[0], x[2]))
                    remaining = [p[1] for p in processes]
                    arrival = [p[0] for p in processes]
                    pid = [p[2] for p in processes]

                    ready_queue = deque()
                    time = 0
                    idx = 0
                    finished = 0
                    completion = [0] * n
                    finish_order = []

                    while idx < n and arrival[idx] <= time:
                        ready_queue.append(idx)
                        idx += 1

                    while finished < n:
                        if not ready_queue:
                            time = arrival[idx]
                            while idx < n and arrival[idx] <= time:
                                ready_queue.append(idx)
                                idx += 1

                        i = ready_queue.popleft()
                        run = min(q, remaining[i])
                        time += run
                        remaining[i] -= run

                        while idx < n and arrival[idx] <= time:
                            ready_queue.append(idx)
                            idx += 1

                        if remaining[i] == 0:
                            completion[i] = time
                            finish_order.append(i)
                            finished += 1
                        else:
                            ready_queue.append(i)

                    total_tat = 0
                    total_wt = 0
                    for i in finish_order:
                        tat = completion[i] - arrival[i]
                        wt = tat - processes[i][1]
                        total_tat += tat
                        total_wt += wt
                        print(f'P{pid[i]} finishes at t={completion[i]}, TAT={tat}, WT={wt}')

                    print(f'Average TAT: {total_tat / n:.2f}')
                    print(f'Average WT: {total_wt / n:.2f}')

                solve()
