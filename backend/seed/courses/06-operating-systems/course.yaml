            solution_code:
              python: |
                import sys

                def solve():
                    lines = sys.stdin.read().strip().split('\n')
                    frames = int(lines[0])
                    pages = list(map(int, lines[1].split()))
                    memory = []
                    lru_order = []
                    faults = 0

                    for page in pages:
                        if page in memory:
                            status = 'HIT'
                            lru_order.remove(page)
                            lru_order.append(page)
                        else:
                            status = 'FAULT'
                            faults += 1
                            if len(memory) < frames:
                                memory.append(page)
                            else:
                                lru_page = lru_order.pop(0)
                                memory[memory.index(lru_page)] = page
                            lru_order.append(page)

                        print(f'Access {page}: {status:<6} frames={sorted(memory)}')

                    print(f'Total page faults: {faults}')

                solve()
            test_cases:
