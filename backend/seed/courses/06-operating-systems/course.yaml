                import sys
                from collections import deque

                def solve():
                    lines = sys.stdin.read().strip().split('\n')
                    capacity = int(lines[0])
                    events = lines[1:]
                    buf = deque()

                    for event in events:
                        parts = event.split()
                        if parts[0] == 'P':
                            item = parts[1]
                            if len(buf) >= capacity:
                                print(f'PRODUCER BLOCKS (buffer full, dropped: {item})')
                            else:
                                buf.append(item)
                                print(f'PRODUCE {item:<10} -> buffer={list(buf)}')
                        elif parts[0] == 'C':
                            if len(buf) == 0:
                                print('CONSUMER BLOCKS (buffer empty)')
                            else:
                                item = buf.popleft()
                                print(f'CONSUME {item:<10} -> buffer={list(buf)}')

                    print(f'Final buffer: {list(buf)}')

                solve()
