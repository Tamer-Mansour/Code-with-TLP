        exercises:
          - slug: git-ancestry-distance
            title: Commit Ancestry Distance
            difficulty: medium
            points: 25
            prompt_file: lessons/git-ancestor-distance.prompt.md
            supported_languages: [python]
            tags: [git, graph, bfs]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                from collections import deque

                def solve():
                    data = sys.stdin.read().splitlines()
                    # TODO: parse and solve
                    pass

                solve()
            solution_code:
              python: |
                import sys
                from collections import deque

                def solve():
                    lines = sys.stdin.read().splitlines()
                    n = int(lines[0])
                    parent = {}
                    for i in range(1, n + 1):
                        parts = lines[i].split()
                        node = parts[0]
                        parents = parts[1:] if len(parts) > 1 else []
                        parent[node] = parents
                    a, b = lines[n + 1].split()

                    if a == b:
                        print(0)
                        return

                    # BFS from b towards a (following parent links)
                    visited = {b: 0}
                    queue = deque([b])
                    while queue:
                        cur = queue.popleft()
                        dist = visited[cur]
                        for p in parent.get(cur, []):
                            if p not in visited:
                                visited[p] = dist + 1
                                if p == a:
                                    print(visited[p])
                                    return
                                queue.append(p)

                solve()
            test_cases:
              - name: linear-3-hops
                stdin: "4\nA\nB A\nC B\nD C\nA D\n"
                expected_stdout: "3"
                is_hidden: false
                weight: 1
              - name: same-node
                stdin: "1\nA\nA A\n"
                expected_stdout: "0"
                is_hidden: false
                weight: 1
              - name: one-hop
                stdin: "3\nA\nB A\nC A\nA C\n"
                expected_stdout: "1"
                is_hidden: true
                weight: 1
              - name: diamond-shortest
                stdin: "5\nA\nB A\nC B\nD B\nE C\nA E\n"
                expected_stdout: "3"
                is_hidden: true
                weight: 1

