            supported_languages: [python]
            tags: [git, strings, best-practices]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                for line in sys.stdin:
                    msg = line.rstrip('\n')
                    if not msg:
                        continue
                    # TODO: validate msg and print OK or ERROR: ...
            solution_code:
              python: |
                import sys

                for line in sys.stdin:
                    msg = line.rstrip('\n')
                    if not msg:
                        continue
                    if len(msg) > 72:
                        print('ERROR: subject line must be 72 characters or fewer')
                    elif msg.endswith('.'):
                        print('ERROR: subject line must not end with a period')
                    elif not msg[0].isupper():
                        print('ERROR: subject line must start with a capital letter')
                    else:
                        print('OK')
            test_cases:
              - name: mixed-messages
                stdin: "Add user authentication module\nfix login bug.\nadd new feature for the dashboard that handles all the user interactions and navigation throughout the entire application\nUpdate README\nrefactored database connection pooling logic\n"
