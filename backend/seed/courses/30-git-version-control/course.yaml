      - slug: ff-merge-exercise
        title: Fast-Forward Check
        type: exercise
        duration_minutes: 20
        content_file: lessons/ff-merge-exercise.md
        exercises:
          - slug: git-ff-check
            title: Fast-Forward Merge Decider
            difficulty: medium
            points: 20
            prompt_file: lessons/git-ff-check.prompt.md
            supported_languages: [python]
            tags: [git, graph]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    lines = sys.stdin.read().splitlines()
                    n = int(lines[0])
                    parent = {}
                    for i in range(1, n+1):
                        parts = lines[i].split()
                        child = parts[0]
                        parents = parts[1:] if len(parts) > 1 else []
                        parent[child] = parents
                    base, target = lines[n+1].split()

                    # is base an ancestor of target?
                    seen = set()
                    stack = [target]
                    while stack:
                        cur = stack.pop()
                        if cur == base:
                            print("FAST-FORWARD")
                            return
                        if cur in seen:
                            continue
                        seen.add(cur)
                        for p in parent.get(cur, []):
                            stack.append(p)
                    print("MERGE")

                solve()
            test_cases:
              - name: ff
                stdin: "3\nA\nB A\nC B\nA C\n"
                expected_stdout: "FAST-FORWARD"
                is_hidden: false
                weight: 1
              - name: diverged
                stdin: "4\nA\nB A\nC A\nD C\nB D\n"
                expected_stdout: "MERGE"
                is_hidden: false
                weight: 1
              - name: same
                stdin: "1\nA\nA A\n"
                expected_stdout: "FAST-FORWARD"
                is_hidden: true
                weight: 1
              - name: deeper-ff
                stdin: "5\nA\nB A\nC B\nD C\nE D\nA E\n"
                expected_stdout: "FAST-FORWARD"
                is_hidden: true
                weight: 1
