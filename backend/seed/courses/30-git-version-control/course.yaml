                is_hidden: false
                weight: 1
              - name: all-valid
                stdin: "Fix null pointer exception in login\nAdd unit tests for auth module\nUpdate Docker base image to Python 3.12\n"
                expected_stdout: "OK\nOK\nOK"
                is_hidden: false
                weight: 1
              - name: length-takes-priority
                stdin: "this message is way too long and also ends with a period so it has two violations but we only report the first one found.\n"
                expected_stdout: "ERROR: subject line must be 72 characters or fewer"
                is_hidden: true
                weight: 1
              - name: period-before-caps
                stdin: "Fix the issue.\nrewrite authentication\n"
                expected_stdout: "ERROR: subject line must not end with a period\nERROR: subject line must start with a capital letter"
                is_hidden: true
                weight: 1
              - name: exactly-72-chars
