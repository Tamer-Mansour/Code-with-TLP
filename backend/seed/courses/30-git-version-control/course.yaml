      - slug: git-gitignore-matcher-exercise
        title: "Exercise: Build a .gitignore Matcher"
        type: exercise
        duration_minutes: 25
        content_file: lessons/git-gitignore-matcher-exercise.md
        exercises:
          - slug: git-gitignore-matcher
            title: Build a .gitignore Matcher
            difficulty: medium
            points: 20
            prompt_file: lessons/git-gitignore-matcher.prompt.md
            supported_languages: [python]
            tags: [git, strings, pattern-matching]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                lines = sys.stdin.read().splitlines()
                # Split on the blank separator line
                # TODO: parse patterns and file paths, then print ignored files
            solution_code:
              python: |
                import sys

                lines = sys.stdin.read().splitlines()

                blank_idx = lines.index('')
                pattern_lines = lines[:blank_idx]
                file_lines = lines[blank_idx + 1:]

                patterns = []
                for p in pattern_lines:
                    p = p.strip()
                    if p and not p.startswith('#'):
                        patterns.append(p)

                def is_ignored(filepath, patterns):
                    basename = filepath.split('/')[-1]
                    for pattern in patterns:
                        if pattern.startswith('*.'):
                            ext = pattern[1:]
                            if basename.endswith(ext):
                                return True
                        else:
                            if basename == pattern or filepath == pattern:
                                return True
                    return False

                for f in file_lines:
                    if f and is_ignored(f, patterns):
                        print(f)
            test_cases:
              - name: basic-python-project
                stdin: "# Python cache\n*.pyc\n*.log\n__pycache__\n.env\n\nsrc/main.py\nsrc/app.pyc\nlogs/error.log\nsrc/__pycache__\nREADME.md\n.env\nbuild/output.log\n"
                expected_stdout: "src/app.pyc\nlogs/error.log\nsrc/__pycache__\n.env\nbuild/output.log"
                is_hidden: false
                weight: 1
              - name: no-matches
                stdin: "*.tmp\n\nsrc/main.py\nREADME.md\nsetup.py\n"
                expected_stdout: ""
                is_hidden: false
                weight: 1
              - name: node-project
                stdin: "node_modules\n*.log\n.DS_Store\ndist\n\nsrc/index.js\nnode_modules\npackage.json\nbuild.log\n.DS_Store\ndist\nsrc/utils.js\n"
                expected_stdout: "node_modules\nbuild.log\n.DS_Store\ndist"
                is_hidden: true
                weight: 1
              - name: comments-ignored
                stdin: "# This is a comment\n# Another comment\n*.tmp\n\nfile.tmp\nfile.py\n# not-a-file\n"
                expected_stdout: "file.tmp"
                is_hidden: true
                weight: 1

