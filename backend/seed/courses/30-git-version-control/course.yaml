            supported_languages: [python]
            tags: [git, strings, parsing]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                for line in sys.stdin:
                    line = line.rstrip('\n')
                    if line == '':
                        break
                    # TODO: print the abbreviated hash and message
            solution_code:
              python: |
                import sys

                for line in sys.stdin:
                    line = line.rstrip('\n')
