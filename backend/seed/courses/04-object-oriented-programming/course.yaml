              python: |
                import sys

                class Animal:
                    def __init__(self, name):
                        self.name = name

                    def speak(self):
                        return "Some sound"

                class Dog(Animal):
                    def __init__(self, name):
                        super().__init__(name)

                    def speak(self):
                        return "Woof"

                class GuideDog(Dog):
                    def __init__(self, name, owner):
                        super().__init__(name)
                        self.owner = owner

                    def speak(self):
                        return "Woof woof"

                    def __str__(self):
                        return f"{self.name} guides {self.owner}"

                for line in sys.stdin:
                    line = line.strip()
                    if not line:
                        continue
                    parts = line.split()
                    cmd = parts[0]
                    if cmd == "animal":
                        obj = Animal(parts[1])
                        print(obj.speak())
                    elif cmd == "dog":
                        obj = Dog(parts[1])
                        print(obj.speak())
                    elif cmd == "guidedog":
                        obj = GuideDog(parts[1], parts[2])
                        print(obj.speak())
                        print(str(obj))
