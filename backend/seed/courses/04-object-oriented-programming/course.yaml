            solution_code:
              python: |
                import math
                import sys

                class Vector:
                    def __init__(self, x, y):
                        self.x = x
                        self.y = y

                    def __repr__(self):
                        return f"Vector({self.x}, {self.y})"

                    def __add__(self, other):
                        return Vector(self.x + other.x, self.y + other.y)

                    def __eq__(self, other):
                        return self.x == other.x and self.y == other.y

                    def magnitude(self):
                        return round(math.sqrt(self.x ** 2 + self.y ** 2), 4)

                for line in sys.stdin:
                    line = line.strip()
                    if not line:
                        continue
                    parts = line.split()
                    cmd = parts[0]
                    if cmd == "add":
                        v1 = Vector(int(parts[1]), int(parts[2]))
                        v2 = Vector(int(parts[3]), int(parts[4]))
                        print(repr(v1 + v2))
                    elif cmd == "eq":
                        v1 = Vector(int(parts[1]), int(parts[2]))
                        v2 = Vector(int(parts[3]), int(parts[4]))
                        print(v1 == v2)
                    elif cmd == "mag":
                        v = Vector(int(parts[1]), int(parts[2]))
                        print(v.magnitude())
            test_cases:
              - name: basic-ops
                stdin: "add 1 2 3 4\neq 1 2 1 2\neq 1 2 3 4\nmag 3 4\n"
                expected_stdout: "Vector(4, 6)\nTrue\nFalse\n5.0"
                is_hidden: false
