            solution_code:
              python: |
                import sys

                class BankAccount:
                    def __init__(self, owner):
                        self.owner = owner
                        self._balance = 0

                    @property
                    def balance(self):
                        return self._balance

                    def deposit(self, amount):
                        self._balance += amount
                        print(f"Deposited {amount}. Balance: {self._balance}")

                    def withdraw(self, amount):
                        if amount > self._balance:
                            print(f"Insufficient funds. Balance: {self._balance}")
                        else:
                            self._balance -= amount
                            print(f"Withdrew {amount}. Balance: {self._balance}")

                    def get_balance(self):
                        print(f"Balance: {self._balance}")

                def solve():
                    data = sys.stdin.read().splitlines()
                    n = int(data[0])
                    account = BankAccount("User")
                    for i in range(1, n + 1):
                        parts = data[i].split()
                        cmd = parts[0]
                        if cmd == "DEPOSIT":
                            account.deposit(int(parts[1]))
                        elif cmd == "WITHDRAW":
                            account.withdraw(int(parts[1]))
                        elif cmd == "BALANCE":
                            account.get_balance()
                solve()
