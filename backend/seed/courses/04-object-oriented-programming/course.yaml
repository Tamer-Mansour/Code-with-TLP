            solution_code:
              python: |
                import sys

                class Shape:
                    def area(self):
                        return 0.0

                class Circle(Shape):
                    def __init__(self, radius):
                        self.radius = float(radius)
                    def area(self):
                        return 3.14159 * self.radius ** 2

                class Rectangle(Shape):
                    def __init__(self, width, height):
                        self.width = float(width)
                        self.height = float(height)
                    def area(self):
                        return self.width * self.height

                class Triangle(Shape):
                    def __init__(self, base, height):
                        self.base = float(base)
                        self.height = float(height)
                    def area(self):
                        return 0.5 * self.base * self.height

                def solve():
                    data = sys.stdin.read().splitlines()
                    n = int(data[0])
                    current = None
                    for i in range(1, n + 1):
                        parts = data[i].split()
                        cmd = parts[0]
                        if cmd == "CIRCLE":
                            current = Circle(parts[1])
                        elif cmd == "RECTANGLE":
                            current = Rectangle(parts[1], parts[2])
                        elif cmd == "TRIANGLE":
                            current = Triangle(parts[1], parts[2])
                        elif cmd == "AREA":
                            print(f"{current.area():.2f}")
                solve()
            test_cases:
              - name: three-shapes
                stdin: "6\nCIRCLE 5\nAREA\nRECTANGLE 4 6\nAREA\nTRIANGLE 3 8\nAREA\n"
                expected_stdout: "78.54\n24.00\n12.00"
                is_hidden: false
                weight: 1
              - name: unit-circle
                stdin: "2\nCIRCLE 1\nAREA\n"
                expected_stdout: "3.14"
                is_hidden: false
