                import math

                def solve():
                    params = input().split()
                    cache_size = int(params[0])
                    block_size = int(params[1])
                    # address_bits = int(params[2])  # not needed for simulation

                    num_lines = cache_size // block_size
                    offset_bits = int(math.log2(block_size))
                    index_bits = int(math.log2(num_lines))

                    cache = [None] * num_lines
                    m = int(input())
                    hits = 0

                    for _ in range(m):
                        addr_str = input().strip()
                        addr = int(addr_str, 16)
                        index = (addr >> offset_bits) & (num_lines - 1)
                        tag = addr >> (offset_bits + index_bits)

                        if cache[index] == tag:
                            print('HIT')
                            hits += 1
                        else:
                            print('MISS')
                            cache[index] = tag

                    hit_rate = (hits / m) * 100
                    print(f'Hit rate: {hit_rate:.2f}%')

                solve()
