    A rigorous tour of how modern computers are built and how they execute programs,
    following the classic Patterson & Hennessy / CS:APP curriculum. Covers digital
    logic, number representation, CPU datapath and control, ISA design, memory
    hierarchy with caches, pipelining with hazards, and I/O performance. Includes
    hands-on coding exercises that reinforce bit-level reasoning.
  difficulty: intermediate
  estimated_hours: 24
  is_published: true
  order_index: 1

