              python: |
                def solve():
                    t = int(input())
                    for i in range(t):
                        hex_str = input().strip()
                        v = int(hex_str, 16)
                        opcode = v & 0x7F
                        rd = (v >> 7) & 0x1F
                        funct3 = (v >> 12) & 0x7
                        rs1 = (v >> 15) & 0x1F
                        rs2 = (v >> 20) & 0x1F
                        funct7 = (v >> 25) & 0x7F
                        print(f"opcode: {opcode}")
                        print(f"rd: {rd}")
                        print(f"funct3: {funct3}")
                        print(f"rs1: {rs1}")
                        print(f"rs2: {rs2}")
                        print(f"funct7: {funct7}")
                        if i < t - 1:
                            print()

                solve()
