                expected_stdout: "1"
                is_hidden: false
                weight: 1
              - name: case-4-two-nops
                stdin: "4\nADD r1 r2 r3\nNOP\nNOP\nADD r4 r1 r5\n"
                expected_stdout: "0"
                is_hidden: true
                weight: 1
              - name: case-5-chain-hazards
                stdin: "3\nADD r1 r2 r3\nADD r4 r1 r5\nADD r6 r4 r7\n"
                expected_stdout: "4"
                is_hidden: true
                weight: 1
              - name: case-6-load-use
                stdin: "2\nLOAD r1 r2\nADD r3 r1 r4\n"
                expected_stdout: "2"
                is_hidden: true
                weight: 1
              - name: case-7-store-no-dst
                stdin: "3\nADD r1 r2 r3\nSTORE r1 r4\nADD r5 r1 r6\n"
                expected_stdout: "2"
                is_hidden: true
