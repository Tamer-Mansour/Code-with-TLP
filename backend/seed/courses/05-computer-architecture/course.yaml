          - slug: computer-pipeline-hazard-detector
            title: "Pipeline Hazard Detector"
            difficulty: medium
            points: 25
            prompt_file: lessons/computer-pipeline-hazard-detector.prompt.md
            supported_languages: [python]
            tags: [pipeline, hazards, RAW, stalls, pipelining]
            time_limit_ms: 3000
            memory_limit_mb: 256
            starter_code:
              python: |
                def solve():
                    n = int(input())
                    instructions = []
                    for _ in range(n):
                        instructions.append(input().split())
                    # TODO: count total stall cycles from RAW hazards (no forwarding)
                    print(0)

                solve()
            solution_code:
              python: |
                def solve():
                    n = int(input())
                    instructions = []
                    for _ in range(n):
                        instructions.append(input().split())

                    def get_dst(instr):
                        op = instr[0]
                        if op in ('ADD', 'SUB', 'LOAD'):
                            return instr[1]
                        return None

                    def get_srcs(instr):
                        op = instr[0]
                        if op in ('ADD', 'SUB'):
                            return [instr[2], instr[3]]
                        if op == 'LOAD':
                            return [instr[2]]
                        if op == 'STORE':
                            return [instr[1]]
                        return []

                    IF_cycle = [0] * n
                    total_stalls = 0

                    for i in range(n):
                        if i == 0:
                            IF_cycle[i] = 1
                        else:
                            IF_cycle[i] = IF_cycle[i - 1] + 1

                        ID_cycle = IF_cycle[i] + 1
                        srcs = get_srcs(instructions[i])
                        stalls_needed = 0

                        for j in range(i):
                            dst_j = get_dst(instructions[j])
                            if dst_j is not None and dst_j in srcs:
                                WB_cycle = IF_cycle[j] + 4
                                if WB_cycle > ID_cycle:
                                    stalls_needed = max(stalls_needed, WB_cycle - ID_cycle)

                        IF_cycle[i] += stalls_needed
                        total_stalls += stalls_needed

                    print(total_stalls)

                solve()
            test_cases:
              - name: case-1-no-hazards
                stdin: "3\nADD r1 r2 r3\nADD r4 r5 r6\nADD r7 r8 r9\n"
                expected_stdout: "0"
                is_hidden: false
                weight: 1
