            supported_languages: [python]
            tags: [sql, transactions, acid, savepoint]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    lines = sys.stdin.read().strip().split('\n')
                    table = {}
                    savepoint = None
                    for line in lines:
                        parts = line.split()
                        cmd = parts[0]
                        # TODO: handle BEGIN, INSERT, DELETE, SAVEPOINT,
                        # ROLLBACK_TO_SAVEPOINT, COMMIT, ROLLBACK
                        pass
                    # TODO: print sorted table contents or EMPTY

                solve()
            solution_code:
              python: |
                import sys

                def main():
                    lines = sys.stdin.read().strip().split('\n')
                    table = {}
                    savepoint = None
                    for line in lines:
                        parts = line.split()
                        cmd = parts[0]
                        if cmd == 'BEGIN':
                            table = {}
                            savepoint = None
                        elif cmd == 'INSERT':
                            name, amount = parts[1], int(parts[2])
                            table[name] = amount
                        elif cmd == 'DELETE':
                            name = parts[1]
                            table.pop(name, None)
                        elif cmd == 'SAVEPOINT':
                            savepoint = dict(table)
                        elif cmd == 'ROLLBACK_TO_SAVEPOINT':
                            if savepoint is not None:
                                table = dict(savepoint)
                            else:
                                table = {}
                        elif cmd == 'COMMIT':
                            savepoint = None
                        elif cmd == 'ROLLBACK':
                            table = {}
                            savepoint = None
                    if not table:
                        print('EMPTY')
                    else:
                        for name in sorted(table.keys()):
                            print(name, table[name])

                main()
            test_cases:
              - name: savepoint-and-commit
                stdin: "BEGIN\nINSERT Alice 1000\nINSERT Bob 2000\nSAVEPOINT\nINSERT Carol 3000\nDELETE Bob\nROLLBACK_TO_SAVEPOINT\nINSERT Dave 4000\nCOMMIT"
                expected_stdout: "Alice 1000\nBob 2000\nDave 4000"
                is_hidden: false
                weight: 1
              - name: full-rollback
                stdin: "BEGIN\nINSERT Alice 500\nINSERT Bob 300\nROLLBACK"
                expected_stdout: "EMPTY"
                is_hidden: false
                weight: 1
              - name: commit-no-savepoint
                stdin: "BEGIN\nINSERT Alice 100\nINSERT Bob 200\nCOMMIT"
                expected_stdout: "Alice 100\nBob 200"
                is_hidden: false
                weight: 1
              - name: rollback-to-savepoint-no-prior-savepoint
                stdin: "BEGIN\nINSERT Alice 999\nROLLBACK_TO_SAVEPOINT"
                expected_stdout: "EMPTY"
                is_hidden: true
                weight: 1
              - name: delete-then-commit
                stdin: "BEGIN\nINSERT Alice 100\nINSERT Bob 200\nINSERT Carol 300\nSAVEPOINT\nDELETE Alice\nDELETE Carol\nCOMMIT"
                expected_stdout: "Bob 200"
                is_hidden: true
                weight: 1
              - name: overwrite-insert
                stdin: "BEGIN\nINSERT Alice 100\nINSERT Alice 999\nCOMMIT"
                expected_stdout: "Alice 999"
                is_hidden: true
                weight: 1
