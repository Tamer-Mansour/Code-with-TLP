                def solve():
                    data = sys.stdin.read().strip().split('\n')
                    idx = 0
                    n = int(data[idx]); idx += 1
                    # TODO: read N (key, value) pairs (sorted by key)
                    # Then read Q queries; for each query key, binary search and print value or NOT FOUND
