        type: exercise
        duration_minutes: 20
        content_file: lessons/filter-rows-exercise.md
        exercises:
          - slug: mysql-filter-rows
            title: WHERE-style Row Filter
            difficulty: easy
            points: 15
            prompt_file: lessons/mysql-filter-rows.prompt.md
            supported_languages: [python]
            tags: [sql, filtering]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().splitlines()
                    # TODO: read header, threshold, then rows; print rows where age > threshold
                    pass

                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    lines = [ln for ln in sys.stdin.read().splitlines() if ln != ""]
                    if not lines:
                        return
                    header = lines[0]
                    threshold = int(lines[1])
                    cols = header.split(",")
                    age_idx = cols.index("age")
                    out = [header]
                    for row in lines[2:]:
                        parts = row.split(",")
                        if int(parts[age_idx]) > threshold:
                            out.append(row)
                    print("\n".join(out))

                solve()
            test_cases:
              - name: simple
                stdin: "id,name,age\n25\n1,Alice,30\n2,Bob,22\n3,Carol,40\n"
                expected_stdout: "id,name,age\n1,Alice,30\n3,Carol,40"
                is_hidden: false
                weight: 1
              - name: none-match
                stdin: "id,name,age\n100\n1,Alice,30\n2,Bob,22\n"
                expected_stdout: "id,name,age"
                is_hidden: false
                weight: 1
              - name: all-match
                stdin: "id,name,age\n0\n1,A,1\n2,B,2\n"
                expected_stdout: "id,name,age\n1,A,1\n2,B,2"
                is_hidden: true
                weight: 1
              - name: boundary
                stdin: "id,name,age\n30\n1,A,30\n2,B,31\n"
                expected_stdout: "id,name,age\n2,B,31"
                is_hidden: true
                weight: 1

