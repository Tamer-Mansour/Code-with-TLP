            solution_code:
              python: |
                import sys
                import bisect

                def main():
                    data = sys.stdin.read().strip().split('\n')
                    idx = 0
                    n = int(data[idx]); idx += 1
                    keys = []
                    values = []
                    for _ in range(n):
                        parts = data[idx].split(); idx += 1
                        keys.append(int(parts[0]))
                        values.append(parts[1])
                    q = int(data[idx]); idx += 1
                    for _ in range(q):
                        query_key = int(data[idx]); idx += 1
                        pos = bisect.bisect_left(keys, query_key)
                        if pos < len(keys) and keys[pos] == query_key:
                            print(values[pos])
                        else:
                            print('NOT FOUND')

                main()
            test_cases:
