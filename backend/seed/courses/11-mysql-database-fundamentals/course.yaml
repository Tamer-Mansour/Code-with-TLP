        exercises:
          - slug: mysql-inner-join
            title: Inner Join Two CSVs
            difficulty: medium
            points: 25
            prompt_file: lessons/mysql-inner-join.prompt.md
            supported_languages: [python]
            tags: [sql, joins]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    # TODO: read users table and orders table, inner-join on user_id, print joined rows
                    pass

                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().splitlines()
                    i = 0
                    n_left = int(data[i]); i += 1
                    left_header = data[i].split(","); i += 1
                    left = []
                    for _ in range(n_left):
                        left.append(data[i].split(",")); i += 1
                    n_right = int(data[i]); i += 1
                    right_header = data[i].split(","); i += 1
                    right = []
                    for _ in range(n_right):
                        right.append(data[i].split(",")); i += 1
                    key = "user_id"
                    li = left_header.index(key)
                    ri = right_header.index(key)
                    # build right index
                    idx = {}
                    for r in right:
                        idx.setdefault(r[ri], []).append(r)
                    out_header = left_header + [c for c in right_header if c != key]
                    print(",".join(out_header))
                    for l in left:
                        for r in idx.get(l[li], []):
                            merged = l + [r[k] for k in range(len(right_header)) if k != ri]
                            print(",".join(merged))

                solve()
            test_cases:
              - name: basic
                stdin: "2\nuser_id,name\n1,Alice\n2,Bob\n2\nuser_id,amount\n1,100\n2,50\n"
                expected_stdout: "user_id,name,amount\n1,Alice,100\n2,Bob,50"
                is_hidden: false
                weight: 1
              - name: many-to-one-drop
                stdin: "3\nuser_id,name\n1,A\n2,B\n3,C\n2\nuser_id,amount\n1,10\n2,20\n"
                expected_stdout: "user_id,name,amount\n1,A,10\n2,B,20"
                is_hidden: false
                weight: 1
              - name: many-to-many
                stdin: "2\nuser_id,name\n1,A\n1,B\n2\nuser_id,amount\n1,10\n1,20\n"
                expected_stdout: "user_id,name,amount\n1,A,10\n1,A,20\n1,B,10\n1,B,20"
                is_hidden: true
                weight: 1
              - name: no-match
                stdin: "1\nuser_id,name\n1,A\n1\nuser_id,amount\n9,99\n"
                expected_stdout: "user_id,name,amount"
                is_hidden: true
                weight: 1
