            solution_code:
              python: |
                import sys
                from collections import defaultdict

                def main():
                    data = sys.stdin.read().strip().split('\n')
                    n = int(data[0])
                    groups = defaultdict(list)
                    for i in range(1, n + 1):
                        parts = data[i].split()
                        product = parts[0]
                        amount = float(parts[1])
                        groups[product].append(amount)
                    for product in sorted(groups.keys()):
                        amounts = groups[product]
                        cnt = len(amounts)
                        avg = round(sum(amounts) / cnt, 2)
                        print(f'{product} {cnt} {avg:.2f}')

                main()
