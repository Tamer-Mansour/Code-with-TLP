subject:
  slug: systems
  name: Systems
  description: How computers run software, from the CPU up to the network.
  icon: server
  color: '#ef4444'
  order_index: 4
course:
  slug: cpp-for-systems
  title: C++ for Systems Programming
  summary: Modern C++ from the ground up for systems work — memory, OOP, RAII, templates, the STL, bit-level
    tricks, and concurrency.
  description: A deep, systems-oriented C++ course. Build a precise mental model of memory, pointers,
    object lifetime, and the rules that govern undefined behaviour, then layer on OOP, RAII, smart pointers,
    templates, the STL, and concurrency — all with the low-level detail systems engineers need.
  difficulty: advanced
  estimated_hours: 40
  order_index: 31
  is_published: true
