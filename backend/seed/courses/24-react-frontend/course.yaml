        content_file: lessons/react-usestate-batch-exercise.md
        exercises:
          - slug: react-usestate-batch
            title: useState Batch Updater Simulator
            difficulty: easy
            points: 15
            prompt_file: lessons/react-usestate-batch.prompt.md
            supported_languages: [python]
            tags: [react, usestate, batching]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    pass

                solve()
            solution_code:
              python: |
                import sys

                def apply_op(state, op):
                    parts = op.split()
                    if parts[0] == 'SET':
                        return int(parts[1])
                    elif parts[0] == 'INC':
                        return state + 1
                    elif parts[0] == 'DEC':
                        return state - 1
                    elif parts[0] == 'DOUBLE':
                        return state * 2
                    return state

                def solve():
                    lines = sys.stdin.read().splitlines()
                    state = 0
                    batch = []
                    for line in lines:
                        stripped = line.strip()
                        if stripped == '':
                            if batch:
                                for op in batch:
                                    state = apply_op(state, op)
                                print(state)
                                batch = []
                        else:
                            batch.append(stripped)
                    if batch:
                        for op in batch:
                            state = apply_op(state, op)
                        print(state)

                solve()
            test_cases:
              - name: basic-batch
                stdin: "SET 5\nINC\nINC\n\nDOUBLE\nDEC\n\nSET 10"
                expected_stdout: "7\n13\n10"
                is_hidden: false
                weight: 1
              - name: three-incs-then-double
                stdin: "INC\nINC\nINC\n\nDOUBLE\n\nDEC\nDEC"
                expected_stdout: "3\n6\n4"
                is_hidden: false
                weight: 1
              - name: single-set
                stdin: "SET 100"
                expected_stdout: "100"
                is_hidden: false
                weight: 1
              - name: negative-set
                stdin: "SET -5\nDOUBLE\n\nINC\nINC\nINC"
                expected_stdout: "-10\n-7"
                is_hidden: true
                weight: 1
              - name: dec-below-zero
                stdin: "DEC\nDEC\nDEC\n\nDOUBLE"
                expected_stdout: "-3\n-6"
                is_hidden: true
                weight: 1
