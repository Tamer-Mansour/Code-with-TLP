        content_file: lessons/react-useeffect-deps-exercise.md
        exercises:
          - slug: react-useeffect-deps
            title: useEffect Dependency Tracker
            difficulty: medium
            points: 20
            prompt_file: lessons/react-useeffect-deps.prompt.md
            supported_languages: [python]
            tags: [react, useeffect, hooks]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    pass

                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    lines = sys.stdin.read().splitlines()
                    if not lines:
                        return
                    renders = []
                    for line in lines[1:]:
                        renders.append(line.strip())
                    prev = None
                    for render in renders:
                        if prev is None:
                            print('EFFECT RUNS')
                        else:
                            if render != prev:
                                print('EFFECT RUNS')
                            else:
                                print('NO EFFECT')
                        prev = render

                solve()
            test_cases:
              - name: two-deps-basic
                stdin: "count,name\n0,Alice\n0,Alice\n1,Alice\n1,Bob\n1,Bob"
                expected_stdout: "EFFECT RUNS\nNO EFFECT\nEFFECT RUNS\nEFFECT RUNS\nNO EFFECT"
                is_hidden: false
                weight: 1
              - name: single-dep
                stdin: "x\n5\n5\n10\n10\n10"
                expected_stdout: "EFFECT RUNS\nNO EFFECT\nEFFECT RUNS\nNO EFFECT\nNO EFFECT"
                is_hidden: false
                weight: 1
              - name: single-render-mount
                stdin: "x\n5"
                expected_stdout: "EFFECT RUNS"
                is_hidden: false
                weight: 1
              - name: all-different
                stdin: "a,b\n1,2\n1,3\n2,3"
                expected_stdout: "EFFECT RUNS\nEFFECT RUNS\nEFFECT RUNS"
                is_hidden: true
                weight: 1
              - name: all-same
                stdin: "val\nhello\nhello\nhello\nhello"
                expected_stdout: "EFFECT RUNS\nNO EFFECT\nNO EFFECT\nNO EFFECT"
                is_hidden: true
