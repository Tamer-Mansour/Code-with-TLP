        exercises:
          - slug: react-render-count
            title: Render Count Simulation
            difficulty: easy
            points: 15
            prompt_file: lessons/react-render-count.prompt.md
            supported_languages: [python]
            tags: [react, simulation]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    lines = sys.stdin.read().splitlines()
                    state = {}
                    renders = 0
                    for ln in lines:
                        if not ln.strip():
                            continue
                        parts = ln.split()
                        cmd = parts[0]
                        if cmd == "SET":
                            key, value = parts[1], parts[2]
                            if state.get(key) != value:
                                state[key] = value
                                renders += 1
                    print(renders)

                solve()
            test_cases:
              - name: all-distinct
                stdin: "SET a 1\nSET b 2\nSET c 3\n"
                expected_stdout: "3"
                is_hidden: false
                weight: 1
              - name: no-op-same-value
                stdin: "SET a 1\nSET a 1\nSET a 1\n"
                expected_stdout: "1"
                is_hidden: false
                weight: 1
              - name: mixed
                stdin: "SET a 1\nSET a 2\nSET b 1\nSET b 1\n"
                expected_stdout: "3"
                is_hidden: true
                weight: 1
              - name: empty
                stdin: "\n"
                expected_stdout: "0"
                is_hidden: true
                weight: 1

  - title: Forms and Validation
    summary: Controlled inputs, validation patterns, and React Hook Form.
    order_index: 4
    lessons:
      - slug: react-forms
