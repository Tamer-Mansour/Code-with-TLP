        content_file: lessons/react-component-tree-exercise.md
        exercises:
          - slug: react-component-tree
            title: Component Tree Renderer
            difficulty: easy
            points: 15
            prompt_file: lessons/react-component-tree.prompt.md
            supported_languages: [python]
            tags: [react, components, tree]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                from collections import defaultdict

                def solve():
                    pass

                solve()
            solution_code:
              python: |
                import sys
                from collections import defaultdict

                def solve():
                    lines = sys.stdin.read().splitlines()
                    children = defaultdict(list)
                    i = 0
                    while i < len(lines) and lines[i].strip() != '':
                        parts = lines[i].strip().split()
                        parent, child = parts[0], parts[1]
                        children[parent].append(child)
                        i += 1
                    i += 1
                    root = lines[i].strip() if i < len(lines) else ''

                    def render(node, depth):
                        print(' ' * (depth * 2) + '<' + node + '>')
                        for c in children[node]:
                            render(c, depth + 1)

                    render(root, 0)

                solve()
            test_cases:
              - name: multi-level-tree
                stdin: "App Header\nApp Main\nApp Footer\nMain ArticleList\nMain Sidebar\nArticleList ArticleCard\n\nApp"
                expected_stdout: "<App>\n  <Header>\n  <Main>\n    <ArticleList>\n      <ArticleCard>\n    <Sidebar>\n  <Footer>"
                is_hidden: false
                weight: 1
              - name: two-branch-tree
                stdin: "Root Alpha\nRoot Beta\nAlpha Child1\nBeta Child2\n\nRoot"
                expected_stdout: "<Root>\n  <Alpha>\n    <Child1>\n  <Beta>\n    <Child2>"
                is_hidden: false
                weight: 1
              - name: single-child
                stdin: "App Nav\n\nApp"
                expected_stdout: "<App>\n  <Nav>"
                is_hidden: false
                weight: 1
              - name: leaf-only
                stdin: "\nApp"
                expected_stdout: "<App>"
                is_hidden: true
                weight: 1
              - name: deep-nesting
                stdin: "A B\nB C\nC D\nD E\n\nA"
                expected_stdout: "<A>\n  <B>\n    <C>\n      <D>\n        <E>"
                is_hidden: true
                weight: 1

