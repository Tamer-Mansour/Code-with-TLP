      - slug: react-prop-drilling-exercise
        title: "Props Propagation Depth Analyzer"
        type: exercise
        duration_minutes: 25
        content_file: lessons/react-prop-drilling-exercise.md
        exercises:
          - slug: react-prop-drilling
            title: Props Propagation Depth Analyzer
            difficulty: medium
            points: 20
            prompt_file: lessons/react-prop-drilling.prompt.md
            supported_languages: [python]
            tags: [react, props, context, tree]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                from collections import defaultdict, deque

                def solve():
                    pass

                solve()
            solution_code:
              python: |
                import sys
                from collections import defaultdict, deque

                def solve():
                    lines = sys.stdin.read().splitlines()
                    children = defaultdict(list)
                    i = 0
                    while i < len(lines) and lines[i].strip() != '':
                        parts = lines[i].strip().split()
                        p, c = parts[0], parts[1]
                        children[p].append(c)
                        i += 1
                    i += 1
                    parts = lines[i].strip().split()
                    source, consumer = parts[0], parts[1]

                    visited = {source: None}
                    queue = deque([source])
                    found = False
                    while queue:
                        node = queue.popleft()
                        if node == consumer:
                            found = True
                            break
                        for child in children[node]:
                            if child not in visited:
                                visited[child] = node
                                queue.append(child)

                    if not found:
                        print('NO PATH')
                        return

                    path = []
                    cur = consumer
                    while cur is not None:
                        path.append(cur)
                        cur = visited[cur]
                    path.reverse()

                    length = len(path)
                    drilling = max(0, length - 2)
                    print('Path length: ' + str(length))
                    print('Intermediate (drilling) components: ' + str(drilling))

                solve()
            test_cases:
              - name: deep-drill
                stdin: "App Page\nPage Section\nSection Panel\nPanel Widget\nWidget Button\n\nApp Button"
                expected_stdout: "Path length: 6\nIntermediate (drilling) components: 4"
                is_hidden: false
                weight: 1
              - name: direct-parent-child
                stdin: "App Child\n\nApp Child"
                expected_stdout: "Path length: 2\nIntermediate (drilling) components: 0"
                is_hidden: false
                weight: 1
              - name: no-path
                stdin: "App Child\nOther Sibling\n\nApp Sibling"
                expected_stdout: "NO PATH"
                is_hidden: false
                weight: 1
              - name: three-level-drill
                stdin: "Root A\nA B\nB C\n\nRoot C"
                expected_stdout: "Path length: 4\nIntermediate (drilling) components: 2"
                is_hidden: true
                weight: 1
              - name: two-level-tree
                stdin: "App Header\nApp Main\nMain Nav\nMain Content\n\nApp Content"
                expected_stdout: "Path length: 3\nIntermediate (drilling) components: 1"
                is_hidden: true
                weight: 1

