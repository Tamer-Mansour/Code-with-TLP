      - slug: form-validation-exercise
        title: Form Validation Rules
        type: exercise
        duration_minutes: 15
        content_file: lessons/form-validation-exercise.md
        exercises:
          - slug: form-validation-check
            title: Form Validation Checker
            difficulty: medium
            points: 20
            prompt_file: lessons/form-validation-check.prompt.md
            supported_languages: [python]
            tags: [forms, validation, regex]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                import re

                def solve():
                    pass

                solve()
            solution_code:
              python: |
                import sys
                import re

                def solve():
                    lines = sys.stdin.read().splitlines()
                    for line in lines:
                        if not line.strip():
                            continue
                        parts = line.split()
                        if len(parts) < 4:
                            continue
                        field, value, rule, param = parts[0], parts[1], parts[2], parts[3]
                        if rule == "required":
                            ok = value != "_" and value != ""
                        elif rule == "minlen":
                            ok = len(value) >= int(param)
                        elif rule == "maxlen":
                            ok = len(value) <= int(param)
                        elif rule == "regex":
                            ok = bool(re.fullmatch(param, value))
                        else:
                            ok = False
                        print(f"{field}: {'PASS' if ok else 'FAIL'}")

                solve()
            test_cases:
              - name: required-pass
                stdin: "email alice@example.com required _\n"
                expected_stdout: "email: PASS"
                is_hidden: false
                weight: 1
              - name: required-fail
                stdin: "name _ required _\n"
                expected_stdout: "name: FAIL"
                is_hidden: false
                weight: 1
              - name: minlen-pass
                stdin: "pass secret123 minlen 8\n"
                expected_stdout: "pass: PASS"
                is_hidden: false
                weight: 1
              - name: minlen-fail
                stdin: "pass hi minlen 8\n"
                expected_stdout: "pass: FAIL"
                is_hidden: true
                weight: 1
              - name: maxlen-pass
                stdin: "code abc maxlen 5\n"
                expected_stdout: "code: PASS"
                is_hidden: true
                weight: 1
              - name: multi-rules
                stdin: "email alice@example.com required _\nname _ required _\npass secret123 minlen 8\n"
                expected_stdout: "email: PASS\nname: FAIL\npass: PASS"
                is_hidden: true
                weight: 1

