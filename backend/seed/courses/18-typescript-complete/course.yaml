      - slug: typescript-narrowing-machine-exercise
        title: "Type Narrowing State Machine"
        type: exercise
        duration_minutes: 25
        content_file: lessons/typescript-narrowing-machine.md
        exercises:
          - slug: typescript-narrowing-machine
            title: Type Narrowing State Machine
            difficulty: medium
            points: 20
            prompt_file: lessons/typescript-narrowing-machine.prompt.md
            supported_languages: [python]
            tags: [typescript, narrowing, type-guards, control-flow]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def parse_value(token):
                    # Return (type_name, value)
                    pass

                for line in sys.stdin:
                    line = line.strip()
                    if not line:
                        continue
                    # TODO: parse value and guards, apply each guard
            solution_code:
              python: |
                import sys

                def parse_value(token):
                    if token == 'null':
                        return ('null', None)
                    if token == 'undefined':
                        return ('undefined', None)
                    if token in ('true', 'false'):
                        return ('boolean', token == 'true')
                    if token.startswith('"') and token.endswith('"'):
                        return ('string', token[1:-1])
                    try:
                        if '.' in token:
                            return ('number', float(token))
                        return ('number', int(token))
                    except ValueError:
                        return ('string', token)

                for line in sys.stdin:
                    line = line.strip()
                    if not line:
                        continue
                    parts = line.split('|')
                    val_token = parts[0].strip()
                    guards = parts[1].strip().split() if len(parts) > 1 else []
                    current_type, current_val = parse_value(val_token)
                    narrowed_to_never = False
                    for guard in guards:
                        if narrowed_to_never:
                            break
                        if guard == 'typeof_string':
                            if current_type != 'string':
                                narrowed_to_never = True
                        elif guard == 'typeof_number':
                            if current_type != 'number':
                                narrowed_to_never = True
                        elif guard == 'typeof_boolean':
                            if current_type != 'boolean':
                                narrowed_to_never = True
                        elif guard == 'not_null':
                            if current_type == 'null':
                                narrowed_to_never = True
                        elif guard == 'not_undefined':
                            if current_type == 'undefined':
                                narrowed_to_never = True
                        elif guard == 'is_finite':
                            if current_type != 'number':
                                narrowed_to_never = True
                            elif current_val is not None and (current_val != current_val or abs(current_val) == float('inf')):
                                narrowed_to_never = True
                    if narrowed_to_never:
                        print('never')
                    else:
                        print(current_type)
            test_cases:
              - name: basic-guards
                stdin: "42 | typeof_number\n\"hello\" | typeof_string\nnull | not_null\ntrue | typeof_boolean\n"
                expected_stdout: "number\nstring\nnever\nboolean"
                is_hidden: false
                weight: 1
              - name: chained-guards
                stdin: "3.14 | typeof_number is_finite\n\"world\" | typeof_number\nundefined | not_undefined\n99 | typeof_number is_finite\n"
                expected_stdout: "number\nnever\nnever\nnumber"
                is_hidden: false
                weight: 1
              - name: boolean-and-null
                stdin: "false | typeof_boolean\nnull | not_null\nundefined | not_undefined\nnull | not_undefined\n"
                expected_stdout: "boolean\nnever\nnever\nnull"
                is_hidden: false
                weight: 1
              - name: string-type-mismatch
                stdin: "\"test\" | typeof_number\n42 | typeof_string\ntrue | typeof_number\n"
                expected_stdout: "never\nnever\nnever"
                is_hidden: true
                weight: 1
              - name: no-guards
                stdin: "42 | \n\"hi\" | \nnull | \n"
                expected_stdout: "number\nstring\nnull"
                is_hidden: true
                weight: 1
              - name: multiple-chained
                stdin: "5 | typeof_number is_finite\n\"text\" | typeof_string\nundefined | not_null not_undefined\n"
                expected_stdout: "number\nstring\nnever"
                is_hidden: true
                weight: 1

