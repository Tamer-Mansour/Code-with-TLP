        content_file: lessons/validate-shape-exercise.md
        exercises:
          - slug: ts-shape-validator
            title: Required-Fields Validator (Shape Check Simulation)
            difficulty: medium
            points: 20
            prompt_file: lessons/ts-shape-validator.prompt.md
            supported_languages: [python]
            tags: [typescript, validation]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys, json
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys, json

                def solve():
                    lines = sys.stdin.read().splitlines()
                    required = [f.strip() for f in lines[0].split(",") if f.strip()]
                    n = int(lines[1])
                    out = []
                    for i in range(2, 2 + n):
                        try:
                            obj = json.loads(lines[i])
                        except Exception:
                            out.append("INVALID")
                            continue
                        missing = [f for f in required if f not in obj]
                        if missing:
                            out.append("MISSING " + ",".join(missing))
                        else:
                            out.append("OK")
                    print("\n".join(out))

                solve()
            test_cases:
              - name: ok-and-missing
                stdin: "name,email\n3\n{\"name\":\"Alice\",\"email\":\"a@x\"}\n{\"name\":\"Bob\"}\n{\"email\":\"c@x\"}\n"
                expected_stdout: "OK\nMISSING email\nMISSING name"
                is_hidden: false
                weight: 1
              - name: extra-fields-ok
                stdin: "id\n2\n{\"id\":1,\"extra\":true}\n{}\n"
                expected_stdout: "OK\nMISSING id"
                is_hidden: false
                weight: 1
              - name: invalid-json
                stdin: "a\n2\n{\"a\":1}\n{not json\n"
                expected_stdout: "OK\nINVALID"
                is_hidden: true
                weight: 1
              - name: multiple-missing
                stdin: "a,b,c\n1\n{\"a\":1}\n"
                expected_stdout: "MISSING b,c"
                is_hidden: true
                weight: 1

