                solve()
            solution_code:
              python: |
                import sys, json, math

                def solve():
                    data = sys.stdin.read().splitlines()
                    n = int(data[0])
                    results = []
                    for i in range(1, 1 + n):
                        try:
                            obj = json.loads(data[i])
                        except Exception:
                            results.append("unknown")
                            continue
                        kind = obj.get("kind", "")
                        if kind == "circle":
                            area = math.pi * obj["radius"] ** 2
                            results.append(f"circle area={area:.2f}")
                        elif kind == "rectangle":
                            area = obj["width"] * obj["height"]
                            results.append(f"rectangle area={area:.2f}")
                        elif kind == "text":
                            results.append(f"text len={len(obj['value'])}")
                        else:
                            results.append("unknown")
                    print("\n".join(results))

                solve()
            test_cases:
              - name: basic-shapes
                stdin: "3\n{\"kind\":\"circle\",\"radius\":5}\n{\"kind\":\"rectangle\",\"width\":4,\"height\":3}\n{\"kind\":\"text\",\"value\":\"hello\"}\n"
                expected_stdout: "circle area=78.54\nrectangle area=12.00\ntext len=5"
