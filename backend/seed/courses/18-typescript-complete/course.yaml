          - slug: ts-discriminator
            title: Shape and Text Discriminator
            difficulty: easy
            points: 15
            prompt_file: lessons/ts-discriminator.prompt.md
            supported_languages: [python]
            tags: [typescript, unions, narrowing]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys, json, math

                def solve():
                    data = sys.stdin.read().splitlines()
                    n = int(data[0])
                    for i in range(1, 1 + n):
                        # TODO: parse and dispatch on kind
                        pass

                solve()
            solution_code:
              python: |
                import sys, json, math

                def solve():
                    data = sys.stdin.read().splitlines()
                    n = int(data[0])
                    results = []
                    for i in range(1, 1 + n):
                        try:
                            obj = json.loads(data[i])
                        except Exception:
                            results.append("unknown")
                            continue
                        kind = obj.get("kind", "")
                        if kind == "circle":
                            area = math.pi * obj["radius"] ** 2
                            results.append(f"circle area={area:.2f}")
                        elif kind == "rectangle":
                            area = obj["width"] * obj["height"]
                            results.append(f"rectangle area={area:.2f}")
                        elif kind == "text":
                            results.append(f"text len={len(obj['value'])}")
                        else:
                            results.append("unknown")
                    print("\n".join(results))

                solve()
            test_cases:
              - name: basic-shapes
                stdin: "3\n{\"kind\":\"circle\",\"radius\":5}\n{\"kind\":\"rectangle\",\"width\":4,\"height\":3}\n{\"kind\":\"text\",\"value\":\"hello\"}\n"
                expected_stdout: "circle area=78.54\nrectangle area=12.00\ntext len=5"
                is_hidden: false
                weight: 1
              - name: small-circle
                stdin: "2\n{\"kind\":\"circle\",\"radius\":3}\n{\"kind\":\"text\",\"value\":\"hi\"}\n"
                expected_stdout: "circle area=28.27\ntext len=2"
                is_hidden: false
                weight: 1
              - name: unknown-kind
                stdin: "2\n{\"kind\":\"triangle\",\"base\":4,\"height\":3}\n{\"kind\":\"circle\",\"radius\":1}\n"
                expected_stdout: "unknown\ncircle area=3.14"
                is_hidden: true
                weight: 1
              - name: empty-text
                stdin: "1\n{\"kind\":\"text\",\"value\":\"\"}\n"
                expected_stdout: "text len=0"
                is_hidden: true
                weight: 1
              - name: square-rectangle
                stdin: "1\n{\"kind\":\"rectangle\",\"width\":7,\"height\":7}\n"
                expected_stdout: "rectangle area=49.00"
                is_hidden: true
                weight: 1

