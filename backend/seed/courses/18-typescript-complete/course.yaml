                    # TODO: implement PARTIAL, REQUIRED, PICK, OMIT
            solution_code:
              python: |
                import sys

                lines = [l.strip() for l in sys.stdin if l.strip()]
                schema_line = lines[0]
                fields = []
                required_set = set()
                for token in schema_line.split(','):
                    name, status = token.split(':')
                    fields.append(name)
                    if status == 'required':
                        required_set.add(name)

                for line in lines[1:]:
                    parts = line.split()
                    op = parts[0]
                    if op == 'PARTIAL':
                        print(','.join(fields))
                    elif op == 'REQUIRED':
                        result = [f for f in fields if f in required_set]
                        print(','.join(result))
                    elif op == 'PICK':
                        picked = set(parts[1:])
                        result = [f for f in fields if f in picked]
                        print(','.join(result))
                    elif op == 'OMIT':
                        omitted = set(parts[1:])
                        result = [f for f in fields if f not in omitted]
                        print(','.join(result))
            test_cases:
              - name: all-four-commands
                stdin: "name:required,age:required,email:optional,role:optional\nPARTIAL\nREQUIRED\nPICK name role\nOMIT age email\n"
