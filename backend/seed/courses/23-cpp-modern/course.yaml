                        n_sub = int(parts[1])
                        subs = parts[2:2+n_sub] if n_sub > 0 else []
                        templates[name] = [s for s in subs if s != 'BASE']
                    start = input().strip()
                    # perform DFS and track depth
                    pass
                solve()
            solution_code:
              python: |
                import sys
                sys.setrecursionlimit(100000)

                def solve():
                    first_line = input().split()
                    M, LIMIT = int(first_line[0]), int(first_line[1])

                    templates = {}
                    for _ in range(M):
                        parts = input().split()
                        name = parts[0]
                        n_sub = int(parts[1])
                        subs = parts[2:2+n_sub] if n_sub > 0 else []
                        templates[name] = [s for s in subs if s != 'BASE']

                    start = input().strip()
                    visited = set()
                    depth_exceeded = False
                    exceeded_path = 'N/A'

                    def dfs(node, depth, path):
                        nonlocal depth_exceeded, exceeded_path
                        if depth > LIMIT:
                            if not depth_exceeded:
                                depth_exceeded = True
                                exceeded_path = ' -> '.join(path)
                            return
                        if node in visited:
                            return
                        visited.add(node)
                        for child in templates.get(node, []):
                            dfs(child, depth + 1, path + [child])

                    dfs(start, 1, [start])
                    print(f'Unique instantiations: {len(visited)}')
                    if depth_exceeded:
                        print('DEPTH_EXCEEDED')
                        print(exceeded_path)
                    else:
                        print('DEPTH_OK')
                        print('N/A')

                solve()
            test_cases:
              - name: basic-no-overflow
                stdin: "4 3\nFactorial 1 Factorial\nMyPair 2 Vector Map\nVector 1 BASE\nMap 1 BASE\nMyPair\n"
                expected_stdout: "Unique instantiations: 3\nDEPTH_OK\nN/A"
                is_hidden: false
                weight: 1
              - name: depth-exceeded
                stdin: "3 2\nA 1 B\nB 1 C\nC 1 BASE\nA\n"
                expected_stdout: "Unique instantiations: 2\nDEPTH_EXCEEDED\nA -> B -> C"
                is_hidden: false
                weight: 1
              - name: leaf-only
                stdin: "1 5\nLeaf 0\nLeaf\n"
                expected_stdout: "Unique instantiations: 1\nDEPTH_OK\nN/A"
                is_hidden: true
                weight: 1
              - name: shared-dependencies
                stdin: "4 5\nRoot 2 Left Right\nLeft 1 Shared\nRight 1 Shared\nShared 1 BASE\nRoot\n"
                expected_stdout: "Unique instantiations: 4\nDEPTH_OK\nN/A"
                is_hidden: true
                weight: 1
