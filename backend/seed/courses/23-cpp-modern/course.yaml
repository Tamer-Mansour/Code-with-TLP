                expected_stdout: "1\n7\n2"
                is_hidden: true
                weight: 1
              - name: max-fold
                stdin: "2\nLEFT_FOLD MAX 3 1 4 1 5 9 2 6\nRIGHT_FOLD MAX 3 1 4 1 5 9 2 6\n"
                expected_stdout: "9\n9"
                is_hidden: true
                weight: 1
