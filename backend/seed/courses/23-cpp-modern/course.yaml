      - slug: cpp-raii-tracker-lesson
        title: "Exercise: RAII Resource Tracker Simulation"
        type: exercise
        duration_minutes: 25
        content_file: lessons/cpp-raii-tracker-exercise.md
        exercises:
          - slug: cpp-raii-tracker
            title: RAII Resource Tracker Simulation
            difficulty: medium
            points: 25
            prompt_file: lessons/cpp-raii-tracker.prompt.md
            supported_languages: [python]
            tags: [raii, smart-pointers, resource-management]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                def solve():
                    n = int(input())
                    current_scope = []
                    released = set()
                    for _ in range(n):
                        line = input().split()
                        op = line[0]
                        # implement RAII behavior
                        pass
                solve()
            solution_code:
              python: |
                def solve():
                    n = int(input())
                    scope_stack = [[]]
                    released = set()

                    for _ in range(n):
                        line = input().split()
                        op = line[0]
                        if op == 'ACQUIRE':
                            name = line[1]
                            scope_stack[-1].append(name)
                            if name in released:
                                released.discard(name)
                        elif op == 'RELEASE':
                            name = line[1]
                            if name in released:
                                print(f'ERROR: {name} already released')
                            else:
                                for scope in scope_stack:
                                    if name in scope:
                                        scope.remove(name)
                                        break
                                released.add(name)
                                print(f'MANUAL-RELEASE: {name}')
                        elif op == 'SCOPE_END':
                            if scope_stack:
                                current_scope = scope_stack[-1]
                                for name in reversed(current_scope):
                                    if name not in released:
                                        released.add(name)
                                        print(f'AUTO-RELEASE: {name}')
                                scope_stack[-1] = []
                                if len(scope_stack) > 1:
                                    scope_stack.pop()

                solve()
            test_cases:
              - name: basic-scope-end
                stdin: "8\nACQUIRE fileA\nACQUIRE dbConn\nACQUIRE mutex\nSCOPE_END\nACQUIRE socket\nRELEASE socket\nRELEASE socket\nSCOPE_END\n"
                expected_stdout: "AUTO-RELEASE: mutex\nAUTO-RELEASE: dbConn\nAUTO-RELEASE: fileA\nMANUAL-RELEASE: socket\nERROR: socket already released"
                is_hidden: false
                weight: 1
              - name: all-manual-release
                stdin: "5\nACQUIRE lock\nACQUIRE conn\nRELEASE conn\nRELEASE lock\nSCOPE_END\n"
                expected_stdout: "MANUAL-RELEASE: conn\nMANUAL-RELEASE: lock"
                is_hidden: false
                weight: 1
              - name: reverse-order
                stdin: "4\nACQUIRE a\nACQUIRE b\nACQUIRE c\nSCOPE_END\n"
                expected_stdout: "AUTO-RELEASE: c\nAUTO-RELEASE: b\nAUTO-RELEASE: a"
                is_hidden: true
                weight: 1
              - name: double-release-error
                stdin: "4\nACQUIRE res1\nRELEASE res1\nRELEASE res1\nSCOPE_END\n"
                expected_stdout: "MANUAL-RELEASE: res1\nERROR: res1 already released"
                is_hidden: true
                weight: 1
              - name: mixed-manual-and-auto
                stdin: "6\nACQUIRE x\nACQUIRE y\nACQUIRE z\nRELEASE y\nSCOPE_END\nSCOPE_END\n"
                expected_stdout: "MANUAL-RELEASE: y\nAUTO-RELEASE: z\nAUTO-RELEASE: x"
                is_hidden: true
                weight: 1
      - slug: cpp-shared-ptr-sim-lesson
