        exercises:
          - slug: cpp-sum-avg
            title: Sum and Average (Vector Simulation)
            difficulty: easy
            points: 10
            prompt_file: lessons/cpp-sum-avg.prompt.md
            supported_languages: [python]
            tags: [stl, math]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().split()
                    if not data:
                        print("0 0")
                        return
                    n = int(data[0])
                    nums = [int(x) for x in data[1:1+n]]
                    if n == 0:
                        print("0 0")
                        return
                    s = sum(nums)
                    avg = s / n
                    if abs(avg - int(avg)) < 1e-9:
                        print(f"{s} {int(avg)}")
                    else:
                        print(f"{s} {avg:.2f}")

                solve()
            test_cases:
              - name: integer-avg
                stdin: "4\n2 4 6 8\n"
                expected_stdout: "20 5"
                is_hidden: false
                weight: 1
              - name: decimal-avg
                stdin: "3\n1 2 4\n"
                expected_stdout: "7 2.33"
                is_hidden: false
                weight: 1
              - name: zero-elements
                stdin: "0\n"
                expected_stdout: "0 0"
                is_hidden: true
                weight: 1
              - name: negatives
                stdin: "4\n-5 -5 5 5\n"
                expected_stdout: "0 0"
                is_hidden: true
                weight: 1
      - slug: stl-quiz
        title: "Quiz: STL Containers, Algorithms, and Iterators"
        type: quiz
        duration_minutes: 8
        content_file: lessons/stl-quiz.md

