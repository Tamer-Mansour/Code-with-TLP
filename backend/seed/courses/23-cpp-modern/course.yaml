            solution_code:
              python: |
                from functools import lru_cache

                @lru_cache(maxsize=None)
                def fib(n):
                    if n == 0:
                        return 0
                    if n == 1:
                        return 1
                    return fib(n-1) + fib(n-2)

                def solve():
                    m = int(input())
                    for _ in range(m):
                        parts = input().split()
                        op = parts[0]
                        n = int(parts[1])
                        result = fib(n)
                        if op == 'CONSTEXPR_CONTEXT':
                            print(f'COMPILE-TIME: fib({n})={result}')
                        elif op == 'RUNTIME_CONTEXT':
                            print(f'RUNTIME: fib({n})={result}')
                        elif op == 'IS_CONSTEXPR':
                            print('YES' if n >= 0 else 'NO')

                solve()
            test_cases:
              - name: basic-contexts
                stdin: "5\nCONSTEXPR_CONTEXT 10\nRUNTIME_CONTEXT 10\nIS_CONSTEXPR 15\nCONSTEXPR_CONTEXT 0\nRUNTIME_CONTEXT 7\n"
                expected_stdout: "COMPILE-TIME: fib(10)=55\nRUNTIME: fib(10)=55\nYES\nCOMPILE-TIME: fib(0)=0\nRUNTIME: fib(7)=13"
