        type: exercise
        duration_minutes: 25
        content_file: lessons/cpp-shared-ptr-sim-exercise.md
        exercises:
          - slug: cpp-shared-ptr-sim
            title: Smart Pointer Reference Count Simulator
            difficulty: medium
            points: 25
            prompt_file: lessons/cpp-shared-ptr-sim.prompt.md
            supported_languages: [python]
            tags: [smart-pointers, shared-ptr, reference-counting]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                def solve():
                    n = int(input())
                    ptr_to_obj = {}
                    ref_counts = {}
                    obj_counter = 0
                    for _ in range(n):
                        parts = input().split()
                        op = parts[0]
                        # implement shared_ptr semantics
                        pass
                solve()
            solution_code:
              python: |
                def solve():
                    n = int(input())
                    ptr_to_obj = {}
                    ref_counts = {}
                    obj_counter = 0

                    def decrement(obj_id):
                        if obj_id is None:
                            return
                        ref_counts[obj_id] -= 1
                        if ref_counts[obj_id] == 0:
                            print(f'Object-{obj_id} destroyed')
                        else:
                            print(f'rc[Object-{obj_id}]={ref_counts[obj_id]}')

                    for _ in range(n):
                        parts = input().split()
                        op = parts[0]
                        if op == 'MAKE':
                            name = parts[1]
                            obj_counter += 1
                            oid = obj_counter
                            ref_counts[oid] = 1
                            ptr_to_obj[name] = oid
                            print(f'Object-{oid} created [rc=1]')
                        elif op == 'COPY':
                            dst, src = parts[1], parts[2]
                            src_obj = ptr_to_obj.get(src)
                            old_obj = ptr_to_obj.get(dst)
                            if old_obj is not None:
                                decrement(old_obj)
                            ptr_to_obj[dst] = src_obj
                            if src_obj is not None:
                                ref_counts[src_obj] += 1
                                print(f'rc[Object-{src_obj}]={ref_counts[src_obj]}')
                        elif op == 'RESET':
                            name = parts[1]
                            obj_id = ptr_to_obj.get(name)
                            ptr_to_obj[name] = None
                            decrement(obj_id)
                        elif op == 'MOVE':
                            dst, src = parts[1], parts[2]
                            old_obj = ptr_to_obj.get(dst)
                            if old_obj is not None:
                                decrement(old_obj)
                            src_obj = ptr_to_obj.get(src)
                            ptr_to_obj[dst] = src_obj
                            ptr_to_obj[src] = None
                            if src_obj is not None:
                                print(f'rc[Object-{src_obj}]={ref_counts[src_obj]}')

                solve()
            test_cases:
              - name: basic-lifecycle
                stdin: "7\nMAKE p1\nMAKE p2\nCOPY p3 p1\nRESET p1\nCOPY p4 p3\nRESET p3\nRESET p4\n"
                expected_stdout: "Object-1 created [rc=1]\nObject-2 created [rc=1]\nrc[Object-1]=2\nrc[Object-1]=1\nrc[Object-1]=2\nrc[Object-1]=1\nObject-1 destroyed"
                is_hidden: false
                weight: 1
              - name: move-semantics
                stdin: "4\nMAKE a\nCOPY b a\nMOVE c a\nRESET b\n"
                expected_stdout: "Object-1 created [rc=1]\nrc[Object-1]=2\nrc[Object-1]=2\nrc[Object-1]=1"
                is_hidden: false
                weight: 1
              - name: single-owner-destroy
                stdin: "2\nMAKE x\nRESET x\n"
                expected_stdout: "Object-1 created [rc=1]\nObject-1 destroyed"
                is_hidden: true
                weight: 1
              - name: multiple-objects
                stdin: "6\nMAKE p1\nMAKE p2\nCOPY p3 p2\nRESET p2\nRESET p1\nRESET p3\n"
                expected_stdout: "Object-1 created [rc=1]\nObject-2 created [rc=1]\nrc[Object-2]=2\nrc[Object-2]=1\nObject-1 destroyed\nObject-2 destroyed"
                is_hidden: true
                weight: 1
