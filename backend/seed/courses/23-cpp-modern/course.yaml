            prompt_file: lessons/cpp-enum-classify.prompt.md
            supported_languages: [python]
            tags: [types, initialization, auto]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                def solve():
                    n = int(input())
                    for _ in range(n):
                        line = input()
                        # parse and classify
                        pass
                solve()
            solution_code:
              python: |
                def classify_type(t):
                    if t == 'int':
                        return 'integral'
                    elif t in ('double', 'float'):
                        return 'floating'
                    elif t == 'bool':
                        return 'bool'
                    elif t == 'string':
                        return 'string'
                    else:
                        return 'auto'

                def solve():
                    n = int(input())
                    for _ in range(n):
                        line = input().strip()
                        # format: TYPE NAME = VALUE  or  TYPE NAME{VALUE}
                        if '{' in line:
                            init_style = 'uniform'
                            parts = line.split()
                            type_str = parts[0]
                            name = parts[1].split('{')[0]
                        else:
                            init_style = 'classic'
                            parts = line.split()
                            type_str = parts[0]
                            name = parts[1]
                        type_class = classify_type(type_str)
                        print(f'{name}: {type_class} {init_style}')

                solve()
            test_cases:
              - name: basic-mixed
                stdin: "5\nint x = 42\ndouble pi{3.14}\nbool flag = true\nstring name{hello}\nauto count = 10\n"
                expected_stdout: "x: integral classic\npi: floating uniform\nflag: bool classic\nname: string uniform\ncount: auto classic"
                is_hidden: false
                weight: 1
              - name: all-uniform
                stdin: "3\nint a{1}\nfloat b{2.5}\nstring s{world}\n"
                expected_stdout: "a: integral uniform\nb: floating uniform\ns: string uniform"
                is_hidden: false
