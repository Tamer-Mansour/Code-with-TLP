            starter_code:
              python: |
                from functools import reduce

                def solve():
                    n = int(input())
                    for _ in range(n):
                        parts = input().split()
                        cmd = parts[0]
                        # implement fold operations
                        pass
                solve()
            solution_code:
              python: |
                from functools import reduce

                def do_op(a, b, op):
                    if op == '+':
                        return a + b
                    elif op == '-':
                        return a - b
                    elif op == '*':
                        return a * b
                    elif op == 'MAX':
                        return max(a, b)

                def foldr(f, lst):
                    if len(lst) == 1:
                        return lst[0]
                    return f(lst[0], foldr(f, lst[1:]))

                def solve():
                    n = int(input())
                    for _ in range(n):
                        parts = input().split()
                        cmd = parts[0]
                        if cmd == 'SIZEOF_PACK':
                            values = parts[1:]
                            print(len(values))
                        elif cmd in ('LEFT_FOLD', 'UNARY_FOLD'):
                            op = parts[1]
                            values = list(map(int, parts[2:]))
                            result = reduce(lambda a, b: do_op(a, b, op), values)
                            print(result)
                        elif cmd == 'RIGHT_FOLD':
                            op = parts[1]
                            values = list(map(int, parts[2:]))
                            result = foldr(lambda a, b: do_op(a, b, op), values)
                            print(result)

                solve()
            test_cases:
              - name: all-operations
                stdin: "6\nLEFT_FOLD + 1 2 3 4\nRIGHT_FOLD - 10 3 2 1\nLEFT_FOLD * 2 3 4\nLEFT_FOLD MAX 5 2 9 1 7\nSIZEOF_PACK 10 20 30 40 50\nRIGHT_FOLD + 1 2 3 4 5\n"
                expected_stdout: "10\n8\n24\n9\n5\n15"
                is_hidden: false
                weight: 1
              - name: right-fold-subtraction
                stdin: "3\nRIGHT_FOLD - 1 2 3\nLEFT_FOLD - 1 2 3\nRIGHT_FOLD - 5 4 3 2\n"
