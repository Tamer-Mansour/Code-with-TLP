      - slug: cpp-move-exercise
        title: "Exercise: String Pool Move/Copy Simulator"
        type: exercise
        duration_minutes: 20
        content_file: lessons/cpp-move-exercise.md
        exercises:
          - slug: cpp-move-sim
            title: String Pool Move/Copy Simulator
            difficulty: easy
            points: 10
            prompt_file: lessons/cpp-move-sim.prompt.md
            supported_languages: [python]
            tags: [move-semantics, strings]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().splitlines()
                    n = int(data[0])
                    moves = 0
                    copies = 0
                    pool = []
                    for i in range(1, n + 1):
                        line = data[i]
                        if line.startswith("MOVE:"):
                            moves += 1
                            pool.append(line[5:])
                        elif line.startswith("COPY:"):
                            copies += 1
                            pool.append(line[5:])
                    print(f"moves={moves} copies={copies} pool={' '.join(pool)}")

                solve()
            test_cases:
              - name: basic-mixed
                stdin: "3\nMOVE:alpha\nCOPY:beta\nMOVE:gamma\n"
                expected_stdout: "moves=2 copies=1 pool=alpha beta gamma"
                is_hidden: false
                weight: 1
              - name: all-copies
                stdin: "2\nCOPY:hello\nCOPY:world\n"
                expected_stdout: "moves=0 copies=2 pool=hello world"
                is_hidden: false
                weight: 1
              - name: all-moves
                stdin: "4\nMOVE:a\nMOVE:b\nMOVE:c\nMOVE:d\n"
                expected_stdout: "moves=4 copies=0 pool=a b c d"
                is_hidden: true
                weight: 1
              - name: single-copy
                stdin: "1\nCOPY:only\n"
                expected_stdout: "moves=0 copies=1 pool=only"
                is_hidden: true
                weight: 1
      - slug: raii-quiz
        title: "Quiz: RAII, Smart Pointers, and Move Semantics"
        type: quiz
        duration_minutes: 8
        content_file: lessons/raii-quiz.md

