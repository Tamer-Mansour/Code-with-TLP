        title: TLB Simulation (Hit/Miss Counter)
        difficulty: medium
        points: 20
        prompt_file: lessons/os-tlb-simulation-exercise.prompt.md
        supported_languages: [python]
        tags: [memory, tlb, simulation, os]
        time_limit_ms: 3000
        memory_limit_mb: 256
        starter_code:
          python: |
            import sys
            from collections import OrderedDict

            def solve():
                data = sys.stdin.read().split()
                # TODO: simulate TLB with LRU eviction
                pass

            solve()
        solution_code:
          python: |
            import sys
            from collections import OrderedDict

            def solve():
                data = sys.stdin.read().split()
                idx = 0
                tlb_size = int(data[idx]); idx += 1
                n = int(data[idx]); idx += 1
                pages = [int(data[idx + i]) for i in range(n)]; idx += n
                tlb = OrderedDict()
                hits = 0
                misses = 0
                for page in pages:
                    if page in tlb:
                        tlb.move_to_end(page)
                        hits += 1
                    else:
                        misses += 1
                        if len(tlb) == tlb_size:
                            tlb.popitem(last=False)
                        tlb[page] = True
                print(f'TLB hits: {hits}')
                print(f'TLB misses: {misses}')

            solve()
        test_cases:
          - name: case-basic-hits-misses
            stdin: "3 6\n1 2 3 1 2 3\n"
