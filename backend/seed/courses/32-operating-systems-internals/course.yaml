  - slug: disk-scan-scheduler-exercise
    title: 'Exercise: SCAN Disk Scheduler'
    type: exercise
    duration_minutes: 30
    content_file: lessons/disk-scan-scheduling.md
    exercises:
      - slug: operating-disk-scan-scheduler
        title: 'Disk Scheduling: SCAN Algorithm'
        difficulty: medium
        points: 20
        prompt_file: lessons/os-disk-scan-scheduler-exercise.prompt.md
        supported_languages: [python]
        tags: [storage, disk-scheduling, scan, os]
        time_limit_ms: 3000
        memory_limit_mb: 256
        starter_code:
          python: |
            import sys

            def solve():
                lines = sys.stdin.read().strip().split('\n')
                parts = lines[0].split()
                head = int(parts[0])
                direction = parts[1]
                requests = list(map(int, lines[1].split()))
                # TODO: simulate SCAN disk scheduling
                print('Service order: ')
                print('Total head movement: 0')

            solve()
        solution_code:
          python: |
            import sys

            def solve():
                lines = sys.stdin.read().strip().split('\n')
                parts = lines[0].split()
                head = int(parts[0])
                direction = parts[1]
                requests = list(map(int, lines[1].split()))
                max_track = 199

                requests_sorted = sorted(requests)
                left  = [r for r in requests_sorted if r < head]
                right = [r for r in requests_sorted if r >= head]

                service_order = []
                movement = 0
                current = head

                if direction == 'up':
                    for r in right:
                        movement += r - current
                        current = r
                        service_order.append(r)
                    movement += max_track - current
                    current = max_track
                    for r in reversed(left):
                        movement += current - r
                        current = r
                        service_order.append(r)
                else:
                    for r in reversed(left):
                        movement += current - r
                        current = r
                        service_order.append(r)
                    movement += current - 0
                    current = 0
                    for r in right:
                        movement += r - current
                        current = r
                        service_order.append(r)

                print('Service order: ' + ' '.join(map(str, service_order)))
                print(f'Total head movement: {movement}')

            solve()
        test_cases:
          - name: case-head-53-up
            stdin: "53 up\n98 183 37 122 14 124 65 67\n"
            expected_stdout: "Service order: 65 67 98 122 124 183 37 14\nTotal head movement: 331"
            is_hidden: false
            weight: 1
          - name: case-head-50-down
            stdin: "50 down\n176 79 34 60 92 11 41 114\n"
            expected_stdout: "Service order: 41 34 11 60 79 92 114 176\nTotal head movement: 226"
            is_hidden: false
            weight: 1
          - name: case-head-100-up-two-requests
            stdin: "100 up\n50 150\n"
            expected_stdout: "Service order: 150 50\nTotal head movement: 248"
            is_hidden: false
            weight: 1
          - name: case-head-0-up
            stdin: "0 up\n100 50 150\n"
            expected_stdout: "Service order: 50 100 150\nTotal head movement: 199"
            is_hidden: true
            weight: 1
          - name: case-head-199-down
            stdin: "199 down\n0 100 50\n"
            expected_stdout: "Service order: 100 50 0\nTotal head movement: 199"
            is_hidden: true
            weight: 1
          - name: case-head-75-down
            stdin: "75 down\n25 125 10 175\n"
            expected_stdout: "Service order: 25 10 125 175\nTotal head movement: 250"
            is_hidden: true
            weight: 1
