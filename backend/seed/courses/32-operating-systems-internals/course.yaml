                data = sys.stdin.read().split()
                idx = 0
                n = int(data[idx]); idx += 1
                m = int(data[idx]); idx += 1
                available = [int(data[idx + j]) for j in range(m)]; idx += m
                allocation = []
                for i in range(n):
                    row = [int(data[idx + j]) for j in range(m)]; idx += m
                    allocation.append(row)
                maximum = []
                for i in range(n):
                    row = [int(data[idx + j]) for j in range(m)]; idx += m
                    maximum.append(row)

                need = [[maximum[i][j] - allocation[i][j] for j in range(m)] for i in range(n)]
                work = available[:]
                finish = [False] * n
                safe_seq = []

                while len(safe_seq) < n:
                    found = False
                    for i in range(n):
                        if not finish[i] and all(need[i][j] <= work[j] for j in range(m)):
                            for j in range(m):
                                work[j] += allocation[i][j]
                            finish[i] = True
                            safe_seq.append(i)
                            found = True
                            break
                    if not found:
                        break

                if len(safe_seq) == n:
                    print('SAFE')
                    print('Safe sequence: ' + ' '.join(f'P{i}' for i in safe_seq))
                else:
