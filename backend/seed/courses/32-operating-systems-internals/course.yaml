  summary: >-
    A deep-dive into how operating systems work — processes, scheduling, memory management,
    file systems, I/O, synchronization, and virtualization — with coding exercises on every topic.
  description: >-
    Master the internals of modern operating systems through rigorous theory and hands-on exercises.
    Covers process lifecycle and the process API, all major CPU scheduling algorithms, concurrency
    and synchronization (mutexes, semaphores, condition variables, classical problems), memory
    management (paging, TLBs, virtual memory, page replacement), file systems and storage,
    I/O systems and device drivers, and virtualization and security. Exercises simulate real
    OS algorithms in Python including FIFO/LRU page replacement, Round Robin scheduling,
    the Banker's Algorithm, SCAN disk scheduling, and more.
