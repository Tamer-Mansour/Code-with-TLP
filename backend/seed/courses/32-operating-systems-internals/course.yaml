        starter_code:
          python: |
            import sys

            def solve():
                data = sys.stdin.read().split()
                # TODO: decode MMIO register fields
                pass

            solve()
        solution_code:
          python: |
            import sys

            def solve():
                data = sys.stdin.read().split()
                idx = 0
                value = int(data[idx], 16); idx += 1
                n = int(data[idx]); idx += 1
                for _ in range(n):
                    name = data[idx]; idx += 1
                    msb = int(data[idx]); idx += 1
                    lsb = int(data[idx]); idx += 1
                    mask = ((1 << (msb - lsb + 1)) - 1) << lsb
                    field_val = (value & mask) >> lsb
                    print(f'{name}={field_val}')

            solve()
        test_cases:
          - name: case-two-fields
            stdin: "0xA5 2\nSTATUS 7 4\nCONTROL 3 0\n"
            expected_stdout: "STATUS=10\nCONTROL=5"
            is_hidden: false
            weight: 1
          - name: case-single-bit
            stdin: "0x01 1\nENABLE 0 0\n"
            expected_stdout: "ENABLE=1"
            is_hidden: false
            weight: 1
          - name: case-full-byte
            stdin: "0xFF 1\nALL 7 0\n"
            expected_stdout: "ALL=255"
            is_hidden: true
            weight: 1
