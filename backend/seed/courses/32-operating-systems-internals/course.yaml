            solve()
        solution_code:
          python: |
            import sys

            def solve():
                data = sys.stdin.read().split()
                idx = 0
                block_size = int(data[idx]); idx += 1
                direct_count = int(data[idx]); idx += 1
                block_number = int(data[idx]); idx += 1
                ptrs_per_block = block_size // 4
                if block_number < direct_count:
                    print(f'direct block {block_number}')
                else:
                    n = block_number - direct_count
                    if n < ptrs_per_block:
                        print(f'single indirect, offset {n}')
                    else:
                        n -= ptrs_per_block
                        if n < ptrs_per_block * ptrs_per_block:
                            print(f'double indirect, outer {n // ptrs_per_block}, inner {n % ptrs_per_block}')
                        else:
                            print('triple indirect or beyond')

            solve()
        test_cases:
          - name: case-direct-block
