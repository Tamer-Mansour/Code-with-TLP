        solution_code:
          python: |
            import sys
            from collections import deque

            def solve():
                data = sys.stdin.read().split()
                idx = 0
                n = int(data[idx]); idx += 1
                quantum = int(data[idx]); idx += 1
                processes = []
                for i in range(n):
                    arrival = int(data[idx]); idx += 1
                    burst = int(data[idx]); idx += 1
                    processes.append([i + 1, arrival, burst, burst])
                sorted_p = sorted(processes, key=lambda x: (x[1], x[0]))
                time = 0
                queue = deque()
                added = set()
                finish = {}
                idx2 = 0
                while idx2 < n and sorted_p[idx2][1] <= time:
                    pid = sorted_p[idx2][0]
                    queue.append(pid)
                    added.add(pid)
                    idx2 += 1
                pid_to_proc = {p[0]: p for p in processes}
                while len(finish) < n:
                    if not queue:
                        if idx2 < n:
                            time = sorted_p[idx2][1]
                            while idx2 < n and sorted_p[idx2][1] <= time:
                                pid = sorted_p[idx2][0]
                                if pid not in added:
                                    queue.append(pid)
                                    added.add(pid)
                                idx2 += 1
                        continue
                    pid = queue.popleft()
                    proc = pid_to_proc[pid]
                    run = min(quantum, proc[3])
                    time += run
                    proc[3] -= run
                    while idx2 < n and sorted_p[idx2][1] <= time:
                        apid = sorted_p[idx2][0]
                        if apid not in added:
                            queue.append(apid)
                            added.add(apid)
                        idx2 += 1
                    if proc[3] > 0:
                        queue.append(pid)
                    else:
                        finish[pid] = time
                total_wt = 0
                total_tat = 0
                for p in processes:
                    pid, arrival, burst, _ = p
                    ct = finish[pid]
                    tat = ct - arrival
                    wt = tat - burst
                    total_tat += tat
                    total_wt += wt
                    print(f'P{pid} CT={ct} TAT={tat} WT={wt}')
                print(f'Average WT={total_wt/n:.2f} Average TAT={total_tat/n:.2f}')

            solve()
        test_cases:
          - name: case-three-same-arrival
            stdin: "3 4\n0 10\n0 4\n0 6\n"
            expected_stdout: "P1 CT=20 TAT=20 WT=10\nP2 CT=8 TAT=8 WT=4\nP3 CT=18 TAT=18 WT=12\nAverage WT=8.67 Average TAT=15.33"
            is_hidden: false
