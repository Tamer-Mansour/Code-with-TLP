        solution_code:
          python: |
            import sys

            def solve():
                lines = [l.strip() for l in sys.stdin.read().strip().split('\n') if l.strip()]
                state = 'NEW'
                transitions = {
                    'NEW': {'admit': 'READY'},
                    'READY': {'dispatch': 'RUNNING'},
                    'RUNNING': {'interrupt': 'READY', 'io_wait': 'WAITING', 'exit': 'TERMINATED'},
                    'WAITING': {'io_complete': 'READY'},
                }
                for event in lines:
                    if state in transitions and event in transitions[state]:
                        state = transitions[state][event]
                    else:
                        print(f'INVALID: {event} in {state}')
                        return
                print(state)

            solve()
        test_cases:
          - name: case-new-to-ready
            stdin: "admit\n"
            expected_stdout: "READY"
            is_hidden: false
            weight: 1
          - name: case-full-run-to-terminated
            stdin: "admit\ndispatch\nexit\n"
            expected_stdout: "TERMINATED"
            is_hidden: false
