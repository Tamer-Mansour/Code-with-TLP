          python: |
            import sys

            def solve():
                lines = [l.strip() for l in sys.stdin.read().strip().split('\n') if l.strip()]
                in_cs = set()
                for line in lines:
                    parts = line.split()
                    if len(parts) < 2:
                        continue
                    thread, event = parts[0], parts[1]
                    if event == 'ENTER':
                        in_cs.add(thread)
                        if len(in_cs) > 1:
                            print('VIOLATION')
                            return
                    elif event == 'EXIT':
                        in_cs.discard(thread)
                print('OK')

            solve()
