        solution_code:
          python: |
            import sys
            import heapq

            def solve():
                data = sys.stdin.read().split()
                idx = 0
                n = int(data[idx]); idx += 1
                processes = []
                for i in range(n):
                    arrival = int(data[idx]); idx += 1
                    burst = int(data[idx]); idx += 1
                    processes.append([arrival, burst, i + 1])
                processes.sort(key=lambda x: (x[0], x[2]))
                time = 0
                done = 0
                total_tat = 0
                total_wt = 0
                heap = []
                idx2 = 0
                while done < n:
                    while idx2 < n and processes[idx2][0] <= time:
                        heapq.heappush(heap, (processes[idx2][1], processes[idx2][2], processes[idx2][0]))
                        idx2 += 1
                    if not heap:
                        time = processes[idx2][0]
                        continue
                    burst, pid, arrival = heapq.heappop(heap)
                    ct = time + burst
                    tat = ct - arrival
                    wt = tat - burst
                    total_tat += tat
                    total_wt += wt
                    time = ct
                    done += 1
                print(f'{total_tat / n:.2f}')
                print(f'{total_wt / n:.2f}')

            solve()
        test_cases:
          - name: case-three-processes
            stdin: "3\n0 6\n0 3\n0 2\n"
            expected_stdout: "5.33\n1.33"
            is_hidden: false
            weight: 1
          - name: case-single
            stdin: "1\n0 5\n"
            expected_stdout: "5.00\n0.00"
            is_hidden: false
            weight: 1
          - name: case-staggered
            stdin: "3\n0 8\n2 4\n5 2\n"
            expected_stdout: "8.33\n3.67"
            is_hidden: true
