        solution_code:
          python: |
            import sys
            from collections import deque

            def solve():
                lines = sys.stdin.read().strip().split('\n')
                parts = lines[0].split()
                n, quantum = int(parts[0]), int(parts[1])
                processes = []
                for i in range(1, n + 1):
                    p = lines[i].split()
                    pid, arrival, burst = p[0], int(p[1]), int(p[2])
                    processes.append((pid, arrival, burst))

                pid_list = [p[0] for p in processes]
                arrival_map = {p[0]: p[1] for p in processes}
                burst_map = {p[0]: p[2] for p in processes}
                remaining = {p[0]: p[2] for p in processes}
                sorted_procs = sorted(processes, key=lambda x: (x[1], pid_list.index(x[0])))

                time = 0
                queue = deque()
                added = set()
                idx = 0
                finish = {}

                while idx < n and sorted_procs[idx][1] <= time:
                    pid = sorted_procs[idx][0]
                    queue.append(pid)
                    added.add(pid)
                    idx += 1

                while len(finish) < n:
                    if not queue:
                        if idx < n:
                            time = sorted_procs[idx][1]
                            while idx < n and sorted_procs[idx][1] <= time:
                                pid = sorted_procs[idx][0]
                                if pid not in added:
                                    queue.append(pid)
                                    added.add(pid)
                                idx += 1
                        continue
                    pid = queue.popleft()
                    run = min(quantum, remaining[pid])
                    time += run
                    remaining[pid] -= run
                    while idx < n and sorted_procs[idx][1] <= time:
                        apid = sorted_procs[idx][0]
                        if apid not in added:
                            queue.append(apid)
                            added.add(apid)
                        idx += 1
                    if remaining[pid] > 0:
                        queue.append(pid)
                    else:
                        finish[pid] = time

                tat_list = [finish[p[0]] - arrival_map[p[0]] for p in processes]
                wt_list = [tat_list[i] - burst_map[processes[i][0]] for i in range(n)]
                avg_tat = sum(tat_list) / n
                avg_wt = sum(wt_list) / n
                print(f'Average Turnaround Time: {avg_tat:.2f}')
                print(f'Average Waiting Time: {avg_wt:.2f}')

            solve()
        test_cases:
          - name: case-four-processes-q2
            stdin: "4 2\nP1 0 5\nP2 1 3\nP3 2 8\nP4 3 6\n"
            expected_stdout: "Average Turnaround Time: 15.25\nAverage Waiting Time: 9.75"
