                    burst = int(data[idx]); idx += 1
                    priority = int(data[idx]); idx += 1
                    processes.append((arrival, burst, priority, i + 1))
                sorted_p = sorted(processes, key=lambda x: (x[0], x[3]))
                time = 0
                done = 0
                total_tat = 0
                total_wt = 0
                heap = []
                idx2 = 0
                while done < n:
                    while idx2 < n and sorted_p[idx2][0] <= time:
                        arr, bst, pri, pid = sorted_p[idx2]
                        heapq.heappush(heap, (pri, pid, arr, bst))
                        idx2 += 1
                    if not heap:
                        time = sorted_p[idx2][0]
                        continue
                    pri, pid, arrival, burst = heapq.heappop(heap)
                    ct = time + burst
                    tat = ct - arrival
                    wt = tat - burst
                    total_tat += tat
                    total_wt += wt
                    time = ct
                    done += 1
                print(f'{total_tat / n:.2f}')
                print(f'{total_wt / n:.2f}')

            solve()
