        exercises:
          - slug: javascript-type-coercion-oracle
            title: "Type Coercion Oracle"
            difficulty: easy
            points: 20
            prompt_file: lessons/javascript-type-coercion-oracle.prompt.md
            supported_languages: [python]
            tags: [types, coercion, equality]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    pass

                solve()
            solution_code:
              python: |
                import sys

                def js_typeof(val):
                    mapping = {
                        'null': 'object',
                        'undefined': 'undefined',
                        'NaN': 'number',
                        '42': 'number',
                        'hello': 'string',
                        'true': 'boolean',
                        'false': 'boolean',
                        '[]': 'object',
                        '{}': 'object',
                    }
                    return mapping.get(val, 'unknown')

                def js_loose_eq(a, b):
                    pair = frozenset([a, b])
                    if pair == frozenset(['null', 'undefined']):
                        return True
                    if 'NaN' in pair:
                        return False
                    if pair.issubset({'0', 'false', "''"}):
                        return True
                    return a == b

                def js_strict_eq(a, b):
                    if 'NaN' in [a, b]:
                        return False
                    return a == b

                def solve():
                    data = sys.stdin.read().split('\n')
                    n = int(data[0])
                    for i in range(1, n + 1):
                        expr = data[i].strip()
                        if expr.startswith('typeof '):
                            val = expr[7:].strip()
                            print(js_typeof(val))
                        elif ' === ' in expr:
                            parts = expr.split(' === ')
                            print(str(js_strict_eq(parts[0].strip(), parts[1].strip())).lower())
                        elif ' == ' in expr:
                            parts = expr.split(' == ')
                            print(str(js_loose_eq(parts[0].strip(), parts[1].strip())).lower())

                solve()
            test_cases:
              - name: typeof-quirks
                stdin: "6\ntypeof null\ntypeof NaN\nNaN == NaN\nnull == undefined\nnull === undefined\n0 == false\n"
                expected_stdout: "object\nnumber\nfalse\ntrue\nfalse\ntrue"
                is_hidden: false
                weight: 1
              - name: typeof-basics
                stdin: "4\ntypeof undefined\ntypeof []\nnull == 0\n0 == ''\n"
                expected_stdout: "undefined\nobject\nfalse\ntrue"
                is_hidden: false
                weight: 1
              - name: strict-vs-loose
                stdin: "3\nnull === undefined\n0 === false\nNaN === NaN\n"
                expected_stdout: "false\nfalse\nfalse"
                is_hidden: true
                weight: 1
              - name: typeof-primitives
                stdin: "4\ntypeof 42\ntypeof hello\ntypeof true\ntypeof false\n"
                expected_stdout: "number\nstring\nboolean\nboolean"
                is_hidden: true
                weight: 1

