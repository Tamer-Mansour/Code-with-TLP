        exercises:
          - slug: js-word-frequency
            title: Word Frequency Counter
            difficulty: easy
            points: 15
            prompt_file: lessons/js-word-frequency.prompt.md
            supported_languages: [python]
            tags: [strings, maps, sorting]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    line = sys.stdin.read().strip()
                    # TODO
                    pass

                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    line = sys.stdin.read().strip()
                    if not line:
                        return
                    words = line.split()
                    freq = {}
                    for w in words:
                        freq[w] = freq.get(w, 0) + 1
                    for word in sorted(freq):
                        print(f"{word} {freq[word]}")

                solve()
            test_cases:
              - name: basic
                stdin: "the cat sat on the mat the cat\n"
                expected_stdout: "cat 2\nmat 1\non 1\nsat 1\nthe 3"
                is_hidden: false
                weight: 1
              - name: single-word
                stdin: "hello\n"
                expected_stdout: "hello 1"
                is_hidden: false
                weight: 1
              - name: all-same
                stdin: "z z z\n"
                expected_stdout: "z 3"
                is_hidden: false
                weight: 1
              - name: two-words
                stdin: "a b a b a\n"
                expected_stdout: "a 3\nb 2"
                is_hidden: true
                weight: 1
              - name: longer
                stdin: "one two three one two one\n"
                expected_stdout: "one 3\nthree 1\ntwo 2"
                is_hidden: true
                weight: 1
