            supported_languages: [python]
            tags: [async, promises, event-loop]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    pass

                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().split('\n')
                    n = int(data[0])
                    sync_tasks = []
                    micro_tasks = []
                    macro_tasks = []
                    for i in range(1, n + 1):
                        parts = data[i].strip().split()
                        if len(parts) < 2:
                            continue
                        task_type, label = parts[0], parts[1]
                        if task_type == 'SYNC':
                            sync_tasks.append(label)
                        elif task_type == 'MICRO':
                            micro_tasks.append(label)
                        elif task_type == 'MACRO':
                            macro_tasks.append(label)
                    for label in sync_tasks:
                        print(label)
                    for label in micro_tasks:
                        print(label)
                    for label in macro_tasks:
                        print(label)

                solve()
            test_cases:
              - name: basic-mixed
                stdin: "5\nSYNC start\nMACRO timeout1\nMICRO promise1\nSYNC end\nMICRO promise2\n"
                expected_stdout: "start\nend\npromise1\npromise2\ntimeout1"
                is_hidden: false
                weight: 1
              - name: sync-first
                stdin: "4\nMACRO timer\nSYNC alpha\nMICRO beta\nSYNC gamma\n"
                expected_stdout: "alpha\ngamma\nbeta\ntimer"
                is_hidden: false
                weight: 1
              - name: only-macro-and-micro
                stdin: "3\nMACRO only-macro\nMACRO second-macro\nMICRO first-micro\n"
                expected_stdout: "first-micro\nonly-macro\nsecond-macro"
                is_hidden: false
                weight: 1
              - name: only-sync
                stdin: "3\nSYNC a\nSYNC b\nSYNC c\n"
                expected_stdout: "a\nb\nc"
                is_hidden: true
                weight: 1
              - name: large-mixed
                stdin: "6\nSYNC s1\nMACRO m1\nMICRO u1\nMACRO m2\nSYNC s2\nMICRO u2\n"
                expected_stdout: "s1\ns2\nu1\nu2\nm1\nm2"
                is_hidden: true
