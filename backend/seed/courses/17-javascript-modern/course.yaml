            prompt_file: lessons/javascript-scope-simulator.prompt.md
            supported_languages: [python]
            tags: [scope, closures, var, let]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    pass

                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    input_data = sys.stdin.read().split('\n')
                    idx = 0
                    T = int(input_data[idx]); idx += 1
                    for _ in range(T):
                        parts = input_data[idx].split(); idx += 1
                        keyword, varname, value, context = parts[0], parts[1], int(parts[2]), parts[3]
                        if context == 'loop':
                            if keyword == 'var':
                                print('loop: ' + ' '.join([str(value)] * value))
                            else:
                                print('loop: ' + ' '.join(str(i) for i in range(value)))
                        else:
                            print(f'function: {value}')

                solve()
            test_cases:
              - name: basic-three-cases
                stdin: "3\nvar counter 3 loop\nlet counter 3 loop\nvar x 42 function\n"
                expected_stdout: "loop: 3 3 3\nloop: 0 1 2\nfunction: 42"
                is_hidden: false
                weight: 1
              - name: let-loop-five
                stdin: "2\nlet i 5 loop\nvar n 1 loop\n"
                expected_stdout: "loop: 0 1 2 3 4\nloop: 1"
                is_hidden: false
                weight: 1
              - name: function-context
                stdin: "2\nvar a 10 function\nlet b 7 function\n"
                expected_stdout: "function: 10\nfunction: 7"
                is_hidden: true
                weight: 1
              - name: var-loop-large
                stdin: "1\nvar z 5 loop\n"
                expected_stdout: "loop: 5 5 5 5 5"
                is_hidden: true
                weight: 1
              - name: single-let-loop
                stdin: "1\nlet k 1 loop\n"
                expected_stdout: "loop: 0"
                is_hidden: true
                weight: 1
      - slug: js-closure-counter-exercise
        title: "Closure Counter Factory"
        type: exercise
        duration_minutes: 25
        content_file: lessons/javascript-closure-counter-exercise.md
        exercises:
          - slug: javascript-closure-counter-factory
            title: "Closure Counter Factory"
            difficulty: medium
            points: 25
            prompt_file: lessons/javascript-closure-counter-factory.prompt.md
            supported_languages: [python]
            tags: [closures, higher-order-functions, state]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    pass

                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().split('\n')
                    counters = {}
                    for line in data:
                        parts = line.strip().split()
                        if not parts:
                            continue
                        cmd = parts[0]
                        if cmd == 'CREATE':
                            name = parts[1]
                            start = int(parts[2])
                            counters[name] = [start, start]
                        elif cmd == 'INC':
                            name = parts[1]
                            counters[name][0] += 1
                        elif cmd == 'DEC':
                            name = parts[1]
                            counters[name][0] -= 1
                        elif cmd == 'GET':
                            name = parts[1]
                            print(counters[name][0])
                        elif cmd == 'RESET':
                            name = parts[1]
                            counters[name][0] = counters[name][1]

                solve()
            test_cases:
              - name: basic-inc-dec-get
                stdin: "8\nCREATE a 0\nINC a\nINC a\nGET a\nDEC a\nGET a\nCREATE b 10\nGET b\n"
                expected_stdout: "2\n1\n10"
                is_hidden: false
                weight: 1
              - name: reset
                stdin: "6\nCREATE x 5\nDEC x\nDEC x\nGET x\nRESET x\nGET x\n"
                expected_stdout: "3\n5"
                is_hidden: false
                weight: 1
              - name: triple-inc
                stdin: "5\nCREATE c 100\nINC c\nINC c\nINC c\nGET c\n"
                expected_stdout: "103"
                is_hidden: false
                weight: 1
              - name: negative-start
                stdin: "4\nCREATE n -5\nINC n\nINC n\nGET n\n"
                expected_stdout: "-3"
                is_hidden: true
                weight: 1
              - name: independent-counters
                stdin: "6\nCREATE p 0\nCREATE q 0\nINC p\nINC p\nINC q\nGET p\n"
                expected_stdout: "2"
                is_hidden: true
                weight: 1
