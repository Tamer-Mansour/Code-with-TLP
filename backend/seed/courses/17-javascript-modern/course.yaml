            starter_code:
              python: |
                import sys

                def solve():
                    line = sys.stdin.read().strip()
                    # TODO
                    pass

                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    line = sys.stdin.read().strip()
                    if not line:
                        return
                    words = line.split()
                    freq = {}
                    for w in words:
                        freq[w] = freq.get(w, 0) + 1
                    for word in sorted(freq):
                        print(f"{word} {freq[word]}")

                solve()
            test_cases:
              - name: basic
                stdin: "the cat sat on the mat the cat\n"
                expected_stdout: "cat 2\nmat 1\non 1\nsat 1\nthe 3"
                is_hidden: false
