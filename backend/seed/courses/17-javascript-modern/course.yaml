            title: Sum Squares of Evens (Array Pipeline Simulation)
            difficulty: easy
            points: 15
            prompt_file: lessons/js-sum-squares-evens.prompt.md
            supported_languages: [python]
            tags: [arrays, pipelines]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    nums = [int(x) for x in sys.stdin.read().split()]
                    total = sum(x * x for x in nums if x % 2 == 0)
                    print(total)

                solve()
            test_cases:
              - name: basic
                stdin: "1 2 3 4 5 6\n"
                expected_stdout: "56"
                is_hidden: false
                weight: 1
              - name: no-evens
                stdin: "1 3 5 7\n"
                expected_stdout: "0"
                is_hidden: false
                weight: 1
              - name: with-negatives
                stdin: "-2 -1 0 1 2\n"
                expected_stdout: "8"
                is_hidden: true
                weight: 1
              - name: empty
                stdin: "\n"
                expected_stdout: "0"
                is_hidden: true
                weight: 1

