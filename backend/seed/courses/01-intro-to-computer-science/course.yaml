            tags: [strings, encoding, ascii, programs]
            time_limit_ms: 3000
            memory_limit_mb: 128
            starter_code:
              python: |
                k = int(input())
                message = input()
                # TODO: shift each letter by k positions, wrap around,
                # preserve case, leave non-letters unchanged
                pass
            solution_code:
              python: |
                k = int(input())
                message = input()
                result = []
                for c in message:
                    if c.isupper():
                        shifted = (ord(c) - ord('A') + k) % 26 + ord('A')
                        result.append(chr(shifted))
                    elif c.islower():
                        shifted = (ord(c) - ord('a') + k) % 26 + ord('a')
                        result.append(chr(shifted))
                    else:
                        result.append(c)
                print(''.join(result))
            test_cases:
