                    print(f'{word}: {freq[word]}')
            solution_code:
              python: |
                import sys

                freq = {}
                for line in sys.stdin:
                    for word in line.split():
                        cleaned = ''.join(c for c in word if c.isalnum()).lower()
                        if cleaned:
                            freq[cleaned] = freq.get(cleaned, 0) + 1

                for word in sorted(freq):
                    print(f'{word}: {freq[word]}')
            test_cases:
