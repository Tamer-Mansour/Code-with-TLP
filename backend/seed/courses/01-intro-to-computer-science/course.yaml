            prompt_file: lessons/intro-binary-search.prompt.md
            supported_languages: [python]
            tags: [algorithms, binary-search, complexity, searching]
            time_limit_ms: 3000
            memory_limit_mb: 128
            starter_code:
              python: |
                n = int(input())
                nums = list(map(int, input().split()))
                target = int(input())

                lo, hi = 0, n - 1
                result = -1
                # TODO: implement binary search
                print(result)
            solution_code:
              python: |
                n = int(input())
                nums = list(map(int, input().split()))
                target = int(input())

                lo, hi = 0, n - 1
                result = -1
                while lo <= hi:
                    mid = (lo + hi) // 2
                    if nums[mid] == target:
                        result = mid
                        break
                    elif nums[mid] < target:
                        lo = mid + 1
                    else:
                        hi = mid - 1

                print(result)
            test_cases:
              - name: "found-in-middle"
                stdin: "7\n2 5 8 12 16 23 38\n23"
                expected_stdout: "5"
