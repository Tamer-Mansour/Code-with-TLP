                        print('VALID' if is_valid_ipv4(line) else 'INVALID')
            solution_code:
              python: |
                import sys

                def is_valid_ipv4(s):
                    parts = s.split('.')
                    if len(parts) != 4:
                        return False
                    for part in parts:
                        if not part.isdigit():
                            return False
                        if len(part) > 1 and part[0] == '0':
                            return False
                        if not (0 <= int(part) <= 255):
                            return False
                    return True

                for line in sys.stdin:
                    line = line.strip()
                    if line:
                        print('VALID' if is_valid_ipv4(line) else 'INVALID')
            test_cases:
              - name: "valid-private-ip"
                stdin: "192.168.1.1\n"
