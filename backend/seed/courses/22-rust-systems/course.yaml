        exercises:
          - slug: rust-lifetime-checker
            title: Lifetime Region Checker
            difficulty: medium
            points: 25
            prompt_file: lessons/rust-lifetime-checker.prompt.md
            supported_languages: [python]
            tags: [lifetimes, references, borrow-checker]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def main():
                    pass

                main()
            solution_code:
              python: |
                import sys

                def main():
                    data = sys.stdin.read().split()
                    idx = 0
                    n = int(data[idx]); idx += 1
                    vars_lifetime = {}
                    for _ in range(n):
                        name = data[idx]; idx += 1
                        start = int(data[idx]); idx += 1
                        end = int(data[idx]); idx += 1
                        vars_lifetime[name] = (start, end)

                    m = int(data[idx]); idx += 1
                    for _ in range(m):
                        ref_name = data[idx]; idx += 1
                        idx += 1  # 'borrows' keyword
                        var_name = data[idx]; idx += 1
                        ref_start = int(data[idx]); idx += 1
                        ref_end = int(data[idx]); idx += 1

                        var_start, var_end = vars_lifetime[var_name]
                        if var_start <= ref_start and var_end >= ref_end:
                            print('VALID')
                        else:
                            print(f'DANGLING: {ref_name} outlives {var_name}')

                main()
            test_cases:
              - name: basic-mixed
                stdin: "3\nx 1 10\ny 3 7\nz 5 15\n4\nref1 borrows x 2 9\nref2 borrows y 4 8\nref3 borrows z 6 14\nref4 borrows y 3 7\n"
                expected_stdout: "VALID\nDANGLING: ref2 outlives y\nVALID\nVALID"
                is_hidden: false
                weight: 1
              - name: all-valid
                stdin: "2\na 1 20\nb 5 15\n3\nr1 borrows a 1 20\nr2 borrows a 5 15\nr3 borrows b 6 14\n"
                expected_stdout: "VALID\nVALID\nVALID"
                is_hidden: false
                weight: 1
              - name: all-dangling
                stdin: "2\np 3 6\nq 1 4\n2\nrp borrows p 3 8\nrq borrows q 2 5\n"
                expected_stdout: "DANGLING: rp outlives p\nDANGLING: rq outlives q"
                is_hidden: true
                weight: 1
              - name: exact-boundary
                stdin: "1\nv 5 10\n3\nra borrows v 5 10\nrb borrows v 4 10\nrc borrows v 5 11\n"
                expected_stdout: "VALID\nDANGLING: rb outlives v\nDANGLING: rc outlives v"
                is_hidden: true
                weight: 1
              - name: single-line-refs
                stdin: "1\nm 1 100\n3\nrf1 borrows m 1 1\nrf2 borrows m 50 50\nrf3 borrows m 100 100\n"
                expected_stdout: "VALID\nVALID\nVALID"
                is_hidden: true
                weight: 1

