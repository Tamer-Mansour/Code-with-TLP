            solution_code:
              python: |
                import sys

                def main():
                    type_info = {
                        'u8': (1,1), 'i8': (1,1),
                        'u16': (2,2), 'i16': (2,2),
                        'u32': (4,4), 'i32': (4,4),
                        'u64': (8,8), 'i64': (8,8),
                        'f32': (4,4), 'f64': (8,8),
                        'bool': (1,1), 'usize': (8,8)
                    }

                    lines = sys.stdin.read().splitlines()
                    n = int(lines[0].strip())
                    fields = []
                    for i in range(1, n + 1):
                        parts = lines[i].strip().split()
                        fname, ftype = parts[0], parts[1]
                        size, align = type_info[ftype]
                        fields.append((fname, size, align))

                    current_offset = 0
                    max_align = 1
                    offsets = []

                    for fname, size, align in fields:
                        if current_offset % align != 0:
                            current_offset += align - (current_offset % align)
                        offsets.append(current_offset)
                        current_offset += size
                        if align > max_align:
                            max_align = align

                    if current_offset % max_align != 0:
                        current_offset += max_align - (current_offset % max_align)

                    for i, (fname, size, align) in enumerate(fields):
                        print(f'{fname}: offset={offsets[i]}')
                    print(f'total_size={current_offset}')

                main()
            test_cases:
              - name: basic-struct
                stdin: "4\nflag bool\nvalue u32\ncount u64\nshort u16\n"
                expected_stdout: "flag: offset=0\nvalue: offset=4\ncount: offset=8\nshort: offset=16\ntotal_size=24"
                is_hidden: false
                weight: 1
              - name: all-same-alignment
                stdin: "3\nx u32\ny u32\nz u32\n"
                expected_stdout: "x: offset=0\ny: offset=4\nz: offset=8\ntotal_size=12"
                is_hidden: false
                weight: 1
              - name: mixed-alignment-padding
                stdin: "3\na u8\nb u64\nc u8\n"
                expected_stdout: "a: offset=0\nb: offset=8\nc: offset=16\ntotal_size=24"
                is_hidden: true
                weight: 1
              - name: smallest-types
                stdin: "4\nw bool\nx u8\ny i8\nz u8\n"
                expected_stdout: "w: offset=0\nx: offset=1\ny: offset=2\nz: offset=3\ntotal_size=4"
                is_hidden: true
                weight: 1
              - name: f64-alignment
                stdin: "3\nid u32\npad u8\nval f64\n"
                expected_stdout: "id: offset=0\npad: offset=4\nval: offset=8\ntotal_size=16"
                is_hidden: true
                weight: 1
              - name: usize-field
                stdin: "2\nptr usize\nlen u32\n"
                expected_stdout: "ptr: offset=0\nlen: offset=8\ntotal_size=16"
                is_hidden: true
                weight: 1

