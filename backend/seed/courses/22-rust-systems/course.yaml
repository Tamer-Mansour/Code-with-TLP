      - slug: iterators
        title: Iterators and Lazy Evaluation
        type: reading
        duration_minutes: 16
        content_file: lessons/iterators.md

      - slug: collections-quiz
        title: Quiz - Collections and Iterators
        type: quiz
        duration_minutes: 7
        content_file: lessons/collections-quiz.md

  - title: Closures and Functional Style
    summary: Closures, Fn traits, and functional programming patterns.
    order_index: 5
    lessons:
      - slug: closures
        title: Closures in Rust
        type: reading
        duration_minutes: 14
        content_file: lessons/closures.md

      - slug: word-frequency-exercise
        title: Word Frequency Counter
        type: exercise
        duration_minutes: 20
        content_file: lessons/word-frequency-exercise.md
        exercises:
          - slug: rust-word-freq
            title: Word Frequency Counter
            difficulty: medium
            points: 20
            prompt_file: lessons/rust-word-freq.prompt.md
            supported_languages: [python]
            tags: [hashmap, sorting, strings]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    line = sys.stdin.read()
                    words = line.split()
                    freq = {}
                    for w in words:
                        freq[w] = freq.get(w, 0) + 1
                    for word in sorted(freq):
                        print(f"{word} {freq[word]}")

                solve()
            test_cases:
              - name: basic
                stdin: "the quick brown fox jumps over the lazy dog the fox\n"
                expected_stdout: "brown 1\ndog 1\nfox 2\njumps 1\nlazy 1\nover 1\nquick 1\nthe 3"
                is_hidden: false
                weight: 1
              - name: single-repeated
                stdin: "hello hello hello\n"
                expected_stdout: "hello 3"
                is_hidden: false
                weight: 1
              - name: all-unique
                stdin: "a b c\n"
                expected_stdout: "a 1\nb 1\nc 1"
                is_hidden: true
                weight: 1
              - name: mixed-langs
                stdin: "rust rust rust go go python\n"
                expected_stdout: "go 2\npython 1\nrust 3"
                is_hidden: true
                weight: 1

  - title: Concurrency
