      - slug: parse-numbers-exercise
        title: Parse Sum
        type: exercise
        duration_minutes: 20
        content_file: lessons/parse-numbers-exercise.md
        exercises:
          - slug: rust-parse-sum
            title: Parse and Sum (Result-style Error Handling)
            difficulty: easy
            points: 15
            prompt_file: lessons/rust-parse-sum.prompt.md
            supported_languages: [python]
            tags: [parsing, errors]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    tokens = sys.stdin.read().split()
                    total = 0
                    for t in tokens:
                        try:
                            total += int(t)
                        except ValueError:
                            print(f"ERROR {t}")
                            return
                    print(total)

                solve()
            test_cases:
              - name: all-ints
                stdin: "1 2 3 4\n"
                expected_stdout: "10"
                is_hidden: false
                weight: 1
              - name: with-error
                stdin: "1 2 abc 4\n"
                expected_stdout: "ERROR abc"
                is_hidden: false
                weight: 1
              - name: negatives
                stdin: "-5 5 -10 10\n"
                expected_stdout: "0"
                is_hidden: true
                weight: 1
              - name: empty
                stdin: "\n"
                expected_stdout: "0"
                is_hidden: true
                weight: 1
