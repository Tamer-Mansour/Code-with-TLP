      - slug: concurrency-scheduler-exercise
        title: Concurrent Task Scheduler Simulator
        type: exercise
        duration_minutes: 25
        content_file: lessons/concurrency-scheduler-exercise.md
        exercises:
          - slug: rust-concurrency-scheduler
            title: Concurrent Task Scheduler Simulator
            difficulty: hard
            points: 30
            prompt_file: lessons/rust-concurrency-scheduler.prompt.md
            supported_languages: [python]
            tags: [concurrency, send, sync, threads]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def main():
                    pass

                main()
            solution_code:
              python: |
                import sys

                def main():
                    vars_props = {}

                    for line in sys.stdin:
                        line = line.strip()
                        if not line:
                            continue
                        parts = line.split()
                        cmd = parts[0]

                        if cmd == 'DECLARE':
                            var = parts[1]
                            prop = parts[3].upper()
                            is_send = 'SEND' in prop
                            is_sync = 'SYNC' in prop
                            vars_props[var] = {'send': is_send, 'sync': is_sync}

                        elif cmd == 'SPAWN_MOVE':
                            var = parts[2]
                            if var not in vars_props:
                                print(f'ERROR: {var} not declared')
                            elif not vars_props[var]['send']:
                                print(f'ERROR: {var} is not Send')
                            else:
                                print('OK')

                        elif cmd == 'SPAWN_SHARE':
                            var = parts[2]
                            if var not in vars_props:
                                print(f'ERROR: {var} not declared')
                            elif not vars_props[var]['sync']:
                                print(f'ERROR: {var} is not Sync')
                            else:
                                print('OK')

                main()
            test_cases:
              - name: basic-send-sync
                stdin: "DECLARE data ArcMutex SEND_SYNC\nDECLARE counter Rc NEITHER\nDECLARE msg String SEND_SYNC\nDECLARE raw RawPtr SEND\nSPAWN_MOVE t1 data\nSPAWN_MOVE t2 counter\nSPAWN_SHARE t3 msg\nSPAWN_SHARE t4 raw\n"
                expected_stdout: "OK\nERROR: counter is not Send\nOK\nERROR: raw is not Sync"
                is_hidden: false
                weight: 1
              - name: all-send-sync
                stdin: "DECLARE a TypeA SEND_SYNC\nDECLARE b TypeB SEND_SYNC\nSPAWN_MOVE t1 a\nSPAWN_SHARE t2 b\n"
                expected_stdout: "OK\nOK"
                is_hidden: false
                weight: 1
              - name: neither-fails-both
                stdin: "DECLARE x BadType NEITHER\nSPAWN_MOVE t1 x\nSPAWN_SHARE t2 x\n"
                expected_stdout: "ERROR: x is not Send\nERROR: x is not Sync"
                is_hidden: true
                weight: 1
              - name: send-only
                stdin: "DECLARE p PtrType SEND\nSPAWN_MOVE t1 p\nSPAWN_SHARE t2 p\n"
                expected_stdout: "OK\nERROR: p is not Sync"
                is_hidden: true
                weight: 1
              - name: sync-only
                stdin: "DECLARE s SharedRef SYNC\nSPAWN_MOVE t1 s\nSPAWN_SHARE t2 s\n"
                expected_stdout: "ERROR: s is not Send\nOK"
                is_hidden: true
                weight: 1

