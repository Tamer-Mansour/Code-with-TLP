        exercises:
          - slug: rust-ownership-trace
            title: Ownership Trace Simulator
            difficulty: medium
            points: 25
            prompt_file: lessons/rust-ownership-trace.prompt.md
            supported_languages: [python]
            tags: [ownership, borrowing, borrow-checker]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def main():
                    # Track ownership state and process each command
                    pass

                main()
            solution_code:
              python: |
                import sys

                def main():
                    owners = set(['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j'])
                    moved = set()
                    imm_borrows = {}
                    mut_borrowed = set()
                    borrow_of = {}
                    borrow_counter = [0]

                    lines = sys.stdin.read().splitlines()
                    for line in lines:
                        line = line.strip()
                        if not line:
                            continue
                        parts = line.split()
                        cmd = parts[0]

                        if cmd == 'MOVE':
                            x, y = parts[1], parts[2]
                            if x in moved:
                                print(f'ERROR: {x} has been moved')
                            elif x not in owners:
                                print(f'ERROR: {x} is not a valid owner')
                            else:
                                moved.add(x)
                                owners.discard(x)
                                owners.add(y)
                                imm_borrows.pop(x, None)
                                mut_borrowed.discard(x)
                                print('OK')

                        elif cmd == 'BORROW':
                            x = parts[1]
                            if x in moved:
                                print(f'ERROR: {x} has been moved')
                            elif x not in owners:
                                print(f'ERROR: {x} is not a valid owner')
                            elif x in mut_borrowed:
                                print(f'ERROR: cannot immutably borrow {x} while mutably borrowed')
                            else:
                                borrow_counter[0] += 1
                                bname = f'borrow{borrow_counter[0]}'
                                imm_borrows[x] = imm_borrows.get(x, 0) + 1
                                borrow_of[bname] = (x, 'imm')
                                print('OK')

                        elif cmd == 'MUTBORROW':
                            x = parts[1]
                            if x in moved:
                                print(f'ERROR: {x} has been moved')
                            elif x not in owners:
                                print(f'ERROR: {x} is not a valid owner')
                            elif x in mut_borrowed:
                                print(f'ERROR: cannot mutably borrow {x}: already mutably borrowed')
                            elif imm_borrows.get(x, 0) > 0:
                                print(f'ERROR: cannot mutably borrow {x} while immutable borrows exist')
                            else:
                                borrow_counter[0] += 1
                                bname = f'borrow{borrow_counter[0]}'
                                mut_borrowed.add(x)
                                borrow_of[bname] = (x, 'mut')
                                print('OK')

                        elif cmd == 'DROP':
                            x = parts[1]
                            if x in borrow_of:
                                var, kind = borrow_of.pop(x)
                                if kind == 'imm':
                                    imm_borrows[var] = imm_borrows.get(var, 1) - 1
                                    if imm_borrows[var] <= 0:
                                        del imm_borrows[var]
                                else:
                                    mut_borrowed.discard(var)
                                print('OK')
                            elif x in owners:
                                owners.discard(x)
                                moved.add(x)
                                print('OK')
                            else:
                                print(f'ERROR: {x} does not exist')

                        elif cmd == 'READ':
                            x = parts[1]
                            if x in moved:
                                print(f'ERROR: {x} has been moved')
                            elif x not in owners:
                                print(f'ERROR: {x} is not a valid owner')
                            else:
                                print('OK')

                main()
            test_cases:
              - name: basic-move-and-read
                stdin: "MOVE a b\nREAD b\nREAD a\nBORROW b\nBORROW b\nMUTBORROW b\nDROP borrow1\nDROP borrow2\nMUTBORROW b\nREAD b\n"
                expected_stdout: "OK\nOK\nERROR: a has been moved\nOK\nOK\nERROR: cannot mutably borrow b while immutable borrows exist\nOK\nOK\nOK\nOK"
                is_hidden: false
                weight: 1
              - name: mutable-borrow-exclusive
                stdin: "MUTBORROW c\nMUTBORROW c\nDROP borrow1\nMUTBORROW c\n"
                expected_stdout: "OK\nERROR: cannot mutably borrow c: already mutably borrowed\nOK\nOK"
                is_hidden: false
                weight: 1
              - name: move-chain
                stdin: "MOVE d e\nMOVE e f\nREAD f\nREAD e\nREAD d\n"
                expected_stdout: "OK\nOK\nOK\nERROR: e has been moved\nERROR: d has been moved"
                is_hidden: true
                weight: 1
              - name: borrow-then-mutborrow-blocked
                stdin: "BORROW g\nMUTBORROW g\nDROP borrow1\nMUTBORROW g\n"
                expected_stdout: "OK\nERROR: cannot mutably borrow g while immutable borrows exist\nOK\nOK"
                is_hidden: true
                weight: 1
              - name: drop-owner
                stdin: "READ h\nDROP h\nREAD h\n"
                expected_stdout: "OK\nOK\nERROR: h has been moved"
                is_hidden: true
                weight: 1

