  name: Programming Languages
  description: Master modern programming languages — from Python and JavaScript to Rust and Go.
  icon: code
  color: "#3b82f6"
  order_index: 6

course:
  slug: rust-systems
  title: Rust Systems Programming
  summary: Ownership, borrowing, lifetimes, traits, and idiomatic Rust.
  description: |
    Rust gives you C++-level performance with memory safety enforced at compile
    time. This course covers ownership and borrowing (the unique mental model),
    lifetimes, traits, generics, error handling with Result, and the cargo
    ecosystem you'll work with daily.
  difficulty: advanced
  estimated_hours: 24
  is_published: true
  order_index: 22

