      - slug: trait-dispatch-exercise
        title: Trait Dispatch Resolver
        type: exercise
        duration_minutes: 25
        content_file: lessons/trait-dispatch-exercise.md
        exercises:
          - slug: rust-trait-dispatch
            title: Trait Dispatch Resolver
            difficulty: medium
            points: 25
            prompt_file: lessons/rust-trait-dispatch.prompt.md
            supported_languages: [python]
            tags: [traits, generics, dispatch, monomorphization]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def main():
                    pass

                main()
            solution_code:
              python: |
                import sys

                def main():
                    lines = sys.stdin.read().splitlines()
                    idx = 0
                    t = int(lines[idx]); idx += 1
                    impl_map = {}
                    for _ in range(t):
                        parts = lines[idx].split(); idx += 1
                        type_name = parts[0]
                        trait_name = parts[2]
                        impl_map[(type_name, trait_name)] = True

                    c = int(lines[idx]); idx += 1
                    for _ in range(c):
                        parts = lines[idx].split(); idx += 1
                        dispatch = parts[0]
                        if dispatch == 'STATIC':
                            trait_name = parts[1]
                            type_name = parts[2]
                            if (type_name, trait_name) in impl_map:
                                print(f'{type_name}::{trait_name}_method')
                            else:
                                print(f'ERROR: {type_name} does not implement {trait_name}')
                        elif dispatch == 'DYNAMIC':
                            trait_name = parts[1]
                            types_list = parts[2].split(',')
                            error_found = None
                            for type_name in types_list:
                                if (type_name, trait_name) not in impl_map:
                                    error_found = type_name
                                    break
                            if error_found:
                                print(f'ERROR: {error_found} does not implement {trait_name}')
                            else:
                                print(f'OK: dyn {trait_name}')

                main()
            test_cases:
              - name: basic-dispatch
                stdin: "5\nDog implements Animal\nCat implements Animal\nDog implements Pet\nFish implements Animal\nRobot implements Machine\n6\nSTATIC Animal Dog\nSTATIC Animal Cat\nSTATIC Pet Fish\nDYNAMIC Animal Dog,Cat,Fish\nDYNAMIC Pet Dog,Cat\nSTATIC Machine Robot\n"
                expected_stdout: "Dog::Animal_method\nCat::Animal_method\nERROR: Fish does not implement Pet\nOK: dyn Animal\nERROR: Cat does not implement Pet\nRobot::Machine_method"
                is_hidden: false
                weight: 1
              - name: all-static
                stdin: "3\nCircle implements Shape\nRect implements Shape\nTriangle implements Shape\n3\nSTATIC Shape Circle\nSTATIC Shape Rect\nSTATIC Shape Triangle\n"
                expected_stdout: "Circle::Shape_method\nRect::Shape_method\nTriangle::Shape_method"
                is_hidden: false
                weight: 1
              - name: dynamic-partial-fail
                stdin: "2\nDog implements Drawable\nCat implements Drawable\n2\nDYNAMIC Drawable Dog,Cat\nDYNAMIC Drawable Dog,Cat,Fish\n"
                expected_stdout: "OK: dyn Drawable\nERROR: Fish does not implement Drawable"
                is_hidden: true
                weight: 1
              - name: unregistered-static
                stdin: "1\nFoo implements Bar\n2\nSTATIC Bar Foo\nSTATIC Bar Baz\n"
                expected_stdout: "Foo::Bar_method\nERROR: Baz does not implement Bar"
                is_hidden: true
                weight: 1

