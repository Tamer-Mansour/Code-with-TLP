        type: exercise
        duration_minutes: 20
        content_file: lessons/route-match-exercise.md
        exercises:
          - slug: node-route-matcher
            title: Express-style Route Matcher
            difficulty: medium
            points: 20
            prompt_file: lessons/node-route-matcher.prompt.md
            supported_languages: [python]
            tags: [routing, parsing]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    lines = [ln for ln in sys.stdin.read().splitlines() if ln]
                    n = int(lines[0])
                    routes = []
                    for i in range(1, n+1):
                        routes.append(lines[i].split("/")[1:])
                    queries = lines[n+1:]
                    for q in queries:
                        parts = q.split("/")[1:]
                        matched = "NO MATCH"
                        for rt in routes:
                            if len(rt) != len(parts):
                                continue
                            params = {}
                            ok = True
                            for seg_pattern, seg_actual in zip(rt, parts):
                                if seg_pattern.startswith(":"):
                                    params[seg_pattern[1:]] = seg_actual
                                elif seg_pattern != seg_actual:
                                    ok = False
                                    break
                            if ok:
                                matched = "/" + "/".join(rt)
                                if params:
                                    pstr = " ".join(f"{k}={v}" for k, v in params.items())
                                    matched += " " + pstr
                                break
                        print(matched)

                solve()
            test_cases:
              - name: basic
                stdin: "2\n/users/:id\n/posts/:postId/comments/:cid\n/users/42\n/posts/9/comments/3\n/about\n"
                expected_stdout: "/users/:id id=42\n/posts/:postId/comments/:cid postId=9 cid=3\nNO MATCH"
                is_hidden: false
                weight: 1
              - name: exact-match
                stdin: "2\n/about\n/users/:id\n/about\n/users/1\n"
                expected_stdout: "/about\n/users/:id id=1"
                is_hidden: false
                weight: 1
              - name: precedence-by-order
                stdin: "2\n/users/me\n/users/:id\n/users/me\n/users/42\n"
                expected_stdout: "/users/me\n/users/:id id=42"
                is_hidden: true
                weight: 1
              - name: no-match
                stdin: "1\n/users/:id\n/items/3\n"
                expected_stdout: "NO MATCH"
                is_hidden: true
                weight: 1
