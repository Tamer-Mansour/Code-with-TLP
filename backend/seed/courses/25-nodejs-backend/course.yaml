          - slug: nodejs-middleware-pipeline
            title: Middleware Pipeline Executor
            difficulty: medium
            points: 25
            prompt_file: lessons/nodejs-middleware-pipeline.prompt.md
            supported_languages: [python]
            tags: [express, middleware, request-lifecycle]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    lines = sys.stdin.read().splitlines()
                    n = int(lines[0])
                    # TODO: simulate the middleware pipeline
                    pass

                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    lines = sys.stdin.read().splitlines()
                    n = int(lines[0])
                    middlewares = []
                    for i in range(1, n + 1):
                        parts = lines[i].split(' ', 2)
                        middlewares.append(parts)

                    log = []
                    response = None
                    error_mode = False
                    i = 0
                    while i < len(middlewares):
                        mw = middlewares[i]
                        mtype = mw[0]
                        if error_mode:
                            if mtype == 'ERROR_HANDLER':
                                log.append(mw[1])
                                error_mode = False
                                i += 1
                            elif mtype == 'RESPOND':
                                response = 'RESPONSE ' + mw[1] + ' ' + mw[2]
                                break
                            else:
                                i += 1
                        else:
                            if mtype == 'NEXT':
                                log.append(mw[1])
                                i += 1
                            elif mtype == 'RESPOND':
                                response = 'RESPONSE ' + mw[1] + ' ' + mw[2]
                                break
                            elif mtype == 'ERROR':
                                error_mode = True
                                i += 1
                            elif mtype == 'ERROR_HANDLER':
                                i += 1

                    for entry in log:
                        print(entry)
                    print(response if response else 'NO RESPONSE')

                solve()
            test_cases:
              - name: error-then-handler
                stdin: "6\nNEXT logger\nNEXT auth\nERROR oops\nNEXT business-logic\nERROR_HANDLER error-handler\nRESPOND 500 internal-error\n"
                expected_stdout: "logger\nauth\nerror-handler\nRESPONSE 500 internal-error"
                is_hidden: false
                weight: 1
              - name: all-next-then-respond
                stdin: "4\nNEXT cors\nNEXT helmet\nNEXT auth\nRESPOND 200 ok\n"
                expected_stdout: "cors\nhelmet\nauth\nRESPONSE 200 ok"
                is_hidden: false
                weight: 1
              - name: early-termination
                stdin: "4\nNEXT logger\nRESPOND 401 unauthorized\nNEXT business-logic\nRESPOND 200 ok\n"
                expected_stdout: "logger\nRESPONSE 401 unauthorized"
                is_hidden: false
                weight: 1
              - name: no-response
                stdin: "3\nNEXT logger\nNEXT auth\nNEXT handler\n"
                expected_stdout: "logger\nauth\nhandler\nNO RESPONSE"
                is_hidden: true
                weight: 1
              - name: error-handler-skipped-in-normal-mode
                stdin: "5\nNEXT logger\nERROR_HANDLER unused-handler\nNEXT business\nRESPOND 200 success\nERROR_HANDLER also-unused\n"
                expected_stdout: "logger\nbusiness\nRESPONSE 200 success"
                is_hidden: true
