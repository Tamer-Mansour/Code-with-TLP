            supported_languages: [python]
            tags: [event-loop, async, node-internals]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().split()
                    idx = 0
                    n = int(data[idx]); idx += 1
                    # TODO: categorize and print tasks in event loop order
                    pass

                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().split()
                    idx = 0
                    n = int(data[idx]); idx += 1
                    sync_tasks = []
                    nexttick_tasks = []
                    microtasks = []
                    macrotasks = []
                    for _ in range(n):
                        task_type = data[idx]; idx += 1
                        label = data[idx]; idx += 1
                        if task_type == 'SYNC':
                            sync_tasks.append(label)
                        elif task_type == 'NEXTTICK':
                            nexttick_tasks.append(label)
                        elif task_type == 'MICROTASK':
                            microtasks.append(label)
                        elif task_type == 'MACROTASK':
                            macrotasks.append(label)
                    for label in sync_tasks + nexttick_tasks + microtasks + macrotasks:
                        print(label)

                solve()
            test_cases:
              - name: mixed-all-types
                stdin: "7\nSYNC A\nMACROTASK B\nMICROTASK C\nSYNC D\nNEXTTICK E\nMICROTASK F\nNEXTTICK G\n"
                expected_stdout: "A\nD\nE\nG\nC\nF\nB"
                is_hidden: false
                weight: 1
              - name: only-sync
                stdin: "3\nSYNC X\nSYNC Y\nSYNC Z\n"
                expected_stdout: "X\nY\nZ"
                is_hidden: false
                weight: 1
              - name: only-macrotasks
                stdin: "2\nMACROTASK timer1\nMACROTASK timer2\n"
                expected_stdout: "timer1\ntimer2"
                is_hidden: false
                weight: 1
              - name: nexttick-before-microtask
                stdin: "4\nMICROTASK promise1\nNEXTTICK tick1\nMICROTASK promise2\nNEXTTICK tick2\n"
                expected_stdout: "tick1\ntick2\npromise1\npromise2"
                is_hidden: true
                weight: 1
              - name: all-four-ordering
