                    # TODO: decode payload and extract claims
                    pass

                solve()
            solution_code:
              python: |
                import sys
                import base64
                import json

                def base64url_decode(s):
                    padding = 4 - len(s) % 4
                    if padding != 4:
                        s += '=' * padding
                    s = s.replace('-', '+').replace('_', '/')
                    return base64.b64decode(s)

                def solve():
                    lines = sys.stdin.read().splitlines()
                    jwt_token = lines[0].strip()
                    parts = jwt_token.split('.')
                    payload_encoded = parts[1]
                    payload_bytes = base64url_decode(payload_encoded)
                    payload = json.loads(payload_bytes.decode('utf-8'))
                    q = int(lines[1])
                    for i in range(2, 2 + q):
                        key = lines[i].strip()
                        if key in payload:
                            value = payload[key]
                            print(f'{key}: {value}')
                        else:
                            print(f'{key}: MISSING')

                solve()
            test_cases:
