            supported_languages: [python]
            tags: [http, classification]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().split()
                    n = int(data[0])
                    # TODO: classify each status code
                    for i in range(1, n + 1):
                        code = int(data[i])
                        pass

                solve()
            solution_code:
              python: |
                import sys

                def classify(code):
                    if 100 <= code <= 199:
                        return "Informational"
                    elif 200 <= code <= 299:
                        return "Success"
                    elif 300 <= code <= 399:
                        return "Redirection"
                    elif 400 <= code <= 499:
                        return "Client Error"
                    else:
                        return "Server Error"

                def solve():
                    data = sys.stdin.read().split()
                    n = int(data[0])
                    for i in range(1, n + 1):
                        code = int(data[i])
                        print(f"{code} {classify(code)}")

                solve()
            test_cases:
              - name: mixed-codes
                stdin: "4\n200\n404\n301\n500\n"
                expected_stdout: "200 Success\n404 Client Error\n301 Redirection\n500 Server Error"
                is_hidden: false
                weight: 1
              - name: informational
                stdin: "2\n100\n101\n"
                expected_stdout: "100 Informational\n101 Informational"
                is_hidden: false
                weight: 1
              - name: all-2xx
                stdin: "3\n201\n204\n200\n"
                expected_stdout: "201 Success\n204 Success\n200 Success"
                is_hidden: true
                weight: 1
              - name: client-and-server
                stdin: "3\n401\n403\n503\n"
                expected_stdout: "401 Client Error\n403 Client Error\n503 Server Error"
                is_hidden: true
                weight: 1

