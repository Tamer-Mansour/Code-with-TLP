        title: LINQ-style Aggregation
        type: exercise
        duration_minutes: 20
        content_file: lessons/linq-exercise.md
        exercises:
          - slug: cs-net-linq-aggregate
            title: GroupBy Average (LINQ Simulation)
            difficulty: medium
            points: 20
            prompt_file: lessons/cs-net-linq-aggregate.prompt.md
            supported_languages: [python]
            tags: [linq, aggregation]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    lines = sys.stdin.read().splitlines()
                    n = int(lines[0])
                    sums = {}
                    counts = {}
                    for ln in lines[1:1+n]:
                        cat, val = ln.split(",")
                        v = int(val)
                        sums[cat] = sums.get(cat, 0) + v
                        counts[cat] = counts.get(cat, 0) + 1
                    avgs = [(c, sums[c] / counts[c]) for c in sums]
                    avgs.sort(key=lambda kv: (-kv[1], kv[0]))
                    for c, a in avgs:
                        # print integer if exact, else format like .2f
                        if abs(a - int(a)) < 1e-9:
                            print(f"{c} {int(a)}")
                        else:
                            print(f"{c} {a:.2f}")

                solve()
            test_cases:
              - name: basic
                stdin: "5\nA,10\nB,20\nA,30\nB,40\nC,50\n"
                expected_stdout: "C 50\nB 30\nA 20"
                is_hidden: false
                weight: 1
              - name: decimals
                stdin: "3\nx,1\nx,2\nx,4\n"
                expected_stdout: "x 2.33"
                is_hidden: false
                weight: 1
              - name: ties
                stdin: "4\na,10\nb,10\nc,5\nd,5\n"
                expected_stdout: "a 10\nb 10\nc 5\nd 5"
                is_hidden: true
                weight: 1
              - name: single
                stdin: "1\nz,100\n"
                expected_stdout: "z 100"
                is_hidden: true
                weight: 1

