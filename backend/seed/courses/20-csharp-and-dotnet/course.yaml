        exercises:
          - slug: csharp-grade-classifier
            title: Grade Classifier
            difficulty: easy
            points: 10
            prompt_file: lessons/csharp-grade-classifier.prompt.md
            supported_languages: [python]
            tags: [conditionals, type-conversion, input-parsing]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                score = int(input())
                # your code here
            solution_code:
              python: |
                score = int(input())
                if 90 <= score <= 100:
                    grade = 'A'
                elif 80 <= score <= 89:
                    grade = 'B'
                elif 70 <= score <= 79:
                    grade = 'C'
                elif 60 <= score <= 69:
                    grade = 'D'
                else:
                    grade = 'F'
                print(grade)
                print('Pass' if grade != 'F' else 'Fail')
            test_cases:
              - name: b_grade
                stdin: "85"
                expected_stdout: "B\nPass"
                is_hidden: false
                weight: 1
              - name: f_grade
                stdin: "55"
                expected_stdout: "F\nFail"
                is_hidden: false
                weight: 1
              - name: a_grade
                stdin: "95"
                expected_stdout: "A\nPass"
                is_hidden: false
                weight: 1
              - name: d_grade_boundary
                stdin: "60"
                expected_stdout: "D\nPass"
                is_hidden: true
                weight: 1
              - name: c_grade
                stdin: "73"
                expected_stdout: "C\nPass"
                is_hidden: true
                weight: 1
              - name: perfect_score
                stdin: "100"
                expected_stdout: "A\nPass"
                is_hidden: true
                weight: 1
