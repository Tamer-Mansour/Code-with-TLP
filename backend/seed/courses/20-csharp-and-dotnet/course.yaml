        exercises:
          - slug: csharp-fizzbuzz
            title: FizzBuzz .NET Style
            difficulty: easy
            points: 10
            prompt_file: lessons/csharp-fizzbuzz.prompt.md
            supported_languages: [python]
            tags: [loops, conditionals, modulo]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                n = int(input())
                # your code here
            solution_code:
              python: |
                n = int(input())
                for i in range(1, n + 1):
                    if i % 15 == 0:
                        print('FizzBuzz')
                    elif i % 3 == 0:
                        print('Fizz')
                    elif i % 5 == 0:
                        print('Buzz')
                    else:
                        print(i)
            test_cases:
              - name: n_equals_15
                stdin: "15"
                expected_stdout: "1\n2\nFizz\n4\nBuzz\nFizz\n7\n8\nFizz\nBuzz\n11\nFizz\n13\n14\nFizzBuzz"
                is_hidden: false
                weight: 1
              - name: n_equals_1
                stdin: "1"
                expected_stdout: "1"
                is_hidden: false
                weight: 1
              - name: n_equals_5
                stdin: "5"
                expected_stdout: "1\n2\nFizz\n4\nBuzz"
                is_hidden: false
                weight: 1
              - name: n_equals_30
                stdin: "30"
                expected_stdout: "1\n2\nFizz\n4\nBuzz\nFizz\n7\n8\nFizz\nBuzz\n11\nFizz\n13\n14\nFizzBuzz\n16\n17\nFizz\n19\nBuzz\nFizz\n22\n23\nFizz\nBuzz\n26\nFizz\n28\n29\nFizzBuzz"
                is_hidden: true
                weight: 1
              - name: n_equals_3
                stdin: "3"
                expected_stdout: "1\n2\nFizz"
                is_hidden: true
                weight: 1
      - slug: csharp-grade-classifier-exercise
