        exercises:
          - slug: cs-net-word-freq
            title: Word Frequency Counter
            difficulty: easy
            points: 15
            prompt_file: lessons/cs-net-word-freq.prompt.md
            supported_languages: [python]
            tags: [strings, collections, sorting]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    line = sys.stdin.read().strip()
                    words = line.split()
                    counts = {}
                    for w in words:
                        counts[w] = counts.get(w, 0) + 1
                    sorted_words = sorted(counts.items(), key=lambda kv: (-kv[1], kv[0]))
                    for word, cnt in sorted_words:
                        print(f"{word} {cnt}")

                solve()
            test_cases:
              - name: basic
                stdin: "the cat sat on the mat the cat\n"
                expected_stdout: "the 3\ncat 2\nmat 1\non 1\nsat 1"
                is_hidden: false
                weight: 1
              - name: two-words
                stdin: "hello world hello\n"
                expected_stdout: "hello 2\nworld 1"
                is_hidden: false
                weight: 1
              - name: single-word
                stdin: "a\n"
                expected_stdout: "a 1"
                is_hidden: false
                weight: 1
              - name: tie-alphabetical
                stdin: "b a b a c\n"
                expected_stdout: "a 2\nb 2\nc 1"
                is_hidden: true
                weight: 1
              - name: all-same
                stdin: "go go go go\n"
                expected_stdout: "go 4"
                is_hidden: true
                weight: 1
