        solution_code:
          python: |
            def solve():
                t = int(input())
                committed = {}

                for _ in range(t):
                    header = input().split()
                    propagation = header[1]
                    local_writes = {}
                    exception_type = None

                    line = input()
                    while line.strip() != 'END':
                        op = line.split()
                        if op[0] == 'WRITE':
                            local_writes[op[1]] = op[2]
                        elif op[0] == 'THROW':
                            exception_type = op[1]
                        line = input()

                    if exception_type == 'RUNTIME':
                        pass  # rollback: discard local_writes
                    else:
                        committed.update(local_writes)

                if not committed:
                    print('EMPTY')
                else:
                    for k in sorted(committed):
                        print(f'{k}={committed[k]}')

            solve()
        test_cases:
          - name: "REQUIRED rolls back, REQUIRES_NEW commits on CHECKED"
            stdin: |
              2
              TRANSACTION REQUIRED
              WRITE balance 500
              WRITE name Alice
              THROW RUNTIME
              END
              TRANSACTION REQUIRES_NEW
              WRITE balance 200
              WRITE city London
              THROW CHECKED
              END
            expected_stdout: |
              balance=200
              city=London
            is_hidden: false
            weight: 1
          - name: "Two commits then one rollback"
            stdin: |
              3
              TRANSACTION REQUIRED
              WRITE x 10
              END
              TRANSACTION REQUIRED
              WRITE y 20
              END
              TRANSACTION REQUIRES_NEW
              WRITE z 30
              THROW RUNTIME
              END
            expected_stdout: |
              x=10
              y=20
            is_hidden: false
            weight: 1
          - name: "All transactions roll back — EMPTY result"
            stdin: |
              1
              TRANSACTION REQUIRED
              WRITE a hello
              THROW RUNTIME
              END
            expected_stdout: |
              EMPTY
            is_hidden: false
            weight: 1
          - name: "REQUIRES_NEW commits first, subsequent REQUIRED rolls back same key"
            stdin: |
              2
              TRANSACTION REQUIRES_NEW
              WRITE token abc123
              END
              TRANSACTION REQUIRED
              WRITE token xyz789
              THROW RUNTIME
              END
            expected_stdout: |
              token=abc123
            is_hidden: true
            weight: 2
          - name: "Multiple REQUIRES_NEW with CHECKED exceptions all commit"
            stdin: |
              3
              TRANSACTION REQUIRES_NEW
              WRITE audit_1 created
              THROW CHECKED
              END
              TRANSACTION REQUIRED
              WRITE order_1 pending
              END
              TRANSACTION REQUIRES_NEW
              WRITE audit_2 completed
              END
            expected_stdout: |
              audit_1=created
              audit_2=completed
              order_1=pending
            is_hidden: true
            weight: 2

