        solution_code:
          python: |
            import sys
            from collections import defaultdict, deque

            def solve():
                n = int(input())
                beans = {}
                for _ in range(n):
                    parts = input().split()
                    name = parts[0]
                    class_name = parts[1]
                    deps = parts[2:]
                    beans[name] = (class_name, deps)
                target = input().strip()

                visited = set()
                def collect(b):
                    if b in visited:
                        return
                    visited.add(b)
                    if b in beans:
                        for dep in beans[b][1]:
                            collect(dep)
                collect(target)

                in_degree = defaultdict(int)
                adj = defaultdict(list)
                for b in visited:
                    if b in beans:
                        for dep in beans[b][1]:
                            if dep in visited:
                                adj[dep].append(b)
                                in_degree[b] += 1

                queue = deque()
                for b in sorted(visited):
                    if in_degree[b] == 0:
                        queue.append(b)

                order = []
                while queue:
                    node = queue.popleft()
                    order.append(node)
                    for neighbor in sorted(adj[node]):
                        in_degree[neighbor] -= 1
                        if in_degree[neighbor] == 0:
                            queue.append(neighbor)

                if len(order) != len(visited):
                    print('CIRCULAR DEPENDENCY')
                else:
                    for b in order:
                        print(beans[b][0] if b in beans else b)

            solve()
        test_cases:
          - name: "Linear chain of three beans"
            stdin: |
              3
              c C b
              b B a
              a A
              c
            expected_stdout: |
              A
              B
              C
            is_hidden: false
            weight: 1
          - name: "Circular dependency detected"
            stdin: |
              2
              serviceA ServiceA serviceB
              serviceB ServiceB serviceA
              serviceA
            expected_stdout: |
              CIRCULAR DEPENDENCY
            is_hidden: false
            weight: 1
          - name: "Single bean with no dependencies"
            stdin: |
              1
              myRepo MyRepository
              myRepo
            expected_stdout: |
              MyRepository
            is_hidden: false
            weight: 1
          - name: "Diamond dependency graph"
            stdin: |
              4
              dService DService bService cService
              bService BService aRepo
              cService CService aRepo
              aRepo ARepository
              dService
            expected_stdout: |
              ARepository
              BService
              CService
              DService
            is_hidden: true
            weight: 2
          - name: "Partial graph: only reachable beans instantiated"
            stdin: |
              4
              controller WebController service
              service BusinessService repo
              repo JpaRepository
              unrelated UnrelatedService
              service
            expected_stdout: |
              JpaRepository
              BusinessService
            is_hidden: true
            weight: 2

