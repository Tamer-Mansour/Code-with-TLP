        solution_code:
          python: |
            def solve():
                n = int(input())
                rules = []
                seen_fields = []
                seen_set = set()
                for _ in range(n):
                    parts = input().split()
                    field = parts[0]
                    constraint = parts[1]
                    value = parts[2] if len(parts) > 2 else '-'
                    rules.append((field, constraint, value))
                    if field not in seen_set:
                        seen_fields.append(field)
                        seen_set.add(field)

                t = int(input())
                for _ in range(t):
                    fields = {}
                    for fname in seen_fields:
                        parts = input().split()
                        fvalue = parts[1] if len(parts) > 1 else ''
                        fields[fname] = fvalue

                    errors = []
                    for (field, constraint, value) in rules:
                        fval = fields.get(field, '')
                        failed = False
                        if constraint == 'NOT_BLANK':
                            failed = fval.strip() == ''
                        elif constraint == 'MIN':
                            try:
                                failed = int(fval) < int(value)
                            except ValueError:
                                failed = True
                        elif constraint == 'MAX':
                            try:
                                failed = int(fval) > int(value)
                            except ValueError:
                                failed = True
                        elif constraint == 'SIZE_MIN':
                            failed = len(fval) < int(value)
                        elif constraint == 'SIZE_MAX':
                            failed = len(fval) > int(value)
                        if failed:
                            errors.append(f'{field}: {constraint} violated')

                    if not errors:
                        print('VALID')
                    else:
                        for e in errors:
                            print(e)

            solve()
        test_cases:
          - name: "Mixed results: valid, size violation, blank and size violations"
            stdin: |
              4
              username NOT_BLANK -
              username SIZE_MIN 3
              username SIZE_MAX 20
              age MIN 18
              3
              username alice
              age 25
              username ab
              age 15
              username
              age 20
            expected_stdout: |
              VALID
              username: SIZE_MIN violated
              age: MIN violated
              username: NOT_BLANK violated
              username: SIZE_MIN violated
            is_hidden: false
            weight: 1
          - name: "All fields valid"
            stdin: |
              2
              name NOT_BLANK -
              score MAX 100
              1
              name Bob
              score 95
            expected_stdout: |
              VALID
            is_hidden: false
            weight: 1
          - name: "MAX constraint violation"
            stdin: |
              2
              price MIN 0
              price MAX 9999
              2
              price 5000
              price 10000
            expected_stdout: |
              VALID
              price: MAX violated
            is_hidden: false
            weight: 1
          - name: "SIZE_MAX violation"
            stdin: |
              2
              tag NOT_BLANK -
              tag SIZE_MAX 5
              2
              tag hello
              tag toolongvalue
            expected_stdout: |
              VALID
              tag: SIZE_MAX violated
            is_hidden: true
            weight: 2
          - name: "Multiple field violations in one object"
            stdin: |
              4
              email NOT_BLANK -
              age MIN 18
              age MAX 120
              username SIZE_MIN 3
              1
              email
              age 200
              username ab
            expected_stdout: |
              email: NOT_BLANK violated
              age: MAX violated
              username: SIZE_MIN violated
            is_hidden: true
            weight: 2

