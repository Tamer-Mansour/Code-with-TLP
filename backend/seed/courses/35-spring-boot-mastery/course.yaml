subject:
  slug: java-spring
  name: "Java & Spring"
  description: "Master backend development with Java and the Spring ecosystem — from your first REST endpoint to production-ready, secured, tested services."
  icon: leaf
  color: "#6db33f"
  order_index: 12

course:
  slug: spring-boot-mastery
  title: "Spring Boot Mastery"
  summary: "Master Spring Boot in Java: REST APIs, Spring Data JPA, validation, Spring Security + JWT, testing, and production deployment — with real projects."
  description: |
    A complete, project-driven path to mastering Spring Boot 3 with Java 17+. You will go from
    installing the toolchain to building secured, tested, production-ready REST APIs. Every module
    pairs concepts with a hands-on project (Product Catalog, Book Library, Task Management, a secured
    JWT API, and an e-commerce capstone), plus quizzes and coding challenges. Designed to follow the
    Backend Developer Roadmap — do that first if Java, SQL, and the web basics are new to you.
  difficulty: intermediate
  estimated_hours: 45
  is_published: true
  order_index: 35

