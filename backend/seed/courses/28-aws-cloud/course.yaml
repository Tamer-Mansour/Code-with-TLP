            solution_code:
              python: |
                import sys

                def solve():
                    prices = {
                        'STANDARD': 0.023,
                        'STANDARD_IA': 0.0125,
                        'GLACIER': 0.004,
                        'DEEP_ARCHIVE': 0.00099,
                    }
                    lines = sys.stdin.read().splitlines()
