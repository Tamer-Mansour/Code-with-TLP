      - slug: cidr-overlap-exercise
        title: CIDR Overlap Check
        type: exercise
        duration_minutes: 20
        content_file: lessons/cidr-overlap-exercise.md
        exercises:
          - slug: aws-cidr-overlap
            title: VPC CIDR Overlap Check
            difficulty: medium
            points: 20
            prompt_file: lessons/aws-cidr-overlap.prompt.md
            supported_languages: [python]
            tags: [networking, cidr]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys

                def cidr_to_range(c):
                    ip_str, prefix = c.split("/")
                    prefix = int(prefix)
                    octets = [int(x) for x in ip_str.split(".")]
                    addr = (octets[0] << 24) | (octets[1] << 16) | (octets[2] << 8) | octets[3]
                    mask = ((1 << prefix) - 1) << (32 - prefix) if prefix > 0 else 0
                    network = addr & mask
                    broadcast = network | ((1 << (32 - prefix)) - 1)
                    return network, broadcast

                def solve():
                    parts = sys.stdin.read().split()
                    a, b = parts[0], parts[1]
                    a1, a2 = cidr_to_range(a)
                    b1, b2 = cidr_to_range(b)
                    if a2 < b1 or b2 < a1:
                        print("NO")
                    else:
                        print("YES")

                solve()
            test_cases:
              - name: overlap
                stdin: "10.0.0.0/16 10.0.1.0/24\n"
                expected_stdout: "YES"
                is_hidden: false
                weight: 1
              - name: no-overlap
                stdin: "10.0.0.0/16 10.1.0.0/16\n"
                expected_stdout: "NO"
                is_hidden: false
                weight: 1
              - name: same
                stdin: "192.168.0.0/24 192.168.0.0/24\n"
                expected_stdout: "YES"
                is_hidden: true
                weight: 1
              - name: adjacent
                stdin: "10.0.0.0/24 10.0.1.0/24\n"
                expected_stdout: "NO"
                is_hidden: true
                weight: 1
