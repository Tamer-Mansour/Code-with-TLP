            supported_languages: [python]
            tags: [networking, vpc, cidr]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    lines = sys.stdin.read().splitlines()
                    # TODO: find smallest prefix for each requirement
                    pass

                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    lines = sys.stdin.read().splitlines()
                    # lines[0] is VPC CIDR (context only)
                    n = int(lines[1])
                    for i in range(2, 2 + n):
                        required = int(lines[i])
                        found = False
                        for prefix in range(28, 0, -1):
                            usable = (2 ** (32 - prefix)) - 5
                            if usable >= required:
                                print(f'/{prefix}')
                                found = True
                                break
                        if not found:
                            print('IMPOSSIBLE')

                solve()
            test_cases:
              - name: research-spec-four-cases
                stdin: "10.0.0.0/16\n4\n251\n11\n500\n4090\n"
                expected_stdout: "/24\n/28\n/23\n/20"
                is_hidden: false
                weight: 1
              - name: minimum-requirement
                stdin: "10.0.0.0/16\n1\n1\n"
                expected_stdout: "/28"
                is_hidden: false
                weight: 1
              - name: just-over-slash28
                stdin: "10.0.0.0/16\n1\n12\n"
                expected_stdout: "/27"
                is_hidden: true
                weight: 1
              - name: multiple-mixed
                stdin: "172.16.0.0/16\n3\n1000\n250\n27\n"
                expected_stdout: "/22\n/24\n/27"
                is_hidden: true
                weight: 1
              - name: slash24-boundary
                stdin: "10.0.0.0/16\n2\n251\n252\n"
                expected_stdout: "/24\n/23"
                is_hidden: true
                weight: 1

