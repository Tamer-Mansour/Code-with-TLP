            supported_languages: [python]
            tags: [s3, storage, cost]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().split()
                    # TODO
                    pass

                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    tokens = sys.stdin.read().split()
                    idx = 0
                    n = int(tokens[idx]); idx += 1
                    total = 0.0
                    for _ in range(n):
                        size = int(tokens[idx]); idx += 1
                        age = int(tokens[idx]); idx += 1
                        if age >= 365:
                            rate = 0.00099
                        elif age >= 90:
                            rate = 0.004
                        elif age >= 30:
                            rate = 0.0125
                        else:
                            rate = 0.023
                        total += size * rate
                    print(f"{total:.4f}")

                solve()
            test_cases:
              - name: mixed-classes
                stdin: "3\n10 15\n50 45\n100 400\n"
                expected_stdout: "0.9540"
                is_hidden: false
                weight: 1
              - name: all-standard
                stdin: "2\n5 0\n20 29\n"
                expected_stdout: "0.5750"
                is_hidden: false
                weight: 1
              - name: single-deep-archive
                stdin: "1\n1000 365\n"
                expected_stdout: "0.9900"
                is_hidden: true
                weight: 1
              - name: glacier-instant-boundary
                stdin: "1\n100 90\n"
                expected_stdout: "0.4000"
                is_hidden: true
                weight: 1
              - name: standard-ia-boundary
                stdin: "1\n80 30\n"
                expected_stdout: "1.0000"
                is_hidden: true
                weight: 1

