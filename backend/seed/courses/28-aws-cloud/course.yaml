            supported_languages: [python]
            tags: [ec2, autoscaling, compute]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                import math

                def solve():
                    lines = sys.stdin.read().splitlines()
                    # TODO: simulate auto scaling
                    pass

                solve()
            solution_code:
              python: |
                import sys
                import math

                def solve():
                    first_line = sys.stdin.read().splitlines()
                    parts = first_line[0].split()
                    min_cap = int(parts[0])
                    max_cap = int(parts[1])
                    desired = int(parts[2])
                    target = float(parts[3])
                    n = int(first_line[1])
                    for i in range(2, 2 + n):
                        cpu = float(first_line[i])
                        if cpu > target:
                            new_desired = math.ceil(desired * (cpu / target))
                            desired = min(new_desired, max_cap)
                        elif cpu < target * 0.9:
                            new_desired = math.floor(desired * (cpu / target))
                            desired = max(new_desired, min_cap)
                        print(desired)

                solve()
            test_cases:
              - name: research-spec-trace
                stdin: "2 10 3 60.0\n5\n45.0\n75.0\n90.0\n30.0\n20.0\n"
                expected_stdout: "2\n3\n5\n2\n2"
                is_hidden: false
                weight: 1
              - name: no-change-at-target
                stdin: "2 10 5 60.0\n1\n60.0\n"
                expected_stdout: "5"
                is_hidden: false
                weight: 1
              - name: scale-out-hits-max
                stdin: "1 5 4 70.0\n2\n100.0\n100.0\n"
                expected_stdout: "5\n5"
                is_hidden: true
                weight: 1
              - name: scale-in-hits-min
                stdin: "2 8 6 50.0\n2\n10.0\n10.0\n"
                expected_stdout: "2\n2"
                is_hidden: true
                weight: 1
              - name: single-scale-out
                stdin: "1 10 3 80.0\n1\n90.0\n"
                expected_stdout: "4"
                is_hidden: true
                weight: 1

