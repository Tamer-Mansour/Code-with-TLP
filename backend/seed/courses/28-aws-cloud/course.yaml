          - slug: aws-iam-policy-eval
            title: IAM Policy Evaluator
            difficulty: medium
            points: 20
            prompt_file: lessons/aws-iam-policy-eval.prompt.md
            supported_languages: [python]
            tags: [iam, security, policies]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().splitlines()
                    # TODO: parse statements and evaluate action
                    pass

                solve()
            solution_code:
              python: |
                import sys

                def matches(pattern, action):
                    if pattern == '*':
                        return True
                    if pattern.endswith('*'):
                        return action.startswith(pattern[:-1])
                    return pattern == action

                def solve():
                    lines = sys.stdin.read().splitlines()
                    n = int(lines[0])
                    statements = []
                    for i in range(1, n + 1):
                        parts = lines[i].split()
                        statements.append((parts[0], parts[1]))
                    action = lines[n + 1].strip()

                    explicit_deny = any(e == 'Deny' and matches(a, action) for e, a in statements)
                    explicit_allow = any(e == 'Allow' and matches(a, action) for e, a in statements)

                    if explicit_deny:
                        print('DENY')
                    elif explicit_allow:
                        print('ALLOW')
                    else:
                        print('DENY')

                solve()
            test_cases:
              - name: explicit-deny-wins
                stdin: "4\nAllow s3:GetObject\nAllow s3:PutObject\nDeny s3:DeleteObject\nAllow ec2:DescribeInstances\ns3:DeleteObject\n"
                expected_stdout: "DENY"
                is_hidden: false
                weight: 1
              - name: explicit-allow
                stdin: "4\nAllow s3:GetObject\nAllow s3:PutObject\nDeny s3:DeleteObject\nAllow ec2:DescribeInstances\ns3:GetObject\n"
                expected_stdout: "ALLOW"
                is_hidden: false
                weight: 1
              - name: wildcard-allow
                stdin: "1\nAllow s3:*\ns3:PutObject\n"
                expected_stdout: "ALLOW"
                is_hidden: false
                weight: 1
              - name: wildcard-deny-overrides-allow
                stdin: "2\nAllow s3:*\nDeny s3:DeleteObject\ns3:DeleteObject\n"
                expected_stdout: "DENY"
                is_hidden: true
                weight: 1
              - name: implicit-deny-no-match
                stdin: "1\nAllow ec2:DescribeInstances\ns3:GetObject\n"
                expected_stdout: "DENY"
                is_hidden: true
                weight: 1
              - name: global-wildcard-deny-specific
                stdin: "2\nAllow *\nDeny iam:DeleteUser\niam:DeleteUser\n"
                expected_stdout: "DENY"
                is_hidden: true
                weight: 1

