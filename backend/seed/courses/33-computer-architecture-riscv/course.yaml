subject:
  slug: systems
  name: Systems
  description: How computers run software, from the CPU up to the network.
  icon: server
  color: '#ef4444'
  order_index: 4
course:
  slug: computer-architecture-riscv
  title: Computer Architecture with RISC-V
  summary: From transistors and digital logic to pipelines, caches, virtual memory, traps, and multicore
    — taught on the open RISC-V ISA.
  description: A ground-up tour of how a modern processor works, using RISC-V as the running example.
    Covers number systems, digital logic, the datapath, instruction encoding, pipelining and hazards,
    branch prediction, the memory hierarchy, virtual memory, traps and CSRs, privilege modes, multicore
    coherence, and the boot process.
  difficulty: advanced
  estimated_hours: 50
  order_index: 33
  is_published: true
