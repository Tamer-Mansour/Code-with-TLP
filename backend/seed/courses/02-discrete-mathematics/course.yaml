                    # TODO: output lexicographically smallest topological order
                    print(' '.join(map(str, range(1, N + 1))))

                solve()
            solution_code:
              python: |
                import sys
                import heapq

                def solve():
                    data = sys.stdin.read().split()
                    idx = 0
                    N = int(data[idx]); idx += 1
                    M = int(data[idx]); idx += 1
                    adj = [[] for _ in range(N + 1)]
                    indeg = [0] * (N + 1)
                    for _ in range(M):
                        u = int(data[idx]); idx += 1
                        v = int(data[idx]); idx += 1
                        adj[u].append(v)
                        indeg[v] += 1

                    # Kahn's algorithm with min-heap for lex smallest order
                    heap = []
                    for v in range(1, N + 1):
                        if indeg[v] == 0:
                            heapq.heappush(heap, v)

                    result = []
                    while heap:
                        v = heapq.heappop(heap)
                        result.append(v)
                        for u in adj[v]:
                            indeg[u] -= 1
                            if indeg[u] == 0:
                                heapq.heappush(heap, u)

                    print(' '.join(map(str, result)))

                solve()
            test_cases:
              - name: basic-dag
                stdin: "4 3\n1 3\n2 3\n3 4\n"
                expected_stdout: "1 2 3 4"
                is_hidden: false
