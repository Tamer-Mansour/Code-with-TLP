            supported_languages: [python]
            tags: [graphs, dag, topological-sort]
            time_limit_ms: 3000
            memory_limit_mb: 256
            starter_code:
              python: |
                import sys
                import heapq

                def solve():
                    data = sys.stdin.read().split()
                    idx = 0
                    N = int(data[idx]); idx += 1
                    M = int(data[idx]); idx += 1
                    adj = [[] for _ in range(N + 1)]
