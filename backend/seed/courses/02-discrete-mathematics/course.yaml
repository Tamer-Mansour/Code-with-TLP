            supported_languages: [python]
            tags: [number-theory, gcd, bezout, cryptography]
            time_limit_ms: 3000
            memory_limit_mb: 256
            starter_code:
              python: |
                def extended_gcd(a, b):
                    # TODO: return (gcd, x, y) such that a*x + b*y == gcd
                    return a, 1, 0

                a, b = map(int, input().split())
                g, x, y = extended_gcd(a, b)
                print(g)
                print(x, y)
            solution_code:
              python: |
                def extended_gcd(a, b):
                    if b == 0:
                        return a, 1, 0
                    g, x1, y1 = extended_gcd(b, a % b)
                    return g, y1, x1 - (a // b) * y1

                a, b = map(int, input().split())
                g, x, y = extended_gcd(a, b)
                print(g)
                print(x, y)
            test_cases:
