            supported_languages: [python]
            tags: [logic, propositional-calculus, truth-tables]
            time_limit_ms: 3000
            memory_limit_mb: 256
            starter_code:
              python: |
                p, q = map(int, input().split())
                # TODO: compute each connective and print five lines
                print(f'p AND q: 0')
                print(f'p OR q: 0')
                print(f'NOT p: 0')
                print(f'p IMPLIES q: 0')
                print(f'p IFF q: 0')
            solution_code:
              python: |
                p, q = map(int, input().split())
                and_val = p & q
                or_val = p | q
                not_p = 1 - p
                implies_val = (1 - p) | q
                iff_val = implies_val & ((1 - q) | p)
                print(f'p AND q: {and_val}')
                print(f'p OR q: {or_val}')
                print(f'NOT p: {not_p}')
                print(f'p IMPLIES q: {implies_val}')
                print(f'p IFF q: {iff_val}')
            test_cases:
              - name: "p1-q0"
