        content_file: lessons/discrete-inclusion-exclusion-exercise.md
        exercises:
          - slug: discrete-inclusion-exclusion
            title: "Inclusion-Exclusion Counter"
            difficulty: medium
            points: 20
            prompt_file: lessons/discrete-inclusion-exclusion.prompt.md
            supported_languages: [python]
            tags: [set-theory, combinatorics, inclusion-exclusion]
            time_limit_ms: 3000
            memory_limit_mb: 256
            starter_code:
              python: |
                import math
                n, a, b = map(int, input().split())
                # TODO: use inclusion-exclusion to count multiples
                print(f'Divisible by {a} only: 0')
                print(f'Divisible by {b} only: 0')
                print(f'Divisible by both: 0')
                print(f'Divisible by at least one: 0')
            solution_code:
              python: |
                import math
                n, a, b = map(int, input().split())
                lcm = a * b // math.gcd(a, b)
                count_a = n // a
                count_b = n // b
                count_both = n // lcm
                count_a_only = count_a - count_both
                count_b_only = count_b - count_both
                count_either = count_a + count_b - count_both
                print(f'Divisible by {a} only: {count_a_only}')
                print(f'Divisible by {b} only: {count_b_only}')
                print(f'Divisible by both: {count_both}')
                print(f'Divisible by at least one: {count_either}')
            test_cases:
              - name: "thirty-3-5"
                stdin: "30 3 5\n"
                expected_stdout: "Divisible by 3 only: 8\nDivisible by 5 only: 4\nDivisible by both: 2\nDivisible by at least one: 14"
