        exercises:
          - slug: postgresql-vacuum-bloat
            title: "Simulate VACUUM: Identify Dead Tuple Bloat"
            difficulty: medium
            points: 25
            prompt_file: lessons/postgresql-vacuum-bloat.prompt.md
            supported_languages: [python]
            tags: [postgres, mvcc, vacuum, bloat]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().splitlines()
                    n = int(data[0])
                    # TODO: simulate INSERT/UPDATE, track live and dead tuples
                    pass

                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().splitlines()
                    n = int(data[0])
                    dead = 0
                    live_keys = set()
                    for i in range(1, n + 1):
                        parts = data[i].split()
                        op, key = parts[0], parts[1]
                        if op == 'INSERT':
                            live_keys.add(key)
                        elif op == 'UPDATE':
                            if key in live_keys:
                                dead += 1
                    live = len(live_keys)
                    total = live + dead
                    bloat = dead / total * 100 if total > 0 else 0.0
                    print(f'live: {live}')
                    print(f'dead: {dead}')
                    print(f'bloat: {round(bloat, 1)}%')

                solve()
            test_cases:
              - name: sample-seven-ops
                stdin: "7\nINSERT 1\nINSERT 2\nINSERT 3\nUPDATE 1\nUPDATE 2\nUPDATE 1\nINSERT 4\n"
                expected_stdout: "live: 4\ndead: 3\nbloat: 42.9%"
                is_hidden: false
                weight: 1
              - name: no-updates
                stdin: "3\nINSERT 1\nINSERT 2\nINSERT 3\n"
                expected_stdout: "live: 3\ndead: 0\nbloat: 0.0%"
                is_hidden: false
                weight: 1
              - name: single-key-many-updates
                stdin: "4\nINSERT 1\nUPDATE 1\nUPDATE 1\nUPDATE 1\n"
                expected_stdout: "live: 1\ndead: 3\nbloat: 75.0%"
