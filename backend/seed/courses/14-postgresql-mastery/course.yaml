            solution_code:
              python: |
                import sys
                from collections import defaultdict

                def solve():
                    data = sys.stdin.read().splitlines()
                    n = int(data[0])
                    employees = []
                    for i in range(1, n + 1):
                        parts = data[i].split()
                        name, dept, salary = parts[0], parts[1], int(parts[2])
                        employees.append((name, dept, salary))

                    by_dept = defaultdict(list)
                    for emp in employees:
                        by_dept[emp[1]].append(emp)

                    results = []
                    for dept in sorted(by_dept.keys()):
                        emps = by_dept[dept]
                        sorted_emps = sorted(emps, key=lambda x: -x[2])
                        rank = 0
                        prev_salary = None
                        for emp in sorted_emps:
                            if emp[2] != prev_salary:
                                rank += 1
                                prev_salary = emp[2]
                            results.append((emp[0], emp[1], emp[2], rank))

                    results.sort(key=lambda x: (x[1], x[3], x[0]))
                    for r in results:
                        print(r[0], r[1], r[2], r[3])

                solve()
            test_cases:
              - name: basic-two-depts
                stdin: "6\nAlice Engineering 90000\nBob Engineering 90000\nCarol Engineering 80000\nDave Sales 70000\nEve Sales 70000\nFrank Sales 60000\n"
