            title: JSONB-style Path Filter
            difficulty: medium
            points: 20
            prompt_file: lessons/pg-jsonb-filter.prompt.md
            supported_languages: [python]
            tags: [postgres, jsonb]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys, json
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys, json

                def solve():
                    data = sys.stdin.read().splitlines()
                    n = int(data[0])
                    path, value = data[1].split("=", 1)
                    path_parts = path.split(".")
                    out = []
                    for i in range(2, 2 + n):
                        try:
                            d = json.loads(data[i])
                        except Exception:
                            continue
                        cur = d
                        ok = True
                        for p in path_parts:
                            if isinstance(cur, dict) and p in cur:
                                cur = cur[p]
                            else:
                                ok = False
                                break
                        if ok and str(cur) == value:
                            out.append(data[i])
                    print("\n".join(out))

                solve()
            test_cases:
              - name: simple
                stdin: '3\naddress.country=DE\n{"name":"Alice","address":{"country":"DE"}}\n{"name":"Bob","address":{"country":"US"}}\n{"name":"Carol","address":{"country":"DE"}}\n'
                expected_stdout: '{"name":"Alice","address":{"country":"DE"}}\n{"name":"Carol","address":{"country":"DE"}}'
                is_hidden: false
                weight: 1
              - name: top-level
                stdin: '2\nrole=admin\n{"role":"admin","id":1}\n{"role":"user","id":2}\n'
                expected_stdout: '{"role":"admin","id":1}'
                is_hidden: false
                weight: 1
              - name: deep-path
                stdin: '2\na.b.c=1\n{"a":{"b":{"c":1}}}\n{"a":{"b":{"c":2}}}\n'
                expected_stdout: '{"a":{"b":{"c":1}}}'
                is_hidden: true
                weight: 1
              - name: missing-path
                stdin: '2\nx.y=z\n{"a":1}\n{"x":{"y":"z"}}\n'
                expected_stdout: '{"x":{"y":"z"}}'
                is_hidden: true
                weight: 1
