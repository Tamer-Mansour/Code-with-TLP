      - slug: postgresql-partition-pruning-lesson
        title: "Exercise: Partition Pruning Simulator"
        type: exercise
        duration_minutes: 25
        content_file: lessons/postgresql-partition-pruning.md
        exercises:
          - slug: postgresql-partition-pruning
            title: Partition Pruning Simulator
            difficulty: hard
            points: 35
            prompt_file: lessons/postgresql-partition-pruning.prompt.md
            supported_languages: [python]
            tags: [postgres, partitioning, query-planner]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().splitlines()
                    p = int(data[0])
                    # TODO: parse partitions, then for each query determine which partitions to scan
                    pass

                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().splitlines()
                    p = int(data[0])
                    partitions = []
                    for i in range(1, p + 1):
                        parts = data[i].split()
                        name, low, high = parts[0], int(parts[1]), int(parts[2])
                        partitions.append((name, low, high))

                    q = int(data[p + 1])
                    for j in range(p + 2, p + 2 + q):
                        parts = data[j].split()
                        op, val = parts[0], int(parts[1])
                        matched = []
                        for name, low, high in partitions:
                            if op == '=':
                                if low <= val < high:
                                    matched.append(name)
                            elif op == '<':
                                if low < val:
                                    matched.append(name)
                            elif op == '>':
                                if high - 1 > val:
                                    matched.append(name)
                            elif op == '<=':
                                if low <= val:
                                    matched.append(name)
                            elif op == '>=':
                                if high > val:
                                    matched.append(name)
                        if matched:
                            print(' '.join(sorted(matched)))
                        else:
                            print('NONE')

                solve()
            test_cases:
              - name: sample-three-queries
                stdin: "4\np2020 0 1000\np2021 1000 2000\np2022 2000 3000\np2023 3000 4000\n3\n= 1500\n< 1000\n>= 2000\n"
                expected_stdout: "p2021\np2020\np2022 p2023"
                is_hidden: false
                weight: 1
              - name: equality-boundary
                stdin: "2\npart_a 0 500\npart_b 500 1000\n2\n= 500\n= 499\n"
                expected_stdout: "part_b\npart_a"
                is_hidden: false
                weight: 1
              - name: less-than-none
                stdin: "2\npart_a 100 200\npart_b 200 300\n1\n< 100\n"
                expected_stdout: "NONE"
                is_hidden: false
                weight: 1
              - name: greater-than-all
                stdin: "3\np1 0 100\np2 100 200\np3 200 300\n1\n> 0\n"
                expected_stdout: "p1 p2 p3"
                is_hidden: true
                weight: 1
              - name: lte-single
                stdin: "3\npa 0 10\npb 10 20\npc 20 30\n2\n<= 9\n<= 10\n"
                expected_stdout: "pa\npa pb"
                is_hidden: true
                weight: 2
