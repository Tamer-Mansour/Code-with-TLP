        exercises:
          - slug: pg-cte-chain
            title: CTE Chain Filter
            difficulty: easy
            points: 15
            prompt_file: lessons/pg-cte-chain.prompt.md
            supported_languages: [python]
            tags: [postgres, cte, sql]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().splitlines()
                    # TODO
                    pass

                solve()
            solution_code:
              python: |
                import sys
                from collections import defaultdict

                def solve():
                    data = sys.stdin.read().splitlines()
                    n = int(data[0])
                    # Step 1: filter paid
                    paid = []
                    for i in range(1, 1 + n):
                        parts = data[i].split()
                        customer_id, status, month = parts[0], parts[1], int(parts[2])
                        if status == 'paid':
                            paid.append((customer_id, month))
                    # Step 2: filter month == 6
                    final = [(cid, m) for cid, m in paid if m == 6]
                    # Step 3: count per customer
                    counts = defaultdict(int)
                    for cid, _ in final:
                        counts[cid] += 1
                    for cid in sorted(counts.keys(), key=lambda x: int(x)):
                        print(cid, counts[cid])

                solve()
            test_cases:
              - name: basic
                stdin: "5\n1 paid 6\n2 unpaid 6\n1 paid 5\n3 paid 6\n1 paid 6\n"
                expected_stdout: "1 2\n3 1"
                is_hidden: false
                weight: 1
              - name: all-unpaid
                stdin: "3\n1 unpaid 6\n2 unpaid 6\n3 unpaid 6\n"
                expected_stdout: ""
                is_hidden: false
                weight: 1
              - name: sorted-output
                stdin: "4\n10 paid 6\n20 paid 6\n10 paid 6\n5 paid 6\n"
                expected_stdout: "5 1\n10 2\n20 1"
                is_hidden: false
                weight: 1
              - name: wrong-month
                stdin: "3\n1 paid 3\n2 paid 6\n1 paid 6\n"
                expected_stdout: "1 1\n2 1"
                is_hidden: true
                weight: 1
              - name: single-row
                stdin: "1\n7 paid 6\n"
                expected_stdout: "7 1"
                is_hidden: true
                weight: 1

  - title: JSON, Arrays, and Full-Text Search
    summary: JSONB indexing, array types, and tsvector search.
    order_index: 3
    lessons:
      - slug: jsonb-and-gin
        title: JSONB and GIN Indexes
        type: reading
        duration_minutes: 14
        content_file: lessons/jsonb-and-gin.md
      - slug: jsonb-exercise
        title: Filter JSONB Records
        type: exercise
        duration_minutes: 20
        content_file: lessons/jsonb-exercise.md
        exercises:
          - slug: pg-jsonb-filter
            title: JSONB-style Path Filter
            difficulty: medium
            points: 20
            prompt_file: lessons/pg-jsonb-filter.prompt.md
            supported_languages: [python]
            tags: [postgres, jsonb]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys, json
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys, json

                def solve():
                    data = sys.stdin.read().splitlines()
                    n = int(data[0])
                    path, value = data[1].split("=", 1)
                    path_parts = path.split(".")
                    out = []
                    for i in range(2, 2 + n):
                        try:
                            d = json.loads(data[i])
                        except Exception:
                            continue
                        cur = d
                        ok = True
                        for p in path_parts:
                            if isinstance(cur, dict) and p in cur:
                                cur = cur[p]
                            else:
                                ok = False
                                break
                        if ok and str(cur) == value:
                            out.append(data[i])
                    print("\n".join(out))

                solve()
            test_cases:
              - name: simple
                stdin: '3\naddress.country=DE\n{"name":"Alice","address":{"country":"DE"}}\n{"name":"Bob","address":{"country":"US"}}\n{"name":"Carol","address":{"country":"DE"}}\n'
                expected_stdout: '{"name":"Alice","address":{"country":"DE"}}\n{"name":"Carol","address":{"country":"DE"}}'
                is_hidden: false
                weight: 1
              - name: top-level
                stdin: '2\nrole=admin\n{"role":"admin","id":1}\n{"role":"user","id":2}\n'
                expected_stdout: '{"role":"admin","id":1}'
                is_hidden: false
                weight: 1
              - name: deep-path
                stdin: '2\na.b.c=1\n{"a":{"b":{"c":1}}}\n{"a":{"b":{"c":2}}}\n'
                expected_stdout: '{"a":{"b":{"c":1}}}'
                is_hidden: true
                weight: 1
              - name: missing-path
                stdin: '2\nx.y=z\n{"a":1}\n{"x":{"y":"z"}}\n'
                expected_stdout: '{"x":{"y":"z"}}'
                is_hidden: true
                weight: 1
      - slug: full-text-search
        title: Full-Text Search with tsvector and tsquery
        type: reading
        duration_minutes: 13
        content_file: lessons/full-text-search.md

