            solution_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().splitlines()
                    n = int(data[0])

                    rules = {
                        ('jsonb', 'containment'): 'GIN',
                        ('array', 'containment'): 'GIN',
                        ('tsvector', 'fulltext'): 'GIN',
                        ('tsvector', 'containment'): 'GIN',
                        ('timestamp_sequential', 'range'): 'BRIN',
                        ('geometry', 'geometric'): 'GIST',
                        ('geometry', 'containment'): 'GIST',
                    }

                    for i in range(1, n + 1):
                        parts = data[i].split()
                        dtype, qpattern = parts[0], parts[1]
                        key = (dtype, qpattern)
                        if key in rules:
                            print(rules[key])
                        elif qpattern == 'equality':
                            print('BTREE')
                        elif qpattern == 'range':
                            print('BTREE')
                        else:
                            print('BTREE')

                solve()
            test_cases:
