                expected_stdout: "PHANTOM 1\nPHANTOM 2"
                is_hidden: false
                weight: 1
              - name: single-read-only
                stdin: "3\nT=1 OP=READ ROWS=10\nT=2 OP=INSERT ROWS=20\nT=3 OP=READ ROWS=10,20\n"
                expected_stdout: "NONE"
