        exercises:
          - slug: postgresql-phantom-read
            title: "Transaction Isolation: Detect Phantom Read Scenario"
            difficulty: medium
            points: 25
            prompt_file: lessons/postgresql-phantom-read.prompt.md
            supported_languages: [python]
            tags: [postgres, transactions, isolation, phantom-read]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().splitlines()
                    n = int(data[0])
                    # TODO: detect phantom reads from the event log
                    pass

                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().splitlines()
                    n = int(data[0])
                    txn_reads = {}
                    phantoms = set()

                    for i in range(1, n + 1):
                        line = data[i]
                        parts = {}
                        for token in line.split():
                            k, v = token.split('=')
                            parts[k] = v

                        txn_id = int(parts['T'])
                        op = parts['OP']

                        if op == 'READ':
                            rows = frozenset(parts['ROWS'].split(','))
                            if txn_id not in txn_reads:
                                txn_reads[txn_id] = [rows]
                            else:
                                first_read = txn_reads[txn_id][0]
                                if rows - first_read:
                                    phantoms.add(txn_id)
                                txn_reads[txn_id].append(rows)

                    if phantoms:
                        for txn in sorted(phantoms):
                            print(f'PHANTOM {txn}')
                    else:
                        print('NONE')

                solve()
            test_cases:
              - name: one-phantom
                stdin: "6\nT=1 OP=READ ROWS=10,20\nT=2 OP=INSERT ROWS=30\nT=3 OP=READ ROWS=10,20\nT=1 OP=READ ROWS=10,20,30\nT=3 OP=READ ROWS=10,20\nT=4 OP=READ ROWS=10,20,30\n"
