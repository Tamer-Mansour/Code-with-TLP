      - slug: postgresql-recursive-org-chart-lesson
        title: "Exercise: Recursive Org Chart Depth"
        type: exercise
        duration_minutes: 30
        content_file: lessons/postgresql-recursive-org-chart.md
        exercises:
          - slug: postgresql-recursive-org-chart
            title: "CTE Chain: Recursive Org Chart Depth"
            difficulty: hard
            points: 40
            prompt_file: lessons/postgresql-recursive-org-chart.prompt.md
            supported_languages: [python]
            tags: [postgres, cte, recursive, hierarchy]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                from collections import defaultdict, deque

                def solve():
                    data = sys.stdin.read().splitlines()
                    n = int(data[0])
                    # TODO: compute depth for each employee using BFS from roots
                    pass

                solve()
            solution_code:
              python: |
                import sys
                from collections import defaultdict, deque

                def solve():
                    data = sys.stdin.read().splitlines()
                    n = int(data[0])
                    manager = {}
                    children = defaultdict(list)
                    for i in range(1, n + 1):
                        parts = data[i].split()
                        emp, mgr = int(parts[0]), int(parts[1])
                        manager[emp] = mgr
                        if mgr != 0:
                            children[mgr].append(emp)

                    depth = {}
                    queue = deque()
                    for emp, mgr in manager.items():
                        if mgr == 0:
                            depth[emp] = 0
                            queue.append(emp)

                    while queue:
                        node = queue.popleft()
                        for child in children[node]:
                            depth[child] = depth[node] + 1
                            queue.append(child)

                    for emp in sorted(depth.keys()):
                        print(emp, depth[emp])

                solve()
            test_cases:
              - name: basic-hierarchy
                stdin: "6\n1 0\n2 1\n3 1\n4 2\n5 2\n6 3\n"
                expected_stdout: "1 0\n2 1\n3 1\n4 2\n5 2\n6 2"
                is_hidden: false
                weight: 1
              - name: single-root
                stdin: "1\n1 0\n"
                expected_stdout: "1 0"
                is_hidden: false
                weight: 1
              - name: linear-chain
                stdin: "4\n1 0\n2 1\n3 2\n4 3\n"
                expected_stdout: "1 0\n2 1\n3 2\n4 3"
                is_hidden: false
