course:
  slug: postgresql-mastery
  title: PostgreSQL Mastery
  summary: Advanced SQL, JSONB, indexes, MVCC, and operating Postgres in production.
  description: |
    PostgreSQL is the most feature-complete open-source relational database — and
    a strong default for most new projects. This course covers the SQL you'll
    actually write (CTEs, window functions, JSONB), the engine internals that
    explain query behavior (MVCC, indexes, vacuum), and the operational concepts
    that keep Postgres healthy.
  difficulty: intermediate
  estimated_hours: 20
  is_published: true
  order_index: 14

