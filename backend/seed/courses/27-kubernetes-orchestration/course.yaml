            title: ResourceQuota Admission Check
            difficulty: medium
            points: 25
            prompt_file: lessons/k8s-resource-quota-check.prompt.md
            supported_languages: [python]
            tags: [kubernetes, resources, quota]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read()
                    # TODO: parse quota and pod list, print ADMITTED/REJECTED
                    pass

                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    lines = sys.stdin.read().strip().splitlines()
                    first = lines[0].split()
                    cpu_limit, mem_limit = int(first[0]), int(first[1])
                    n = int(lines[1])
                    used_cpu, used_mem = 0, 0
                    out = []
                    for i in range(2, 2 + n):
                        parts = lines[i].split()
                        name, cpu_req, mem_req = parts[0], int(parts[1]), int(parts[2])
                        if used_cpu + cpu_req <= cpu_limit and used_mem + mem_req <= mem_limit:
                            used_cpu += cpu_req
                            used_mem += mem_req
                            out.append(name + " ADMITTED")
                        else:
                            out.append(name + " REJECTED")
                    print("\n".join(out))

                solve()
            test_cases:
              - name: mixed
                stdin: "1000 512\n4\nweb 300 128\napi 400 200\nworker 400 250\nbatch 100 50\n"
                expected_stdout: "web ADMITTED\napi ADMITTED\nworker REJECTED\nbatch ADMITTED"
                is_hidden: false
                weight: 1
              - name: all-admitted
                stdin: "2000 1024\n3\npod-a 500 200\npod-b 600 300\npod-c 700 400\n"
                expected_stdout: "pod-a ADMITTED\npod-b ADMITTED\npod-c ADMITTED"
                is_hidden: false
                weight: 1
              - name: first-rejected-cpu
                stdin: "200 512\n3\nbig 300 100\nsmall 100 100\ntiny 50 50\n"
                expected_stdout: "big REJECTED\nsmall ADMITTED\ntiny ADMITTED"
                is_hidden: true
                weight: 1
              - name: mem-limit-hit
                stdin: "1000 300\n3\na 100 200\nb 200 150\nc 100 100\n"
                expected_stdout: "a ADMITTED\nb REJECTED\nc ADMITTED"
                is_hidden: true
                weight: 1
              - name: single-pod
                stdin: "500 500\n1\nonly 500 500\n"
                expected_stdout: "only ADMITTED"
                is_hidden: true
                weight: 1

