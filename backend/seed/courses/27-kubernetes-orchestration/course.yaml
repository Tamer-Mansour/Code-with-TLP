        exercises:
          - slug: k8s-selector-match
            title: Label Selector Matcher
            difficulty: medium
            points: 20
            prompt_file: lessons/k8s-selector-match.prompt.md
            supported_languages: [python]
            tags: [kubernetes, selectors]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    lines = sys.stdin.read().splitlines()
                    sel = {}
                    for kv in lines[0].split(","):
                        k, v = kv.split("=")
                        sel[k.strip()] = v.strip()
                    n = int(lines[1])
                    out = []
                    for i in range(2, 2+n):
                        parts = lines[i].split(" ", 1)
                        name = parts[0]
                        labels = {}
                        if len(parts) > 1 and parts[1]:
                            for kv in parts[1].split(","):
                                k, v = kv.split("=")
                                labels[k.strip()] = v.strip()
                        if all(labels.get(k) == v for k, v in sel.items()):
                            out.append(name)
                    if out:
                        print("\n".join(out))
                    else:
                        print("NONE")

                solve()
            test_cases:
              - name: simple
                stdin: "app=web\n3\npod-1 app=web,env=prod\npod-2 app=api\npod-3 app=web,env=dev\n"
                expected_stdout: "pod-1\npod-3"
                is_hidden: false
                weight: 1
              - name: multi-label
                stdin: "app=web,env=prod\n3\npod-1 app=web,env=prod\npod-2 app=web,env=dev\npod-3 app=web,env=prod,version=v2\n"
                expected_stdout: "pod-1\npod-3"
                is_hidden: false
                weight: 1
              - name: none
                stdin: "app=nope\n2\npod-1 app=web\npod-2 app=api\n"
                expected_stdout: "NONE"
                is_hidden: true
                weight: 1
              - name: no-labels
                stdin: "app=web\n2\npod-1 \npod-2 app=web\n"
                expected_stdout: "pod-2"
                is_hidden: true
                weight: 1

