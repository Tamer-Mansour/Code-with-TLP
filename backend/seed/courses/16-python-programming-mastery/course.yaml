            prompt_file: lessons/python-fibonacci.prompt.md
            supported_languages: [python]
            tags: [loops, sequences, iteration]
            time_limit_ms: 2000
            memory_limit_mb: 64
            starter_code:
              python: |
                n = int(input())
                # TODO: print the first n Fibonacci numbers separated by spaces
            solution_code:
              python: |
                def fibonacci(n):
                    result = []
                    a, b = 0, 1
                    for _ in range(n):
                        result.append(a)
                        a, b = b, a + b
                    return result

                n = int(input())
                print(' '.join(map(str, fibonacci(n))))
            test_cases:
