            solution_code:
              python: |
                import sys

                class Stack:
                    def __init__(self):
                        self._data = []

                    def push(self, value):
                        self._data.append(value)

                    def pop(self):
                        if not self._data:
                            return 'Empty'
                        return self._data.pop()

                    def peek(self):
                        if not self._data:
                            return 'Empty'
                        return self._data[-1]

                    def size(self):
                        return len(self._data)

                stack = Stack()
                for line in sys.stdin:
                    line = line.strip()
                    if not line:
                        continue
                    parts = line.split()
                    cmd = parts[0]
                    if cmd == 'PUSH':
                        stack.push(int(parts[1]))
                    elif cmd == 'POP':
                        print(stack.pop())
                    elif cmd == 'PEEK':
                        print(stack.peek())
                    elif cmd == 'SIZE':
                        print(stack.size())
            test_cases:
              - name: basic-sequence
                stdin: "PUSH 5\nPUSH 3\nPEEK\nPOP\nSIZE\nPOP\nPOP\n"
                expected_stdout: "3\n3\n1\n5\nEmpty"
                is_hidden: false
                weight: 1
              - name: empty-stack
