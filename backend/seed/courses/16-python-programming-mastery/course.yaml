        exercises:
          - slug: py-group-anagrams
            title: Group Anagrams
            difficulty: medium
            points: 20
            prompt_file: lessons/py-group-anagrams.prompt.md
            supported_languages: [python]
            tags: [hashing, strings]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    words = [w for w in sys.stdin.read().split() if w]
                    groups = {}
                    order = []
                    for w in words:
                        key = "".join(sorted(w))
                        if key not in groups:
                            groups[key] = []
                            order.append(key)
                        groups[key].append(w)
                    out = []
                    for k in order:
                        out.append(" ".join(sorted(groups[k])))
                    print("\n".join(out))

                solve()
            test_cases:
              - name: basic
                stdin: "eat tea tan ate nat bat\n"
                expected_stdout: "ate eat tea\nant tan\nbat"
                is_hidden: false
                weight: 1
              - name: no-anagrams
                stdin: "a b c\n"
                expected_stdout: "a\nb\nc"
                is_hidden: false
                weight: 1
              - name: single-word
                stdin: "hello\n"
                expected_stdout: "hello"
                is_hidden: true
                weight: 1
              - name: longer
                stdin: "listen silent enlist hello world\n"
                expected_stdout: "enlist listen silent\nhello\ndlorw"
                is_hidden: true
                weight: 1

