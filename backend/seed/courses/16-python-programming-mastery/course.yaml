            prompt_file: lessons/py-word-frequency.prompt.md
            supported_languages: [python]
            tags: [strings, collections, sorting]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    line = sys.stdin.readline()
                    # TODO
                solve()
            solution_code:
              python: |
                import sys
                import string

                def solve():
                    line = sys.stdin.readline()
                    counts = {}
                    for token in line.split():
                        word = token.strip(string.punctuation).lower()
                        if word:
                            counts[word] = counts.get(word, 0) + 1
                    for word in sorted(counts):
                        print(f"{word}: {counts[word]}")

                solve()
            test_cases:
              - name: basic
                stdin: "Hello world hello Python world world\n"
                expected_stdout: "hello: 2\npython: 1\nworld: 3"
                is_hidden: false
                weight: 1
              - name: with-punctuation
                stdin: "Hello, world! Hello Python... world world\n"
                expected_stdout: "hello: 2\npython: 1\nworld: 3"
                is_hidden: false
                weight: 1
              - name: shakespeare
                stdin: "to be or not to be\n"
                expected_stdout: "be: 2\nnot: 1\nor: 1\nto: 2"
                is_hidden: false
                weight: 1
