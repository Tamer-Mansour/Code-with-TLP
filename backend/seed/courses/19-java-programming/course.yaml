            supported_languages: [python]
            tags: [streams, sorting, optional]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                n = int(input())
                items = []
                for _ in range(n):
                    line = input().split()
                    items.append((line[0], int(line[1])))
                budget = int(input())
                # TODO: filter and sort items
            solution_code:
              python: |
                n = int(input())
                items = []
                for _ in range(n):
                    line = input().split()
                    items.append((line[0], int(line[1])))
                budget = int(input())
                filtered = [(name, price) for name, price in items if price <= budget]
                filtered.sort(key=lambda x: (x[1], x[0]))
                if not filtered:
                    print('No items found')
                else:
                    for name, price in filtered:
                        print(f'{name} {price}')
            test_cases:
              - name: basic
                stdin: "5\napple 2\nbanana 1\ncherry 5\ndate 3\nelderberry 1\n3"
                expected_stdout: "banana 1\nelderberry 1\napple 2\ndate 3"
