        type: exercise
        duration_minutes: 20
        content_file: lessons/io-exercise.md
        exercises:
          - slug: java-line-filter
            title: Line Number Filter
            difficulty: easy
            points: 15
            prompt_file: lessons/java-line-filter.prompt.md
            supported_languages: [python]
            tags: [io, strings, filtering]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().splitlines()
                    # TODO
                    pass

                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().splitlines()
                    n = int(data[0])
                    lines = data[1:n+1]
                    keyword = data[n+1]
                    for i, line in enumerate(lines, start=1):
                        if keyword in line:
                            print(f"{i}: {line}")

                solve()
            test_cases:
              - name: basic
                stdin: "4\nHello world\nJava is great\nhello again\nGoodbye world\nworld\n"
                expected_stdout: "1: Hello world\n4: Goodbye world"
                is_hidden: false
                weight: 1
              - name: single-match
                stdin: "3\nalpha\nbeta\ngamma\nalpha\n"
                expected_stdout: "1: alpha"
                is_hidden: false
                weight: 1
              - name: no-match
                stdin: "2\nabc\ndef\nxyz\n"
                expected_stdout: ""
                is_hidden: false
                weight: 1
              - name: case-sensitive
                stdin: "3\nJava\njava\nJAVA\njava\n"
                expected_stdout: "2: java"
                is_hidden: true
                weight: 1
              - name: multi-match
                stdin: "5\ncat in a hat\ndog\nhat rack\nhat on hat\nbrim\nhat\n"
                expected_stdout: "1: cat in a hat\n3: hat rack\n4: hat on hat"
                is_hidden: true
                weight: 1

