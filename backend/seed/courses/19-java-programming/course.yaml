        exercises:
          - slug: java-fizzbuzz
            title: FizzBuzz with Configurable Range
            difficulty: easy
            points: 10
            prompt_file: lessons/java-fizzbuzz.prompt.md
            supported_languages: [python]
            tags: [control-flow, loops, modulus]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                n = int(input())
                _ = int(input())
                # TODO: print FizzBuzz sequence then Plain numbers count
            solution_code:
              python: |
                n = int(input())
                _ = int(input())
                count = 0
                for i in range(1, n + 1):
                    if i % 15 == 0:
                        print('FizzBuzz')
                    elif i % 3 == 0:
                        print('Fizz')
                    elif i % 5 == 0:
                        print('Buzz')
                    else:
                        print(i)
                        count += 1
                print(f'Plain numbers: {count}')
            test_cases:
