        title: Task Scheduler Simulation
        type: exercise
        duration_minutes: 25
        content_file: lessons/java-concurrency-exercise.md
        exercises:
          - slug: java-task-scheduler
            title: Task Scheduler Simulation
            difficulty: medium
            points: 20
            prompt_file: lessons/java-concurrency.prompt.md
            supported_languages: [python]
            tags: [concurrency, simulation, scheduling]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                t = int(input())
                n = int(input())
                durations = list(map(int, input().split()))
                # TODO: simulate fixed thread pool scheduling
            solution_code:
              python: |
                t = int(input())
                n = int(input())
                durations = list(map(int, input().split()))
                free = [0] * t
                for i, d in enumerate(durations):
                    min_time = min(free)
                    thread = free.index(min_time)
                    free[thread] = min_time + d
                    print(f"Task {i}: thread {thread}, finishes at {free[thread]}")
            test_cases:
              - name: basic
                stdin: "2\n4\n3 1 4 2"
                expected_stdout: "Task 0: thread 0, finishes at 3\nTask 1: thread 1, finishes at 1\nTask 2: thread 1, finishes at 5\nTask 3: thread 0, finishes at 5"
                is_hidden: false
                weight: 1
              - name: single-thread
                stdin: "1\n3\n2 3 1"
                expected_stdout: "Task 0: thread 0, finishes at 2\nTask 1: thread 0, finishes at 5\nTask 2: thread 0, finishes at 6"
                is_hidden: false
                weight: 1
              - name: all-same-duration
                stdin: "3\n3\n5 5 5"
                expected_stdout: "Task 0: thread 0, finishes at 5\nTask 1: thread 1, finishes at 5\nTask 2: thread 2, finishes at 5"
                is_hidden: true
                weight: 1
              - name: tie-pick-lowest
                stdin: "2\n4\n5 5 1 1"
                expected_stdout: "Task 0: thread 0, finishes at 5\nTask 1: thread 1, finishes at 5\nTask 2: thread 0, finishes at 6\nTask 3: thread 1, finishes at 6"
                is_hidden: true
                weight: 1
              - name: more-tasks-than-threads
                stdin: "2\n6\n1 1 1 1 1 1"
                expected_stdout: "Task 0: thread 0, finishes at 1\nTask 1: thread 1, finishes at 1\nTask 2: thread 0, finishes at 2\nTask 3: thread 1, finishes at 2\nTask 4: thread 0, finishes at 3\nTask 5: thread 1, finishes at 3"
                is_hidden: true
                weight: 1

