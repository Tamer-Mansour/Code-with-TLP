        exercises:
          - slug: java-word-count
            title: Top-N Word Count (Streams Simulation)
            difficulty: medium
            points: 20
            prompt_file: lessons/java-word-count.prompt.md
            supported_languages: [python]
            tags: [streams, hashing]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    lines = sys.stdin.read().splitlines()
                    k = int(lines[0])
                    text = " ".join(lines[1:])
                    words = text.split()
                    counts = {}
                    for w in words:
                        counts[w] = counts.get(w, 0) + 1
                    items = sorted(counts.items(), key=lambda kv: (-kv[1], kv[0]))[:k]
                    for word, c in items:
                        print(f"{word} {c}")

                solve()
            test_cases:
              - name: basic
                stdin: "3\nthe quick brown fox jumps over the lazy dog the\n"
                expected_stdout: "the 3\nbrown 1\ndog 1"
                is_hidden: false
                weight: 1
              - name: alpha-tiebreak
                stdin: "2\nb a a b c\n"
                expected_stdout: "a 2\nb 2"
                is_hidden: false
                weight: 1
              - name: k-larger
                stdin: "5\none two\n"
                expected_stdout: "one 1\ntwo 1"
                is_hidden: true
                weight: 1
              - name: multiline
                stdin: "2\nhello world\nhello again\n"
                expected_stdout: "hello 2\nagain 1"
                is_hidden: true
                weight: 1

