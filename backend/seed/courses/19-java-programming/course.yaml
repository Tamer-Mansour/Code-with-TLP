        exercises:
          - slug: java-bank-account
            title: Bank Account Simulation
            difficulty: medium
            points: 20
            prompt_file: lessons/java-bank-account.prompt.md
            supported_languages: [python]
            tags: [oop, encapsulation, state]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                balance = int(input())
                for line in sys.stdin:
                    line = line.strip()
                    if not line:
                        continue
                    # TODO: handle deposit, withdraw, balance commands
            solution_code:
              python: |
                import sys
                balance = int(input())
                for line in sys.stdin:
                    line = line.strip()
                    if not line:
                        continue
                    parts = line.split()
                    if parts[0] == 'deposit':
                        balance += int(parts[1])
                        print(balance)
                    elif parts[0] == 'withdraw':
                        amount = int(parts[1])
                        if amount > balance:
                            print('Insufficient funds')
                        else:
                            balance -= amount
                            print(balance)
                    elif parts[0] == 'balance':
                        print(balance)
            test_cases:
              - name: basic
                stdin: "100\ndeposit 50\nbalance\nwithdraw 200\nwithdraw 30\nbalance"
                expected_stdout: "150\n150\nInsufficient funds\n120\n120"
                is_hidden: false
                weight: 1
              - name: zero-balance-withdraw
                stdin: "0\nwithdraw 1\nbalance"
                expected_stdout: "Insufficient funds\n0"
                is_hidden: false
                weight: 1
              - name: exact-withdraw
                stdin: "50\nwithdraw 50\nbalance"
                expected_stdout: "0\n0"
                is_hidden: true
                weight: 1
              - name: multiple-deposits
                stdin: "10\ndeposit 5\ndeposit 5\ndeposit 5\nbalance"
                expected_stdout: "15\n20\n25\n25"
                is_hidden: true
                weight: 1
              - name: withdraw-then-deposit
                stdin: "200\nwithdraw 100\ndeposit 300\nwithdraw 400\nbalance"
                expected_stdout: "100\n400\n0\n0"
                is_hidden: true
                weight: 1

