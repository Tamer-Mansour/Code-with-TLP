            solution_code:
              python: |
                import sys

                def solve():
                    lines = sys.stdin.read().strip().splitlines()
                    idx = 0
                    n = int(lines[idx]); idx += 1
                    containers = {}
                    total_shares = 0
                    for _ in range(n):
                        parts = lines[idx].split(); idx += 1
                        name, mem_limit, cpu_shares = parts[0], int(parts[1]), int(parts[2])
                        containers[name] = {'mem': mem_limit, 'cpu': cpu_shares}
                        total_shares += cpu_shares
                    m = int(lines[idx]); idx += 1
                    for _ in range(m):
                        parts = lines[idx].split(); idx += 1
                        cname, req_mem, req_cpu = parts[0], int(parts[1]), int(parts[2])
                        c = containers[cname]
                        max_cpu_pct = (c['cpu'] * 100) // total_shares
                        if req_mem > c['mem'] or req_cpu > max_cpu_pct:
                            print('DENIED')
                        else:
                            print('ALLOWED')

                solve()
