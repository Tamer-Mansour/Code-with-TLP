      - slug: compose-dependency-exercise
        title: Docker Compose Dependency Resolver
        type: exercise
        duration_minutes: 30
        content_file: lessons/compose-dependency-exercise.md
        exercises:
          - slug: docker-compose-dependency-resolver
            title: Docker Compose Dependency Resolver
            difficulty: medium
            points: 25
            prompt_file: lessons/docker-compose-dependency-resolver.prompt.md
            supported_languages: [python]
            tags: [docker, compose, topological-sort, depends-on]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                from collections import defaultdict, deque

                def solve():
                    lines = sys.stdin.read().strip().splitlines()
                    # TODO: parse services + deps, output topological order
                    pass

                solve()
            solution_code:
              python: |
                import sys
                from collections import defaultdict, deque

                def solve():
                    lines = sys.stdin.read().strip().splitlines()
                    idx = 0
                    n = int(lines[idx]); idx += 1
                    deps = {}
                    all_services = set()
                    for _ in range(n):
                        parts = lines[idx].split(); idx += 1
                        service = parts[0]
                        dependencies = parts[1:]
                        deps[service] = dependencies
                        all_services.add(service)

                    in_degree = {s: 0 for s in all_services}
                    dependents = defaultdict(list)

                    for service, dependencies in deps.items():
                        for d in dependencies:
                            in_degree[service] += 1
                            dependents[d].append(service)

                    queue = deque(sorted([s for s in all_services if in_degree[s] == 0]))
                    result = []

                    while queue:
                        node = queue.popleft()
                        result.append(node)
                        newly_free = []
                        for dependent in dependents[node]:
                            in_degree[dependent] -= 1
                            if in_degree[dependent] == 0:
                                newly_free.append(dependent)
                        for s in sorted(newly_free):
                            inserted = False
                            for i in range(len(queue)):
                                if s < queue[i]:
                                    queue.insert(i, s)
                                    inserted = True
                                    break
                            if not inserted:
                                queue.append(s)

                    if len(result) != n:
                        print('CIRCULAR DEPENDENCY DETECTED')
                    else:
                        print('\n'.join(result))

                solve()
            test_cases:
              - name: five-services
                stdin: "5\nnginx app\napp api db\ndb\nredis\napi redis db\n"
                expected_stdout: "db\nredis\napi\napp\nnginx"
                is_hidden: false
                weight: 1
              - name: circular-dependency
                stdin: "3\na b\nb c\nc a\n"
                expected_stdout: "CIRCULAR DEPENDENCY DETECTED"
                is_hidden: false
                weight: 1
              - name: independent-first
                stdin: "4\nworker queue db\nqueue db\ndb\ncache\n"
                expected_stdout: "cache\ndb\nqueue\nworker"
                is_hidden: false
                weight: 1
              - name: all-independent
                stdin: "3\nbeta\nalpha\ngamma\n"
                expected_stdout: "alpha\nbeta\ngamma"
                is_hidden: true
                weight: 1
              - name: single-chain
                stdin: "4\nd c\nc b\nb a\na\n"
                expected_stdout: "a\nb\nc\nd"
                is_hidden: true
