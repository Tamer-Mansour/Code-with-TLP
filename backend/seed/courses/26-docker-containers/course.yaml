                stdin: "FROM python:3.11-slim\nRUN apt-get update && apt-get install -y curl\nCOPY requirements.txt /app/\nRUN pip install -r /app/requirements.txt\nCOPY src/ /app/src/\nCMD [\"python\", \"/app/src/main.py\"]\n---\nsrc/main.py"
