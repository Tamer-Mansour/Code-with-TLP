            solution_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read()
                    parts = data.split('---')
                    dockerfile_lines = [l.strip() for l in parts[0].strip().splitlines() if l.strip()]
                    changed_files = []
                    if len(parts) > 1:
                        changed_files = [l.strip() for l in parts[1].strip().splitlines() if l.strip()]

                    invalidated = False
                    result = []
                    for i, line in enumerate(dockerfile_lines, 1):
                        instruction = line.split()[0].upper() if line.split() else ''
                        if not invalidated:
                            if instruction in ('COPY', 'ADD'):
                                tokens = line.split()
                                sources = tokens[1:-1]
                                for src in sources:
                                    for changed in changed_files:
                                        if src in changed or changed in src:
                                            invalidated = True
                                            break
                                    if invalidated:
                                        break
                        if invalidated:
                            result.append(str(i))
                    print(' '.join(result))

                solve()
            test_cases:
