course:
  slug: docker-containers
  title: Docker and Containerization
  summary: Images, Dockerfile, networking, volumes, and Compose.
  description: |
    Docker packages applications into portable containers. This course covers
    the container model, writing efficient Dockerfiles, networking, volumes,
    multi-stage builds, Docker Compose, and security basics.
  difficulty: intermediate
  estimated_hours: 10
  is_published: true
  order_index: 26

