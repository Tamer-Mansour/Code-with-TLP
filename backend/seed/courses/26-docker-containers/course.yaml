      - slug: volume-mount-exercise
        title: Parse Docker Volume Mounts
        type: exercise
        duration_minutes: 20
        content_file: lessons/volume-mount-exercise.md
        exercises:
          - slug: docker-volume-mount
            title: Classify Volume Mount Strings
            difficulty: easy
            points: 15
            prompt_file: lessons/docker-volume-mount.prompt.md
            supported_languages: [python]
            tags: [docker, volumes]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().splitlines()
                    # TODO
                    pass

                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    lines = sys.stdin.read().splitlines()
                    n = int(lines[0])
                    mounts = lines[1:1+n]
                    named = 0
                    bind = 0
                    anonymous = 0
                    for m in mounts:
                        if m.startswith('/') or m.startswith('./') or m.startswith('../'):
                            # bind or anonymous
                            if ':' in m:
                                bind += 1
                            else:
                                anonymous += 1
                        else:
                            named += 1
                    print(f"named={named}")
                    print(f"bind={bind}")
                    print(f"anonymous={anonymous}")

                solve()
            test_cases:
              - name: mixed
                stdin: "4\npgdata:/var/lib/postgresql/data\n./src:/app/src\n/app/node_modules\nmyconfig:/etc/myapp\n"
                expected_stdout: "named=2\nbind=1\nanonymous=1"
                is_hidden: false
                weight: 1
              - name: all-named
                stdin: "3\nredisdata:/data\npgdata:/var/lib/postgresql/data\nlogvol:/var/log\n"
                expected_stdout: "named=3\nbind=0\nanonymous=0"
                is_hidden: false
                weight: 1
              - name: all-bind
                stdin: "2\n./src:/app/src\n/etc/nginx/nginx.conf:/etc/nginx/nginx.conf\n"
                expected_stdout: "named=0\nbind=2\nanonymous=0"
                is_hidden: true
                weight: 1
              - name: anonymous-only
                stdin: "2\n/app/node_modules\n/tmp/cache\n"
                expected_stdout: "named=0\nbind=0\nanonymous=2"
                is_hidden: true
                weight: 1
              - name: single-named
                stdin: "1\nmyvolume:/data\n"
                expected_stdout: "named=1\nbind=0\nanonymous=0"
                is_hidden: true
                weight: 1

