        type: exercise
        duration_minutes: 30
        content_file: lessons/image-layer-size-exercise.md
        exercises:
          - slug: docker-image-layer-size
            title: Image Layer Size Calculator
            difficulty: medium
            points: 25
            prompt_file: lessons/docker-image-layer-size.prompt.md
            supported_languages: [python]
            tags: [docker, layers, union-filesystem, copy-on-write]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    content = sys.stdin.read()
                    # TODO: parse layers and compute image size vs effective size
                    pass

                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    content = sys.stdin.read()
                    lines = content.strip().splitlines()
                    idx = 0
                    n = int(lines[idx]); idx += 1

                    layers = []
                    current_layer = []
                    i = idx
                    while i < len(lines):
                        line = lines[i].strip()
                        if not line:
                            if current_layer:
                                layers.append(current_layer)
                                current_layer = []
                            i += 1
                            continue
                        parts = line.split()
                        if len(parts) == 1:
                            i += 1
                            continue
                        op, filename, size = parts[0], parts[1], int(parts[2])
                        current_layer.append((op, filename, size))
                        i += 1
                    if current_layer:
                        layers.append(current_layer)

                    total_image_size = 0
                    file_state = {}

                    for layer in layers:
                        layer_size = 0
                        for op, filename, size in layer:
                            if op == 'ADD':
                                layer_size += size
                                file_state[filename] = (size, False)
                            elif op == 'MODIFY':
                                layer_size += size
                                file_state[filename] = (size, False)
                            elif op == 'DELETE':
                                file_state[filename] = (0, True)
                        total_image_size += layer_size

                    effective_size = sum(sz for sz, deleted in file_state.values() if not deleted)
                    print(f'Total image size: {total_image_size} bytes')
                    print(f'Effective filesystem size: {effective_size} bytes')

                solve()
            test_cases:
              - name: modify-and-delete
                stdin: "3\n1\nADD /app/base.py 1000\nADD /app/utils.py 500\n\n2\nMODIFY /app/base.py 1200\nADD /app/new.py 800\n\n3\nDELETE /app/utils.py 0\nMODIFY /app/new.py 900\n"
                expected_stdout: "Total image size: 4400 bytes\nEffective filesystem size: 2100 bytes"
                is_hidden: false
                weight: 1
              - name: only-adds
                stdin: "2\n1\nADD /etc/config 200\nADD /app/main 5000\n\n2\nADD /app/extra 300\n"
                expected_stdout: "Total image size: 5500 bytes\nEffective filesystem size: 5500 bytes"
                is_hidden: false
                weight: 1
              - name: delete-leaves-disk-waste
                stdin: "3\n1\nADD /app/a 1000\nADD /app/b 2000\n\n2\nADD /app/c 500\n\n3\nDELETE /app/a 0\nDELETE /app/b 0\n"
                expected_stdout: "Total image size: 3500 bytes\nEffective filesystem size: 500 bytes"
                is_hidden: false
                weight: 1
              - name: single-layer
                stdin: "1\n1\nADD /bin/app 10000\nADD /etc/config 200\n"
                expected_stdout: "Total image size: 10200 bytes\nEffective filesystem size: 10200 bytes"
                is_hidden: true
                weight: 1
              - name: modify-grows-disk
                stdin: "3\n1\nADD /app/data 1000\n\n2\nMODIFY /app/data 2000\n\n3\nMODIFY /app/data 3000\n"
                expected_stdout: "Total image size: 6000 bytes\nEffective filesystem size: 3000 bytes"
                is_hidden: true
                weight: 1

