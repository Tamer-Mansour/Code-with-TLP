            supported_languages: [python]
            tags: [mongodb, schema, validation]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                REQUIRED = {'name', 'age', 'email'}

                def check_document(lines):
                    # TODO: collect field names and check against REQUIRED
                    pass

                current = []
                for line in sys.stdin:
                    line_stripped = line.strip()
                    if line_stripped == '---':
                        print(check_document(current))
                        current = []
                    else:
                        current.append(line)

                if current:
                    print(check_document(current))
            solution_code:
              python: |
                import sys

                REQUIRED = {'name', 'age', 'email'}

                def check_document(lines):
                    fields = set()
                    for line in lines:
                        line = line.strip()
                        if ':' in line:
                            key = line.split(':', 1)[0].strip()
                            fields.add(key)
                    missing = REQUIRED - fields
                    if not missing:
                        return 'VALID'
                    else:
                        return 'MISSING: ' + ','.join(sorted(missing))

                current = []
                for line in sys.stdin:
                    line_stripped = line.strip()
                    if line_stripped == '---':
                        print(check_document(current))
                        current = []
                    else:
                        current.append(line)

                if current:
                    print(check_document(current))
            test_cases:
              - name: all-fields-present
                stdin: "name:Alice\nage:30\nemail:alice@example.com\n"
                expected_stdout: "VALID"
                is_hidden: false
                weight: 1
              - name: missing-age
                stdin: "name:Bob\nemail:bob@example.com\n"
                expected_stdout: "MISSING: age"
                is_hidden: false
                weight: 1
              - name: missing-email-and-name
                stdin: "age:25\n"
                expected_stdout: "MISSING: email,name"
                is_hidden: false
                weight: 1
              - name: multi-record-mixed
                stdin: "name:Alice\nage:30\nemail:alice@example.com\n---\nname:Bob\nemail:bob@example.com\n---\nage:25\n"
                expected_stdout: "VALID\nMISSING: age\nMISSING: email,name"
                is_hidden: false
                weight: 1
              - name: missing-all-three
                stdin: "city:London\ncountry:UK\n"
                expected_stdout: "MISSING: age,email,name"
                is_hidden: true
                weight: 1
              - name: extra-fields-still-valid
                stdin: "name:Carol\nage:28\nemail:carol@test.com\ncity:Paris\nrole:admin\n"
                expected_stdout: "VALID"
                is_hidden: true
                weight: 1

