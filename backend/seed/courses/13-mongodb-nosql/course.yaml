                expected_stdout: "count:4\nsum:20"
                is_hidden: true
                weight: 1
              - name: large-values
                stdin: "3\norders:1000\norders:2500\nreturns:500\n$match category=orders\n$group\n"
                expected_stdout: "count:2\nsum:3500"
                is_hidden: true
                weight: 1

