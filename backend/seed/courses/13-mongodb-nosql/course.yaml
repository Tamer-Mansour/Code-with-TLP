        content_file: lessons/mongodb-relationship-resolver.md
        exercises:
          - slug: mongodb-relationship-resolver
            title: Embedded vs Referenced Relationship Resolver
            difficulty: medium
            points: 20
            prompt_file: lessons/mongodb-relationship-resolver.prompt.md
            supported_languages: [python]
            tags: [mongodb, schema-design, embed, reference, lookup]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                from collections import defaultdict

                lines = [line.strip() for line in sys.stdin if line.strip()]
                idx = 0

                num_users = int(lines[idx]); idx += 1
                users = []
                for _ in range(num_users):
                    # TODO: parse userId:name
                    idx += 1

                num_orders = int(lines[idx]); idx += 1
                order_map = defaultdict(list)
                for _ in range(num_orders):
                    # TODO: parse orderId:userId:amount and group by userId
                    idx += 1

                # TODO: for each user, print "<name>: <count> orders, total: <sum>"
            solution_code:
              python: |
                import sys
                from collections import defaultdict

                lines = [line.strip() for line in sys.stdin if line.strip()]
                idx = 0

                num_users = int(lines[idx]); idx += 1
                users = []
                for _ in range(num_users):
                    uid, name = lines[idx].split(':', 1)
                    users.append((uid.strip(), name.strip()))
                    idx += 1

                num_orders = int(lines[idx]); idx += 1
                order_map = defaultdict(list)
                for _ in range(num_orders):
                    parts = lines[idx].split(':')
                    uid = parts[1].strip()
                    amount = int(parts[2].strip())
                    order_map[uid].append(amount)
                    idx += 1

                for uid, name in users:
                    orders = order_map[uid]
                    print(f'{name}: {len(orders)} orders, total: {sum(orders)}')
            test_cases:
              - name: basic-three-users
                stdin: "3\nu1:Alice\nu2:Bob\nu3:Carol\n4\no1:u1:100\no2:u2:200\no3:u1:150\no4:u2:50\n"
                expected_stdout: "Alice: 2 orders, total: 250\nBob: 2 orders, total: 250\nCarol: 0 orders, total: 0"
                is_hidden: false
                weight: 1
              - name: single-user-single-order
                stdin: "1\nu1:Dave\n1\no1:u1:500\n"
                expected_stdout: "Dave: 1 orders, total: 500"
                is_hidden: false
                weight: 1
              - name: all-users-no-orders
                stdin: "2\nu1:Alice\nu2:Bob\n0\n"
                expected_stdout: "Alice: 0 orders, total: 0\nBob: 0 orders, total: 0"
                is_hidden: false
                weight: 1
              - name: many-orders-one-user
                stdin: "2\nu1:Alice\nu2:Bob\n5\no1:u1:10\no2:u1:20\no3:u1:30\no4:u1:40\no5:u2:100\n"
                expected_stdout: "Alice: 4 orders, total: 100\nBob: 1 orders, total: 100"
                is_hidden: true
                weight: 1
              - name: output-order-matches-input
                stdin: "3\nu3:Zara\nu1:Alice\nu2:Bob\n2\no1:u1:50\no2:u3:75\n"
                expected_stdout: "Zara: 1 orders, total: 75\nAlice: 1 orders, total: 50\nBob: 0 orders, total: 0"
