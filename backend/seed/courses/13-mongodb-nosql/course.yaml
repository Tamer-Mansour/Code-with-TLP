                expected_stdout: "selectivity:1.00 quality:HIGH"
                is_hidden: false
                weight: 1
              - name: low-selectivity-boolean
                stdin: "6\ntrue\nfalse\ntrue\ntrue\nfalse\ntrue\n"
                expected_stdout: "selectivity:0.33 quality:LOW"
                is_hidden: false
                weight: 1
              - name: high-selectivity-partial
                stdin: "5\nA\nB\nC\nA\nD\n"
                expected_stdout: "selectivity:0.80 quality:HIGH"
                is_hidden: true
