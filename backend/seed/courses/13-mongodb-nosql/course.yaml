      - slug: crud-filter-exercise
        title: Simulate MongoDB Query Filtering
        type: exercise
        duration_minutes: 20
        content_file: lessons/crud-filter-exercise.md
        exercises:
          - slug: mongo-crud-filter
            title: Simulate MongoDB Query Filtering
            difficulty: easy
            points: 15
            prompt_file: lessons/mongo-crud-filter.prompt.md
            supported_languages: [python]
            tags: [mongodb, crud, filtering]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().splitlines()
                    # TODO
                    pass

                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().splitlines()
                    if not data:
                        return
                    n = int(data[0])
                    field, op, value = data[1].split()
                    value = int(value)
                    docs = []
                    for line in data[2:2 + n]:
                        pairs = line.split()
                        doc = {}
                        for pair in pairs:
                            k, v = pair.split(":")
                            doc[k] = int(v)
                        docs.append((line, doc))

                    ops = {
                        "eq":  lambda a, b: a == b,
                        "gt":  lambda a, b: a > b,
                        "lt":  lambda a, b: a < b,
                        "gte": lambda a, b: a >= b,
                        "lte": lambda a, b: a <= b,
                    }
                    cmp = ops[op]
                    results = [raw for raw, doc in docs if field in doc and cmp(doc[field], value)]
                    if results:
                        print("\n".join(results))
                    else:
                        print("none")

                solve()
            test_cases:
              - name: basic-gt
                stdin: "3\nage gt 25\nname:Alice age:30\nname:Bob age:20\nname:Carol age:35\n"
                expected_stdout: "name:Alice age:30\nname:Carol age:35"
                is_hidden: false
                weight: 1
              - name: eq-match
                stdin: "3\nscore eq 100\nid:1 score:100\nid:2 score:90\nid:3 score:100\n"
                expected_stdout: "id:1 score:100\nid:3 score:100"
                is_hidden: false
                weight: 1
              - name: no-match
                stdin: "2\nage lt 10\nname:Alice age:30\nname:Bob age:20\n"
                expected_stdout: "none"
                is_hidden: false
                weight: 1
              - name: lte-hidden
                stdin: "4\nval lte 5\nx:5 y:1\nx:6 y:2\nx:3 y:3\nx:5 y:4\n"
                expected_stdout: "x:5 y:1\nx:3 y:3\nx:5 y:4"
                is_hidden: true
                weight: 1
              - name: gte-hidden
                stdin: "3\ncount gte 50\ncount:50\ncount:49\ncount:100\n"
                expected_stdout: "count:50\ncount:100"
                is_hidden: true
                weight: 1

  - title: The Aggregation Framework
    summary: "Pipeline stages - $match, $group, $project, $sort, $lookup."
    order_index: 3
    lessons:
      - slug: aggregation-pipeline
        title: The Aggregation Pipeline
        type: reading
        duration_minutes: 14
        content_file: lessons/aggregation-pipeline.md
      - slug: aggregation-exercise
        title: "Simulate a $group + $sort Pipeline"
        type: exercise
        duration_minutes: 25
        content_file: lessons/aggregation-exercise.md
        exercises:
          - slug: mongo-group-sum
            title: Group and Sum (Aggregation Simulation)
            difficulty: medium
            points: 20
            prompt_file: lessons/mongo-group-sum.prompt.md
            supported_languages: [python]
            tags: [mongodb, aggregation]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().splitlines()
                    if not data:
                        return
                    n = int(data[0])
                    sums = {}
                    for ln in data[1:1+n]:
                        cat, amt = ln.split(",")
                        sums[cat] = sums.get(cat, 0) + int(amt)
                    # sort by total desc, then category asc
                    items = sorted(sums.items(), key=lambda kv: (-kv[1], kv[0]))
                    print("\n".join(f"{k},{v}" for k, v in items))

                solve()
            test_cases:
              - name: basic
                stdin: "5\nbooks,10\ntoys,5\nbooks,20\ntoys,15\nbooks,7\n"
                expected_stdout: "books,37\ntoys,20"
                is_hidden: false
                weight: 1
              - name: alpha-tiebreak
                stdin: "4\nz,10\na,10\nb,5\nc,5\n"
                expected_stdout: "a,10\nz,10\nb,5\nc,5"
                is_hidden: false
                weight: 1
              - name: one-group
                stdin: "3\nx,1\nx,2\nx,3\n"
                expected_stdout: "x,6"
                is_hidden: true
                weight: 1
              - name: many-groups
                stdin: "6\na,1\nb,2\nc,3\nb,2\na,1\nc,3\n"
                expected_stdout: "c,6\nb,4\na,2"
                is_hidden: true
                weight: 1

