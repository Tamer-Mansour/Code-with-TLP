          - slug: mongodb-index-selectivity
            title: Index Selectivity Analyzer
            difficulty: medium
            points: 20
            prompt_file: lessons/mongodb-index-selectivity.prompt.md
            supported_languages: [python]
            tags: [mongodb, indexes, performance, selectivity]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                lines = [line.strip() for line in sys.stdin if line.strip()]
                n = int(lines[0])
                values = lines[1:n+1]

                # TODO: compute selectivity = unique / total
                # Classify as HIGH (>=0.8), MEDIUM (>=0.5), or LOW (<0.5)
                # Print: selectivity:<ratio> quality:<LEVEL>
            solution_code:
              python: |
                import sys

                lines = [line.strip() for line in sys.stdin if line.strip()]
                n = int(lines[0])
                values = lines[1:n+1]

                total = len(values)
                unique = len(set(values))
                ratio = unique / total if total > 0 else 0

                if ratio >= 0.8:
                    quality = 'HIGH'
                elif ratio >= 0.5:
                    quality = 'MEDIUM'
                else:
                    quality = 'LOW'

                print(f'selectivity:{ratio:.2f} quality:{quality}')
            test_cases:
              - name: medium-selectivity
                stdin: "10\nAlice\nBob\nAlice\nCharlie\nAlice\nBob\nDave\nEve\nAlice\nBob\n"
                expected_stdout: "selectivity:0.50 quality:MEDIUM"
