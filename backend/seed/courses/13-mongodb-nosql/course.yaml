            prompt_file: lessons/mongo-group-sum.prompt.md
            supported_languages: [python]
            tags: [mongodb, aggregation]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys
                def solve():
                    pass
                solve()
            solution_code:
              python: |
                import sys

                def solve():
                    data = sys.stdin.read().splitlines()
                    if not data:
                        return
                    n = int(data[0])
                    sums = {}
                    for ln in data[1:1+n]:
                        cat, amt = ln.split(",")
                        sums[cat] = sums.get(cat, 0) + int(amt)
                    # sort by total desc, then category asc
                    items = sorted(sums.items(), key=lambda kv: (-kv[1], kv[0]))
                    print("\n".join(f"{k},{v}" for k, v in items))

                solve()
            test_cases:
              - name: basic
                stdin: "5\nbooks,10\ntoys,5\nbooks,20\ntoys,15\nbooks,7\n"
                expected_stdout: "books,37\ntoys,20"
                is_hidden: false
                weight: 1
              - name: alpha-tiebreak
                stdin: "4\nz,10\na,10\nb,5\nc,5\n"
