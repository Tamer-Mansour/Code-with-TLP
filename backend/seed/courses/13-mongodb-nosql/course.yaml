            supported_languages: [python]
            tags: [mongodb, aggregation, match, group]
            time_limit_ms: 2000
            memory_limit_mb: 128
            starter_code:
              python: |
                import sys

                lines = [line.strip() for line in sys.stdin if line.strip()]
                idx = 0

                n = int(lines[idx]); idx += 1
                records = []
                for _ in range(n):
                    # TODO: parse category:value records
                    idx += 1

                # TODO: parse $match and $group stages, then compute count and sum
            solution_code:
              python: |
                import sys

                lines = [line.strip() for line in sys.stdin if line.strip()]
                idx = 0

                n = int(lines[idx]); idx += 1
                records = []
                for _ in range(n):
                    cat, val = lines[idx].split(':')
                    records.append((cat.strip(), int(val.strip())))
                    idx += 1

                match_line = lines[idx]; idx += 1
                match_cat = match_line.split('=', 1)[1].strip()

                idx += 1  # consume $group line

                matched = [v for cat, v in records if cat == match_cat]
                print(f'count:{len(matched)}')
                print(f'sum:{sum(matched)}')
            test_cases:
              - name: basic-fruit
                stdin: "5\nfruit:10\nvegetable:20\nfruit:30\nfruit:5\nvegetable:15\n$match category=fruit\n$group\n"
